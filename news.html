<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新製品ニュース | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><style>.newsHero{padding:28px 0 12px}.newsHero h1{margin:5px 0 8px;font-size:30px}.filters{display:flex;gap:8px;overflow:auto;padding:8px 0 14px}.filter{border:1px solid #d9dee8;background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap}.filter.active{background:#172033;color:#fff}.newsGrid{display:grid;gap:14px}.newsCard{background:#fff;border:1px solid #e2e6ee;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(20,30,50,.05)}.newsTop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.date{font-size:12px;color:#687386;font-weight:800}.badge{font-size:12px;border-radius:999px;background:#eef1f6;padding:5px 9px;font-weight:900}.newsCard h2{font-size:20px;margin:10px 0 5px}.models{font-weight:900;margin-bottom:10px}.summary,.point{line-height:1.7}.point{margin-top:10px;background:#f5f7fa;border-radius:12px;padding:12px}.official{display:inline-block;margin-top:12px;font-weight:900}.empty{padding:24px;background:#fff;border-radius:16px}@media(max-width:600px){.newsHero h1{font-size:26px}.newsCard{padding:15px}}</style></head><body><div id="header"></div><main class="shell"><section class="newsHero"><div class="eyebrow">NEW PRODUCT NEWS</div><h1>新製品ニュース</h1><p>新製品・シリーズ更新をジャンル別に確認。販売時に見るべき変更点と提案ポイントをまとめます。</p></section><div id="filters" class="filters"></div><div id="count" class="count"></div><div id="cards" class="newsGrid"></div><div class="footer">価格・発売日・仕様は変更される場合があります。販売時はメーカー公式情報を最終確認してください。</div></main><script src="site.js?v=20261001-news"></script><script>document.getElementById('header').innerHTML=KadenSite.nav('news');</script><script src="nav_qa_patch.js?v=20261001-stable"></script><script>var data=[],genre='すべて';function esc(s){return KadenSite.esc(s)}function renderFilters(){var gs=['すべて'].concat(data.map(function(x){return x.genre}).filter(function(x,i,a){return a.indexOf(x)===i}));document.getElementById('filters').innerHTML=gs.map(function(g){return'<button class="filter '+(g===genre?'active':'')+'" data-g="'+esc(g)+'">'+esc(g)+'</button>'}).join('');document.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){genre=b.dataset.g;renderFilters();render()}})}function render(){var xs=data.filter(function(x){return genre==='すべて'||x.genre===genre}).sort(function(a,b){return String(b.date).localeCompare(String(a.date))});document.getElementById('count').textContent=xs.length+'件';document.getElementById('cards').innerHTML=xs.length?xs.map(function(x){return'<article class="newsCard"><div class="newsTop"><span class="date">'+esc(x.date)+'</span><span class="badge">'+esc(x.genre)+'</span><span class="badge">'+esc(x.status)+'</span></div><h2>'+esc(x.title)+'</h2><div class="models">'+esc(x.maker)+' ｜ '+esc(x.models)+'</div><div class="summary">'+esc(x.summary)+'</div><div class="point"><b>接客ポイント</b><br>'+esc(x.point)+'</div>'+(x.url?'<a class="official" href="'+esc(x.url)+'" target="_blank" rel="noopener">メーカー公式情報を見る →</a>':'')+'</article>'}).join(''):'<div class="empty">このジャンルのニュースはまだありません。</div>'}fetch('news_data.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){data=d;renderFilters();render()}).catch(function(){document.getElementById('cards').innerHTML='<div class="empty">ニュースを読み込めませんでした。</div>'});</script></body></html>
