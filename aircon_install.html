<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>エアコン工事確認 | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="aircon_install.css"></head><body><div id="header"></div><main class="shell"><div id="app"><div class="empty">読み込み中...</div></div><div class="footer">標準工事・追加工事の範囲や料金は販売施工店ごとに異なります。最終判断は施工担当者の現地確認を基準にしてください。</div></main><script src="site.js"></script><script>(function(){document.getElementById('header').innerHTML=KadenSite.nav('');function load(){return fetch('aircon_install.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error();return r.json()})}function esc(v){return KadenSite.esc(v)}function photoItems(){return['室内機を付ける壁全体','室内機まわりのコンセント','分電盤・ブレーカー','配管穴と既存配管','室外機の設置場所','建物外壁と室内機〜室外機の位置関係']}load().then(function(data){var checks=data.checks||[];document.getElementById('app').innerHTML='<section class="installHero"><div class="eyebrow">AIRCON INSTALLATION</div><h1>エアコン工事ヒアリング</h1><p>当てはまる項目を選ぶと、追加工事になりそうな内容を先に洗い出します。接客時に「当日追加になりそうなもの」を見落としにくくするためのチェックです。</p>'+KadenSite.productTabs({id:'aircon'},'install')+'</section><div class="notice">追加料金を確定するページではありません。施工条件・建物構造・販売施工店の標準工事範囲によって変わります。</div><section class="section"><div class="sectionHead"><div><h2>当てはまる条件</h2><p>分からない項目は無理に選ばず、写真・現地確認へ。</p></div></div><div class="installGrid">'+checks.map(function(c){return'<label class="installCheck"><input type="checkbox" value="'+esc(c.id)+'"><b>'+esc(c.question)+'</b><span>'+esc(c.detail)+'</span></label>'}).join('')+'</div></section><section class="installResult"><div id="summary" class="installSummary"><b>追加工事候補 0件</b><span>現在は標準的な条件として見ています。</span></div><div id="works" class="workGrid"></div></section><section class="section"><div class="sectionHead"><div><h2>お客様に撮ってきてもらうと良い写真</h2><p>工事可否・追加工事の判断がかなりしやすくなります。</p></div></div><div class="photoList">'+photoItems().map(function(x){return'<div class="photoItem">'+esc(x)+'</div>'}).join('')+'</div><div class="installActions"><button id="copy" class="btn secondary">確認内容をコピー</button><a class="btn secondary" target="_blank" rel="noopener" href="https://www.ac.daikin.co.jp/customercenter/useful/ra_check/main">ダイキン事前チェック</a></div></section>';function selected(){var ids=Array.prototype.map.call(document.querySelectorAll('.installCheck input:checked'),function(x){return x.value});return checks.filter(function(c){return ids.indexOf(c.id)>=0})}function render(){var list=selected(),sum=document.getElementById('summary'),works=document.getElementById('works');if(!list.length){sum.innerHTML='<b>追加工事候補 0件</b><span>現在は標準的な条件として見ています。専用回路・配管穴・室外機位置は必ず最終確認してください。</span>';works.innerHTML='';return}sum.innerHTML='<b>追加工事候補 '+list.length+'件</b><span>下記は「可能性あり」。施工担当者へ確認する項目として使ってください。</span>';works.innerHTML=list.map(function(c){return'<article class="workCard"><div class="workReason">'+esc(c.question)+'</div><h3>'+esc(c.work)+'</h3><p>'+esc(c.detail)+'</p></article>'}).join('')}Array.prototype.forEach.call(document.querySelectorAll('.installCheck input'),function(x){x.onchange=render});document.getElementById('copy').onclick=function(){var list=selected(),txt='エアコン工事確認\n'+(list.length?list.map(function(c){return'・'+c.question+' → '+c.work}).join('\n'):'・追加工事候補なし（要最終確認）')+'\n\n写真：'+photoItems().join('／');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){document.getElementById('copy').textContent='コピーしました';setTimeout(function(){var b=document.getElementById('copy');if(b)b.textContent='確認内容をコピー'},1200)})}};render()}).catch(function(){document.getElementById('app').innerHTML='<div class="empty">工事確認データを読み込めませんでした。</div>'})})();</script></body></html>
