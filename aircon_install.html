<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>エアコン工事確認 | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="aircon_install.css"></head><body><div id="header"></div><main class="shell"><div id="app"><div class="empty">読み込み中...</div></div><div class="footer">標準工事・追加工事の範囲や料金は販売施工店ごとに異なります。最終判断は施工担当者の現地確認を基準にしてください。</div></main><script src="site.js"></script><script>(function(){document.getElementById('header').innerHTML=KadenSite.nav('');function load(){return fetch('aircon_install.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error();return r.json()})}function esc(v){return KadenSite.esc(v)}function floorOptions(){return'<option value="">未確認</option><option value="1">1階</option><option value="2">2階</option><option value="3">3階</option><option value="4">4階</option><option value="5">5階以上</option>'}function photoItems(){return['室内機を付ける壁全体','室内機まわりのコンセント','分電盤全体とブレーカー表示','室内機から分電盤までの廊下・階段など配線経路','配管穴と既存配管','室外機の設置場所','建物外壁と室内機〜室外機の位置関係']}load().then(function(data){var checks=data.checks||[];document.getElementById('app').innerHTML='<section class="installHero"><div class="eyebrow">AIRCON INSTALLATION</div><h1>エアコン工事ヒアリング</h1><p>階数・分電盤・室外機の位置まで入れて、追加工事になりそうな内容を先に洗い出します。</p>'+KadenSite.productTabs({id:'aircon'},'install')+'</section><div class="notice">追加料金を確定するページではありません。施工条件・建物構造・販売施工店の標準工事範囲によって変わります。</div><section class="siteProfile"><h2>最初に設置条件</h2><p>室内機・室外機・分電盤が何階にあるかで、配管延長・高所作業・専用回路工事の可能性が変わります。</p><div class="profileGrid"><div class="profileField"><label>建物</label><select id="building"><option value="">未確認</option><option value="detached">戸建て</option><option value="condo">分譲マンション・集合住宅</option><option value="rental">賃貸住宅</option></select></div><div class="profileField"><label>室内機を取り付ける階</label><select id="roomFloor">'+floorOptions()+'</select></div><div class="profileField"><label>分電盤・ブレーカーの階</label><select id="panelFloor">'+floorOptions()+'</select></div><div class="profileField"><label>室外機を置く階</label><select id="outdoorFloor">'+floorOptions()+'</select></div><div class="profileField"><label>室外機の置き方</label><select id="outdoorType"><option value="">未確認</option><option value="balcony">同階ベランダ・床置き</option><option value="ground">地面置き</option><option value="roof">屋根置き</option><option value="wall">壁面置き</option><option value="ceiling">ベランダ天吊り</option><option value="double">二段置き</option></select></div><div class="profileField"><label>エアコン専用コンセント</label><select id="dedicated"><option value="">未確認</option><option value="yes">あり</option><option value="no">なし</option><option value="unknown">専用か分からない</option></select></div></div><div id="profileHint" class="profileHint">分かる範囲だけ入力してください。階が違う場合は自動で工事候補を追加します。</div></section><section class="section"><div class="sectionHead"><div><h2>追加で当てはまる条件</h2><p>分からない項目は無理に選ばず、写真・現地確認へ。</p></div></div><div class="installGrid">'+checks.map(function(c){return'<label class="installCheck"><input type="checkbox" value="'+esc(c.id)+'"><b>'+esc(c.question)+'</b><span>'+esc(c.detail)+'</span></label>'}).join('')+'</div></section><section class="installResult"><div id="summary" class="installSummary"><b>追加工事候補 0件</b><span>設置条件を入力すると自動判定します。</span></div><div id="works" class="workGrid"></div></section><section class="section"><div class="sectionHead"><div><h2>お客様に撮ってきてもらうと良い写真</h2><p>特に分電盤と、室内機から分電盤までの経路があると電気工事を判断しやすくなります。</p></div></div><div class="photoList">'+photoItems().map(function(x){return'<div class="photoItem">'+esc(x)+'</div>'}).join('')+'</div><div class="installActions"><button id="copy" class="btn secondary">確認内容をコピー</button><a class="btn secondary" target="_blank" rel="noopener" href="https://www.ac.daikin.co.jp/customercenter/useful/ra_check/main">ダイキン事前チェック</a></div></section>';function num(id){var v=document.getElementById(id).value;return v?Number(v):null}function val(id){return document.getElementById(id).value||''}function selected(){var ids=Array.prototype.map.call(document.querySelectorAll('.installCheck input:checked'),function(x){return x.value});return checks.filter(function(c){return ids.indexOf(c.id)>=0})}function unique(list){var seen={};return list.filter(function(x){var k=x.work+'|'+x.detail;if(seen[k])return false;seen[k]=1;return true})}function autoWorks(){var room=num('roomFloor'),panel=num('panelFloor'),out=num('outdoorFloor'),type=val('outdoorType'),ded=val('dedicated'),building=val('building'),list=[];if(ded==='no'){var d='専用回路がないため、分電盤の空き・容量と室内機までの配線経路を確認する。';if(room&&panel)d+=' 分電盤'+panel+'階→室内機'+room+'階。';list.push({auto:true,reason:'専用コンセントなし',work:'専用回路増設・電気配線工事の可能性',detail:d})}else if(ded==='unknown'){list.push({auto:true,reason:'専用回路か不明',work:'専用回路・ブレーカー確認',detail:'分電盤の表示と室内機付近のコンセントを確認。共用回路なら専用回路増設が必要になる可能性がある。'})}if(room&&panel&&room!==panel&&(ded==='no'||ded==='unknown'||ded==='')){list.push({auto:true,reason:'分電盤と設置階が別階',work:'階をまたぐ電源配線経路の確認',detail:'分電盤は'+panel+'階、室内機は'+room+'階。階段・廊下・外壁など、専用回路をどこへ通せるか確認が必要。配線距離や通線方法によって追加工事の可能性がある。'})}if(room&&out&&room!==out){var diff=Math.abs(room-out);list.push({auto:true,reason:'室内機と室外機が別階',work:'冷媒配管・電線・ドレン延長の可能性',detail:'室内機'+room+'階、室外機'+out+'階。階をまたぐため配管長・高低差を確認。機種ごとの最大配管長・最大高低差も確認する。'});if((room>=2&&out===1)||diff>=2){list.push({auto:true,reason:'外壁をまたぐ別階施工',work:'高所作業・長尺はしご等の可能性',detail:'外壁沿いに配管する場合、高所作業が必要になる可能性が高い。3階以上や安全確保が難しい場所は事前現調を優先する。'})}}if(type==='roof')list.push({auto:true,reason:'室外機が屋根置き',work:'屋根置き架台・特殊設置',detail:'屋根形状・強度・作業スペース・既存架台の再利用可否を確認する。'});if(type==='wall')list.push({auto:true,reason:'室外機が壁面置き',work:'壁面架台・高所作業',detail:'壁強度、架台、作業高さ、安全な施工経路を確認する。'});if(type==='ceiling')list.push({auto:true,reason:'室外機が天吊り',work:'天吊り架台工事',detail:'ベランダ天井の構造、既存アンカー・架台、室外機寸法を確認する。'});if(type==='double')list.push({auto:true,reason:'室外機が二段置き',work:'二段置き架台工事',detail:'上下の室外機サイズ・重量・放熱スペースと既存架台の状態を確認する。'});if(type==='ground'&&room&&room>=2&&!out){list.push({auto:true,reason:'上階の室内機＋地面置き',work:'別階配管・高所作業の可能性',detail:'室内機'+room+'階から地面まで配管する想定。室外機の実際の階・配管経路・外壁作業の可否を確認する。'})}if((building==='condo'||building==='rental')&&selected().some(function(c){return c.id==='no_hole'||c.id==='wall_drill'})){list.push({auto:true,reason:'集合住宅・賃貸で新規穴あけ',work:'管理規約・所有者許可の確認',detail:'共用部や外壁への穴あけ・配管カバー施工に制限がある場合がある。施工前に管理規約や貸主・管理会社への確認を行う。'})}return list}function profileText(){var room=num('roomFloor'),panel=num('panelFloor'),out=num('outdoorFloor'),types={balcony:'同階ベランダ・床置き',ground:'地面置き',roof:'屋根置き',wall:'壁面置き',ceiling:'天吊り',double:'二段置き'},buildings={detached:'戸建て',condo:'分譲マンション・集合住宅',rental:'賃貸住宅'},ded={yes:'専用コンセントあり',no:'専用コンセントなし',unknown:'専用か不明'},arr=[];if(val('building'))arr.push('建物：'+buildings[val('building')]);if(room)arr.push('室内機：'+room+'階');if(panel)arr.push('分電盤：'+panel+'階');if(out)arr.push('室外機：'+out+'階');if(val('outdoorType'))arr.push('室外機：'+types[val('outdoorType')]);if(val('dedicated'))arr.push(ded[val('dedicated')]);return arr}function render(){var manual=selected().map(function(c){return{auto:false,reason:c.question,work:c.work,detail:c.detail}}),auto=autoWorks(),list=unique(auto.concat(manual)),sum=document.getElementById('summary'),works=document.getElementById('works'),profile=profileText();document.getElementById('profileHint').textContent=profile.length?profile.join(' / '):'分かる範囲だけ入力してください。階が違う場合は自動で工事候補を追加します。';if(!list.length){sum.innerHTML='<b>追加工事候補 0件</b><span>現在は大きな追加条件を検出していません。専用回路・配管穴・室外機位置は最終確認してください。</span>';works.innerHTML='';return}sum.innerHTML='<b>追加工事候補 '+list.length+'件</b><span>階数・設置位置からの自動判定を含みます。施工担当者へ確認する項目として使ってください。</span>';works.innerHTML=list.map(function(c){return'<article class="workCard '+(c.auto?'autoWork':'')+'"><div class="workReason">'+(c.auto?'自動判定 / ':'')+esc(c.reason)+'</div><h3>'+esc(c.work)+'</h3><p>'+esc(c.detail)+'</p></article>'}).join('')}Array.prototype.forEach.call(document.querySelectorAll('.installCheck input,#building,#roomFloor,#panelFloor,#outdoorFloor,#outdoorType,#dedicated'),function(x){x.onchange=render});document.getElementById('copy').onclick=function(){var manual=selected(),auto=autoWorks(),profile=profileText(),txt='エアコン工事確認\n';if(profile.length)txt+='【設置条件】\n'+profile.map(function(x){return'・'+x}).join('\n')+'\n\n';txt+='【追加工事候補】\n'+(auto.length||manual.length?auto.map(function(c){return'・'+c.reason+' → '+c.work}).concat(manual.map(function(c){return'・'+c.question+' → '+c.work})).join('\n'):'・追加工事候補なし（要最終確認）')+'\n\n【写真】\n'+photoItems().map(function(x){return'・'+x}).join('\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){document.getElementById('copy').textContent='コピーしました';setTimeout(function(){var b=document.getElementById('copy');if(b)b.textContent='確認内容をコピー'},1200)})}};render()}).catch(function(){document.getElementById('app').innerHTML='<div class="empty">工事確認データを読み込めませんでした。</div>'})})();</script></body></html>
