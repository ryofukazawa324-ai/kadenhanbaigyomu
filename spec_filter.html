<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スペック条件検索 | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><style>[hidden]{display:none!important}.specBox{background:white;border:1px solid #dce3ee;border-radius:14px;padding:16px;margin:14px 0}.specGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.specGrid label{display:grid;gap:5px;font-weight:700}.specGrid select,.specGrid input{padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:white;font-size:16px;max-width:100%}.specCard{background:#fff;border:1px solid #dce3ee;border-radius:12px;padding:14px;margin:10px 0}.specCard h3{margin:0 0 5px}.specCard p{margin:5px 0}.specCard a{color:#355fd6;text-decoration:underline}.specNote{font-size:13px;color:#64748b}.specCard small{color:#64748b}.specToggle{display:flex;gap:8px;flex-wrap:wrap}.specToggle button{padding:10px 18px;border:1px solid #cbd5e1;border-radius:10px;background:white}.specToggle button.active{background:#355fd6;color:white}</style></head><body><div id="header"></div><main class="shell"><h1>スペック条件検索</h1><p>登録済みのPC・カメラを、スペックを指定して絞り込みます。</p><div class="specToggle"><button id="tabPc" class="active">パソコン</button><button id="tabCamera">カメラ</button></div><section class="specBox"><div id="pcFilters" class="specGrid"><label>メモリ容量<select id="ram"><option value="">指定なし</option><option value="8">8GB以上</option><option value="16">16GB以上</option><option value="32">32GB以上</option><option value="64">64GB以上</option></select></label><label>SSD・データ容量<select id="ssd"><option value="">指定なし</option><option value="256">256GB以上</option><option value="512">512GB以上</option><option value="1024">1TB以上</option><option value="2048">2TB以上</option></select></label><label>CPUメーカー・系統<select id="cpu"><option value="">指定なし</option><option value="intel">Intel Core系</option><option value="amd">AMD Ryzen系</option><option value="snapdragon">Snapdragon系</option></select></label><label>画面サイズ<select id="screen"><option value="">指定なし</option><option value="small">13型前後</option><option value="14">14型</option><option value="large">15〜16型</option></select></label></div><div id="cameraFilters" class="specGrid" hidden><label>カメラタイプ<select id="cameraType"><option value="">指定なし</option><option value="camcorder">ビデオカメラ</option><option value="action">アクションカメラ</option><option value="gimbal">ジンバルカメラ</option><option value="mirrorless">ミラーレス</option><option value="compact">コンデジ</option><option value="instant">チェキ</option></select></label><label>センサー<select id="sensor"><option value="">指定なし</option><option value="full">フルサイズ</option><option value="apsc">APS-C</option><option value="one">1型クラス</option><option value="small">小型センサー</option></select></label><label>動画解像度<select id="resolution"><option value="">指定なし</option><option value="4k">4K対応</option><option value="fhd">フルHD以上</option></select></label><label>内蔵メモリー<select id="internal"><option value="">指定なし</option><option value="yes">あり</option><option value="no">なし</option></select></label><label>撮影用途<select id="scene"><option value="">指定なし</option><option value="family">家族・運動会</option><option value="vlog">Vlog</option><option value="action">スポーツ</option><option value="photo">写真</option><option value="longvideo">長時間動画</option></select></label></div><div style="margin-top:12px"><label><input type="checkbox" id="includeUnknown"> 仕様未確認の機種も候補に含める</label></div><p class="specNote">シリーズ単位の仕様が混在します。条件を満たす構成が存在する場合も、店頭型番が一致するとは限りません。未確認の項目は原則として除外します。</p><button id="clear" type="button">条件をリセット</button></section><section class="specBox"><h2 id="resultTitle">検索結果</h2><div id="results">データを読み込み中…</div></section></main><script src="site.js"></script><script>document.getElementById('header').innerHTML=KadenSite.nav('spec')</script><script src="spec_filter.js"></script></body></html>
