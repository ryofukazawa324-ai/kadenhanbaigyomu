<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家電販売ナレッジ</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--sub:#69758a;--line:#dde4ee;--blue:#315bd6;--soft:#edf3ff}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);line-height:1.65}button,input{font:inherit}.wrap{max-width:980px;margin:auto;padding:16px}header{position:sticky;top:0;z-index:20;background:#fffffff5;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:900}.home{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-weight:800;color:#40506a}.search{width:100%;margin-top:12px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px}.hero{padding:28px 0 14px}.hero h1{font-size:30px;line-height:1.25;margin:0 0 8px}.hero p{margin:0;color:var(--sub)}.sectionTitle{font-size:19px;margin:24px 0 10px}.genreGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.genre{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;min-height:105px}.genre b{font-size:17px;display:block}.genre small{display:block;color:var(--sub);margin-top:5px}.specialGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.special{border:0;border-radius:17px;padding:18px;text-align:left;background:#172033;color:#fff}.special.light{background:#e9efff;color:#24365f}.special b{font-size:18px}.special span{display:block;font-size:12px;margin-top:5px;opacity:.8}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:16px 0}.step{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 8px;text-align:center;font-size:12px;font-weight:800}.step strong{display:block;color:var(--blue);font-size:11px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0}.panel h2,.card h2{margin:0 0 8px;font-size:19px}.lead{font-size:14px;color:#46536a}.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}.badge{display:inline-block;background:var(--soft);color:var(--blue);font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;margin-right:5px}.body{font-size:14px;color:#354157}.body div{margin:2px 0}.body .bullet{padding-left:14px;position:relative}.body .bullet:before{content:'•';position:absolute;left:1px;color:var(--blue)}.official{display:inline-block;margin-top:12px;border:1px solid #bfcbed;border-radius:10px;padding:7px 10px;color:#244fbf;text-decoration:none;font-size:12px;font-weight:800;background:#f7f9ff}.consultBox{border-left:4px solid var(--blue);background:#f7f9ff;padding:13px 14px;border-radius:0 13px 13px 0;margin:12px 0}.consultBox b{display:block;margin-bottom:4px}.compareTable{width:100%;border-collapse:collapse;font-size:13px}.compareTable th,.compareTable td{border-bottom:1px solid var(--line);padding:10px 7px;text-align:left;vertical-align:top}.compareTable th{color:#536079;font-size:11px}.back{border:0;background:none;color:var(--blue);font-weight:800;padding:0;margin-bottom:12px}.empty{padding:35px;text-align:center;color:var(--sub)}.note{font-size:12px;color:var(--sub);background:#fff9e8;border:1px solid #eadb9d;border-radius:13px;padding:12px;margin:16px 0}.hidden{display:none!important}footer{color:var(--sub);font-size:12px;padding:28px 0}@media(max-width:700px){.genreGrid{grid-template-columns:1fr 1fr}.specialGrid{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.step{text-align:left}.hero h1{font-size:27px}} </style></head><body><header><div class="wrap"><div class="head"><div class="brand">家電販売ナレッジ</div><button id="homeBtn" class="home">商品ジャンル</button></div><input id="search" class="search" placeholder="商品・機能・メーカーを検索"></div></header><main class="wrap"><div id="app"><div class="empty">読み込み中...</div></div><footer>価格・仕様・保証・対応機種は変更される場合があります。最終案内はメーカー公式情報と販売時点の情報を確認してください。</footer></main><script>(function(){'use strict';var app=document.getElementById('app'),search=document.getElementById('search'),ALL=[],view='home',genre='';var files=['knowledge.json','knowledge_network.json','knowledge_mobile.json','knowledge_support_game.json','knowledge_audio_apple.json','knowledge_camera_printer.json','knowledge_wifi.json','knowledge_pc.json','knowledge_storage_wearables.json','knowledge_recycle.json'];var GROUPS=[['冷蔵庫',['冷蔵庫']],['洗濯機',['洗濯機']],['テレビ',['テレビ画質','テレビ接客','テレビ周辺']],['エアコン',['エアコン']],['炊飯器',['炊飯器']],['パソコン',['PC','Windows','AI PC','Chromebook']],['ネット・Wi-Fi',['ネット','Wi-Fi','BB','回線','LAN']],['カメラ',['カメラ']],['プリンター',['プリンター','年賀状']],['ゲーム',['ゲーム']],['スマホ・Apple',['Apple','スマホ','モバイル']],['記録メディア',['USB-C','ストレージ','メモリー']],['オーディオ',['聞こえサポート','音楽・CD','イヤホン']],['照明',['照明・制度']],['その他',['扇風機','スマートウォッチ','ドアホン']]];var LINKS={三菱電機:{冷蔵庫:'https://www.mitsubishielectric.co.jp/home/reizouko/'},Panasonic:{冷蔵庫:'https://panasonic.jp/reizo/'},パナソニック:{冷蔵庫:'https://panasonic.jp/reizo/'},日立:{冷蔵庫:'https://kadenfan.hitachi.co.jp/rei/'},東芝:{冷蔵庫:'https://www.toshiba-lifestyle.com/jp/refrigerators/'},シャープ:{冷蔵庫:'https://jp.sharp/reizo/'},AQUA:{冷蔵庫:'https://aqua-has.com/product/refrigerator/'},アクア:{冷蔵庫:'https://aqua-has.com/product/refrigerator/'},Haier:{冷蔵庫:'https://www.haier.com/jp/refrigerators/'},ハイアール:{冷蔵庫:'https://www.haier.com/jp/refrigerators/'},キヤノン:{プリンター:'https://personal.canon.jp/product/printer'},Canon:{プリンター:'https://personal.canon.jp/product/printer'},EPSON:{プリンター:'https://www.epson.jp/products/colorio/'},エプソン:{プリンター:'https://www.epson.jp/products/colorio/'},brother:{プリンター:'https://www.brother.co.jp/product/printer/inkjet/'},ブラザー:{プリンター:'https://www.brother.co.jp/product/printer/inkjet/'},DJI:{カメラ:'https://www.dji.com/jp'},GoPro:{カメラ:'https://gopro.com/ja/jp/'},Apple:{'スマホ・Apple':'https://www.apple.com/jp/'},Microsoft:{パソコン:'https://www.microsoft.com/ja-jp/windows/'}};function esc(v){return String(v||'').replace(/[&<>"']/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}function groupOf(x){var s=(x.cat||'')+' '+(x.title||'')+' '+(x.tag||'');for(var i=0;i<GROUPS.length;i++)for(var j=0;j<GROUPS[i][1].length;j++)if(s.indexOf(GROUPS[i][1][j])>=0)return GROUPS[i][0];return'その他'}function body(v){return String(v||'').split(/\n/).map(function(l){var t=l.trim();if(!t)return'';var bullet=/^[・●◯○\-*]/.test(t);if(bullet)t=t.replace(/^[・●◯○\-*]\s*/,'');return'<div class="'+(bullet?'bullet':'')+'">'+esc(t)+'</div>'}).join('')}function official(x,g){var text=(x.title||'')+' '+(x.body||'')+' '+(x.cat||'');for(var maker in LINKS)if(text.toLowerCase().indexOf(maker.toLowerCase())>=0&&LINKS[maker][g])return'<a class="official" target="_blank" rel="noopener" href="'+LINKS[maker][g]+'">'+esc(maker)+' 公式情報を見る</a>';return''}function items(g){return ALL.filter(function(x){return groupOf(x)===g})}function renderHome(){view='home';genre='';var q=search.value.trim().toLowerCase();var groups=GROUPS.map(function(x){return x[0]}).filter(function(g){if(!q)return true;return g.toLowerCase().indexOf(q)>=0||items(g).some(function(x){return((x.title||'')+' '+(x.body||'')+' '+(x.cat||'')).toLowerCase().indexOf(q)>=0})});app.innerHTML='<section class="hero"><h1>商品から、接客の流れで覚える</h1><p>まず商品ジャンルを選択。基礎知識を暗記するより、何を聞いて、何を比べて、どこへ着地させるかを中心にまとめています。</p></section><div class="specialGrid"><button class="special" data-view="basic"><b>基礎知識</b><span>規格・仕組み・用語をまとめて確認</span></button><button class="special light" data-view="makers"><b>メーカー比較</b><span>メーカーごとの強みと提案の着地点</span></button></div><h2 class="sectionTitle">商品ジャンル</h2><div class="genreGrid">'+groups.map(function(g){return'<button class="genre" data-genre="'+esc(g)+'"><b>'+esc(g)+'</b><small>'+items(g).length+'項目　接客の流れを見る</small></button>'}).join('')+'</div>';bind()}function consultIntro(g){var specific={冷蔵庫:['設置幅・容量・家族人数','冷凍室か野菜室、どちらをよく使うか','予算と省エネ・保存機能','メーカー差を比較','使い方に合う機種へ'],洗濯機:['設置寸法・防水パン','容量・洗濯頻度','縦型かドラム','乾燥をどこまで使うか','メーカー機能で絞る'],テレビ:['サイズ・設置場所','何を見るか','液晶・Mini LED・OLED','録画・音・周辺機器','予算に合わせて着地'],カメラ:['何を撮るか','どこで撮るか','写真か動画か','カメラ種類を絞る','必要な記録媒体も確認'],プリンター:['何を印刷するか','月の印刷枚数','写真か文書か','カートリッジか大容量タンク','機能とメーカーで着地'],'ネット・Wi-Fi':['困りごとを確認','回線か宅内Wi-Fiか切り分け','距離・台数・対応規格','ルーターか中継機を選択','端末側の対応も確認'],パソコン:['用途を確認','持ち運び有無','Office・ソフト確認','CPU・メモリ・GPU','メーカーと価格で着地']};return specific[g]||['用途を確認','現在の不満を確認','必要機能を絞る','価格差の理由を比較','候補を2〜3機種へ']}function renderGenre(g){view='genre';genre=g;var list=items(g),steps=consultIntro(g);app.innerHTML='<section class="hero"><button class="back" data-home>商品ジャンルへ戻る</button><h1>'+esc(g)+' 接客コンサル</h1><p>スペックを全部説明するのではなく、質問から候補を絞る順番で確認します。</p></section><div class="flow">'+steps.map(function(s,i){return'<div class="step"><strong>STEP '+(i+1)+'</strong>'+esc(s)+'</div>'}).join('')+'</div><div class="consultBox"><b>接客の基本</b>「何を重視していますか？」だけで終わらず、使い方・今の不満・予算を聞き、差が体感しやすいポイントだけ比較します。</div><div class="chips"><button class="chip active" data-mode="consult">接客順</button><button class="chip" data-mode="basic">基礎知識</button><button class="chip" data-mode="maker">メーカー別</button></div><div id="genreCards"></div>';renderGenreCards('consult');bind()}function classify(x,mode){var s=(x.title||'')+' '+(x.tag||'');if(mode==='maker')return /三菱|Panasonic|パナソニック|日立|東芝|シャープ|AQUA|アクア|Haier|ハイアール|SONY|ソニー|REGZA|TCL|Hisense|ハイセンス|Canon|キヤノン|EPSON|エプソン|brother|ブラザー|DJI|GoPro|Apple|Microsoft/.test(s);if(mode==='basic')return /仕組み|違い|基本|規格|とは|目安|容量|方式|センサー|F値|速度|サイズ/.test(s);return true}function score(x){var s=(x.title||'')+' '+(x.tag||'');if(/最初|確認|選び|買い替え|ヒアリング|まず/.test(s))return 1;if(/容量|サイズ|設置|用途/.test(s))return 2;if(/違い|比較|方式|仕組み/.test(s))return 3;if(/三菱|Panasonic|日立|東芝|シャープ|AQUA|メーカー/.test(s))return 4;return 3}function renderGenreCards(mode){var q=search.value.trim().toLowerCase(),list=items(genre).filter(function(x){return classify(x,mode)&&(!q||((x.title||'')+' '+(x.body||'')+' '+(x.cat||'')).toLowerCase().indexOf(q)>=0)}).sort(function(a,b){return score(a)-score(b)});document.getElementById('genreCards').innerHTML=list.length?list.map(function(x){return'<article class="card"><span class="badge">'+esc(x.tag||x.cat||'知識')+'</span><h2>'+esc(x.title)+'</h2><div class="body">'+body(x.body)+'</div>'+official(x,genre)+'</article>'}).join(''):'<div class="empty">この条件の項目はありません。</div>'}function renderBasic(){view='basic';var q=search.value.trim().toLowerCase(),list=ALL.filter(function(x){return classify(x,'basic')&&(!q||((x.title||'')+' '+(x.body||'')).toLowerCase().indexOf(q)>=0)});app.innerHTML='<section class="hero"><button class="back" data-home>商品ジャンルへ戻る</button><h1>基礎知識</h1><p>規格、仕組み、用語など「接客前に知っておくもの」をまとめたページです。</p></section>'+list.map(function(x){return'<article class="card"><span class="badge">'+esc(groupOf(x))+'</span><h2>'+esc(x.title)+'</h2><div class="body">'+body(x.body)+'</div>'+official(x,groupOf(x))+'</article>'}).join('');bind()}function renderMakers(){view='makers';var q=search.value.trim().toLowerCase(),list=ALL.filter(function(x){return classify(x,'maker')&&(!q||((x.title||'')+' '+(x.body||'')).toLowerCase().indexOf(q)>=0)});app.innerHTML='<section class="hero"><button class="back" data-home>商品ジャンルへ戻る</button><h1>メーカー比較</h1><p>「どこが一番」ではなく、どんなお客様にどのメーカーを着地点にするかで比較します。</p></section><div class="consultBox"><b>比較の考え方</b>価格を抑えたい、冷凍を重視したい、野菜をよく使う、手間を減らしたい、などお客様の優先順位を先に決めます。その後にメーカー固有機能を当てはめます。</div>'+list.map(function(x){return'<article class="card"><span class="badge">'+esc(groupOf(x))+'</span><h2>'+esc(x.title)+'</h2><div class="body">'+body(x.body)+'</div>'+official(x,groupOf(x))+'</article>'}).join('');bind()}function bind(){Array.prototype.forEach.call(document.querySelectorAll('[data-genre]'),function(b){b.onclick=function(){renderGenre(b.getAttribute('data-genre'))}});Array.prototype.forEach.call(document.querySelectorAll('[data-home]'),function(b){b.onclick=renderHome});Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(b){b.onclick=function(){b.getAttribute('data-view')==='basic'?renderBasic():renderMakers()}});Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'),function(b){b.onclick=function(){Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'),function(x){x.classList.remove('active')});b.classList.add('active');renderGenreCards(b.getAttribute('data-mode'))}})}document.getElementById('homeBtn').onclick=renderHome;search.oninput=function(){if(view==='home')renderHome();else if(view==='genre')renderGenreCards(document.querySelector('[data-mode].active')?document.querySelector('[data-mode].active').getAttribute('data-mode'):'consult');else if(view==='basic')renderBasic();else renderMakers()};function fetchOne(f){return fetch(f+'?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return[]})}Promise.all(files.map(fetchOne)).then(function(parts){parts.forEach(function(p){if(Array.isArray(p))ALL=ALL.concat(p)});renderHome()});})();</script></body></html>
