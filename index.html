<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家電販売ナレッジ</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--sub:#637083;--line:#e4e8ef;--accent:#2d67d7;--soft:#eaf1ff;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}button,input,textarea{font:inherit}.wrap{max-width:980px;margin:auto;padding:18px}header{position:sticky;top:0;z-index:10;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.top{display:flex;justify-content:space-between;align-items:center}.title{font-weight:800;font-size:20px}.badge,.tag{font-size:12px;background:var(--soft);color:var(--accent);padding:4px 9px;border-radius:999px}.search{margin-top:12px;width:100%;border:1px solid var(--line);border-radius:14px;padding:13px}.tabs,.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.tabs{margin-top:12px}.filters{margin:14px 0}.tab,.filter,.btn{border:0;border-radius:12px;padding:9px 13px;font-weight:700;white-space:nowrap}.tab,.filter{background:#fff;border:1px solid var(--line)}.tab.active,.filter.active,.btn{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.secondary{background:#eef2f7;color:var(--text)}.hero{padding:28px 4px 8px}.hero h1{font-size:28px;margin:0}.hero p,.meta{color:var(--sub)}.note,.privacy{padding:14px;border-radius:14px;margin:14px 0;font-size:13px}.note{background:#fff8df;border:1px solid #f1df9f}.privacy{background:#eef8f1;border:1px solid #cce8d4}.section-title{font-size:20px;margin:26px 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:16px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.card h2{font-size:18px;margin:7px 0}.card p,.card li{font-size:14px}.card ul{padding-left:20px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px}.field textarea{min-height:140px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.local-card{position:relative}.delete{position:absolute;right:12px;top:12px;border:0;background:#fff0ef;color:var(--danger);border-radius:9px;padding:5px 8px}.empty{text-align:center;color:var(--sub);padding:25px}footer{font-size:12px;color:var(--sub);padding:25px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}.actions .btn{flex:1}}</style></head><body><header><div class="wrap"><div class="top"><div class="title">家電販売ナレッジ</div><span class="badge">家電全般</span></div><input id="q" class="search" placeholder="例：畳数、HDD、分波器、USB-C…"><div class="tabs"><button class="tab active" data-tab="public">一般知識</button><button class="tab" data-tab="local">端末メモ</button></div></div></header><main class="wrap"><section id="publicView"><section class="hero"><h1>接客で使う商品知識</h1><p>短時間で確認できる一般的な家電知識を整理。</p></section><div class="note">価格・工事条件・保証・対応機種・規格は製品や時期で変わります。最終案内はメーカー公式仕様と販売時点の情報を確認してください。</div><div class="filters"><button class="filter active" data-cat="all">すべて</button><button class="filter" data-cat="エアコン">エアコン</button><button class="filter" data-cat="テレビ周辺">テレビ周辺</button><button class="filter" data-cat="USB-C">USB-C</button></div><section class="grid" id="cards"></section></section><section id="localView" class="hidden"><section class="hero"><h1>端末メモ</h1><p>GitHubには送信せず、このブラウザ内だけに保存します。</p></section><div class="privacy">🔒 ブラウザ内に保存。端末変更やWebサイトデータ削除に備えて、必要に応じて書き出してください。</div><div class="panel"><h2>メモを追加</h2><div class="field"><label>タイトル</label><input id="memoTitle"></div><div class="field"><label>カテゴリ</label><input id="memoCategory"></div><div class="field"><label>内容</label><textarea id="memoBody"></textarea></div><div class="actions"><button class="btn" id="saveMemo">保存</button><button class="btn secondary" id="exportMemos">書き出し</button><label class="btn secondary" for="importFile">読み込み</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div></div><div id="memoList" class="grid"></div></section><footer>一般知識は公開側、個人用情報は端末メモ側に分けて管理してください。</footer></main><script>
const KNOWLEDGE=[
{cat:'エアコン',tag:'選び方',title:'畳数の考え方',body:'部屋の広さだけでなく断熱性・気密性も重要。木造、高い天井、吹き抜け、大きな窓、強い西日、最上階などは負荷が増えやすいため、能力に余裕を持たせる。'},
{cat:'エアコン',tag:'ヒアリング',title:'最初に確認',body:'部屋の広さ／戸建て・集合住宅／冷房中心か暖房も使うか／室内機・室外機の場所／配管穴・既存配管／専用コンセント／カーテンレールや梁などの高さ制限。'},
{cat:'エアコン',tag:'設置',title:'室外機',body:'吸込口・吹出口をふさがず通気を確保。強い直射日光や熱がこもる環境は効率低下につながることがある。屋根・壁面・二段置きなどは施工条件を確認。'},
{cat:'エアコン',tag:'設置',title:'専用回路・コンセント',body:'機種ごとに電源仕様が異なるため、専用回路・電圧・コンセント形状を確認。必要に応じて電気工事を依頼する。'},
{cat:'エアコン',tag:'設置',title:'配管と化粧カバー',body:'冷媒配管・ドレンホース・配線で室内外機を接続。化粧カバーは見た目を整え、配管の露出を抑える。長さや曲がりで必要部材が変わる。'},
{cat:'エアコン',tag:'設置',title:'隠蔽配管',body:'壁や天井内部に既設配管が通る方式。状態・径・長さ等により機種制限や洗浄・交換が必要になる場合がある。'},
{cat:'エアコン',tag:'機能',title:'価格差につながる機能',body:'フィルター自動掃除、人感センサー・AI、空気清浄、高性能除湿、換気、加湿、高暖房能力など。'},
{cat:'エアコン',tag:'除湿',title:'弱冷房除湿と再熱除湿',body:'弱冷房除湿は空気を冷やして水分を取り除くため室温も下がりやすい。再熱除湿は除湿した空気を暖め直して戻すため、室温を下げにくい。'},
{cat:'エアコン',tag:'掃除',title:'自動お掃除',body:'一般的には主にフィルターのホコリを取る機能。内部すべてを自動清掃するわけではなく、状態に応じ専門清掃が必要。'},
{cat:'エアコン',tag:'メーカー',title:'三菱電機',body:'センサーを使った気流制御や、一部機種のセルフメンテナンス性が比較ポイント。'},
{cat:'エアコン',tag:'メーカー',title:'ダイキン',body:'温度・湿度制御を重視したラインアップ。上位シリーズには加湿・換気などを備える製品もある。'},
{cat:'エアコン',tag:'メーカー',title:'日立',body:'一部シリーズの凍結洗浄など、熱交換器の汚れ対策を重視した機能が特徴。'},
{cat:'エアコン',tag:'仕組み',title:'冷暖房の仕組み',body:'冷媒を循環させ室内外で熱を移動するヒートポンプを利用。冷房は室内の熱を屋外へ、暖房は屋外の熱を室内へ運ぶ。'},
{cat:'エアコン',tag:'トラブル',title:'ポコポコ音',body:'気密性の高い住宅では気圧差でドレンホースから空気が逆流し音が出ることがある。逆止弁で改善できる場合がある。'},
{cat:'エアコン',tag:'設置',title:'新規穴あけ',body:'構造・配線・配管・管理規約を確認。古い建物では石綿の事前調査が必要になる場合がある。'},
{cat:'エアコン',tag:'サイズ',title:'高さ制限',body:'本体寸法だけでなくメーカー指定の上・左右の施工スペースを確認。'},
{cat:'テレビ周辺',tag:'アンテナ',title:'アンテナケーブル',body:'テレビやBDレコーダー接続で必要。製品によっては付属しないため購入前に確認する。端子は差し込み式のストレート・L型、ねじ込み式のF型などがある。4K・8K放送を使う場合は対応周波数帯を満たすケーブルを選ぶ。長年使用したケーブルは劣化・接触不良も考え、映像不良や買い替え時に状態確認をする。'},
{cat:'テレビ周辺',tag:'アンテナ',title:'分波器',body:'1本のアンテナ線に混合されている地上デジタルとBS/110度CSの信号を分け、それぞれテレビの端子へ接続する。地デジだけなら通常不要。分波器にも挿入損失があるため、受信レベルに余裕がない環境では影響を確認する。BS/CS側は通電仕様も確認。'},
{cat:'テレビ周辺',tag:'アンテナ',title:'分波器と分配器の違い',body:'分波器＝地デジとBS/CSなど周波数帯を分ける。分配器＝同じ信号を複数のテレビや機器へ分ける。用途を混同しない。'},
{cat:'テレビ周辺',tag:'アンテナ',title:'ブースター',body:'受信信号を増幅する機器。ブロックノイズや受信レベル不足がある時の候補だが、原因がケーブル・端子・アンテナ方向・設備側にある場合もあるため、まず受信状態を確認する。'},
{cat:'テレビ周辺',tag:'録画HDD',title:'テレビ録画HDDの基本',body:'一般的なテレビ録画用USB HDDは著作権保護のため、録画したテレビ本体にひも付く方式が多い。テレビを買い替えると、そのままでは以前の録画を再生できない場合がある。'},
{cat:'テレビ周辺',tag:'録画HDD',title:'SeeQVault',body:'SeeQVault対応機器では、対応形式で保存した録画番組を別の対応機器へ引き継げる場合がある。ただしテレビ・レコーダー・HDDのすべてについて、メーカーや型番ごとの対応確認が必要。'},
{cat:'テレビ周辺',tag:'録画HDD',title:'容量の目安',body:'2TBで地デジを約200〜250時間前後録画できる機種が多いが、録画モードや放送のビットレートで変動する。テレビ・レコーダー側に利用可能容量の上限がある場合もある。'},
{cat:'テレビ周辺',tag:'録画HDD',title:'HDD接客時の確認',body:'テレビの型番／USB HDD録画対応の有無／対応容量上限／メーカー動作確認リスト／SeeQVault利用有無／常時録画やタイムシフト用途かを確認。'},
{cat:'USB-C',tag:'基礎',title:'USB Type-Cは形だけでは判断できない',body:'USB Type-Cコネクタは24ピン。充電・USBデータ通信・映像出力など複数用途に使えるが、端末やポートによって対応機能が異なる。「Type-C端子がある＝映像出力できる」ではない。'},
{cat:'USB-C',tag:'映像出力',title:'USB-CからHDMIへ映す条件',body:'端末側USB-CがDisplayPort Alt Mode、Thunderbolt、またはUSB4など映像出力可能な仕様に対応している必要がある。USB 3.2 Gen1/Gen2という表記だけでは映像出力対応とは判断できない。'},
{cat:'USB-C',tag:'接客',title:'Type-C to HDMIの確認ポイント',body:'スマホ・PCの正確な型番と、接続先テレビ・モニターの入力端子を確認。端末仕様でDisplayPort Alt Modeや外部ディスプレイ出力の有無を調べてから案内する。対応していない端末に変換ケーブルを付けても映像は出ない。'},
{cat:'USB-C',tag:'スマホ',title:'スマホのUSB-C映像出力',body:'Androidは機種差が大きく、USB-Cでも映像出力非対応の機種が多い。一方、一部の上位AndroidはDisplayPort Alt Mode等に対応。USB-C搭載iPhoneでも外部ディスプレイ出力に対応するモデルがあるため、機種ごとに仕様確認する。'},
{cat:'USB-C',tag:'PC',title:'ノートPCの映像出力',body:'DisplayPort Alt Mode対応USB-CやThunderbolt 3/4、USB4対応ポートは映像出力できることが多い。ポート横のDisplayPortやThunderboltマークは判断材料になるが、マークがない場合もあるため最終確認はメーカー仕様表で行う。'}
];
const K='kadenhanbaigyomu_local_memos_v1',q=document.getElementById('q'),tabs=[...document.querySelectorAll('.tab')],filters=[...document.querySelectorAll('.filter')],pv=document.getElementById('publicView'),lv=document.getElementById('localView'),cardsEl=document.getElementById('cards');let currentCat='all';const load=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}},save=m=>localStorage.setItem(K,JSON.stringify(m)),esc=v=>String(v||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),norm=v=>String(v||'').trim().replace(/\s+/g,' ').toLowerCase();function tab(){return document.querySelector('.tab.active').dataset.tab}function renderKnowledge(){let s=q.value.trim().toLowerCase(),items=KNOWLEDGE.filter(x=>(currentCat==='all'||x.cat===currentCat)&&(!s||`${x.cat} ${x.tag} ${x.title} ${x.body}`.toLowerCase().includes(s)));cardsEl.innerHTML=items.length?items.map(x=>`<article class="card"><span class="tag">${esc(x.cat)}・${esc(x.tag)}</span><h2>${esc(x.title)}</h2><p>${esc(x.body)}</p></article>`).join(''):'<div class="empty">該当する項目がありません。</div>'}function renderMemos(s=''){const l=document.getElementById('memoList'),x=s.toLowerCase(),m=load().filter(a=>!x||`${a.title} ${a.category} ${a.body}`.toLowerCase().includes(x));l.innerHTML=m.length?m.map(a=>`<article class="card local-card"><button class="delete" data-id="${esc(a.id)}">削除</button><span class="tag">${esc(a.category||'メモ')}</span><h2>${esc(a.title||'無題')}</h2><div class="meta">${new Date(a.updatedAt).toLocaleString('ja-JP')}</div><p style="white-space:pre-wrap">${esc(a.body)}</p></article>`).join(''):'<div class="empty">保存された端末メモはありません。</div>';l.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{if(confirm('削除しますか？')){save(load().filter(a=>a.id!==b.dataset.id));renderMemos(q.value)}})}function filterAll(){tab()==='public'?renderKnowledge():renderMemos(q.value.trim())}q.oninput=filterAll;filters.forEach(f=>f.onclick=()=>{filters.forEach(x=>x.classList.remove('active'));f.classList.add('active');currentCat=f.dataset.cat;renderKnowledge()});tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');let a=t.dataset.tab==='local';pv.classList.toggle('hidden',a);lv.classList.toggle('hidden',!a);q.value='';q.placeholder=a?'端末メモを検索…':'例：畳数、HDD、分波器、USB-C…';filterAll()});document.getElementById('saveMemo').onclick=()=>{let title=memoTitle.value.trim(),category=memoCategory.value.trim(),body=memoBody.value.trim();if(!title&&!body)return alert('タイトルか内容を入力してください');let m=load();m.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,category,body,updatedAt:new Date().toISOString()});save(m);memoTitle.value=memoCategory.value=memoBody.value='';renderMemos()};document.getElementById('exportMemos').onclick=()=>{let blob=new Blob([JSON.stringify({app:'kadenhanbaigyomu',version:2,exportedAt:new Date().toISOString(),memos:load()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kaden-memos-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text()),inc=Array.isArray(d)?d:d.memos;if(!Array.isArray(inc))throw 0;let ex=load(),added=0,same=0,updated=0;for(let raw of inc){let n={id:String(raw.id||''),title:String(raw.title||''),category:String(raw.category||''),body:String(raw.body||''),updatedAt:raw.updatedAt||new Date().toISOString()},byId=n.id?ex.findIndex(x=>x.id===n.id):-1,exact=ex.findIndex(x=>norm(x.title)===norm(n.title)&&norm(x.category)===norm(n.category)&&norm(x.body)===norm(n.body));if(exact>=0){same++;continue}if(byId>=0){let old=ex[byId];if(new Date(n.updatedAt)>new Date(old.updatedAt)){ex[byId]=n;updated++}else same++;continue}n.id=n.id||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now()+Math.random()));ex.push(n);added++}save(ex.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)));renderMemos(q.value);alert(`読み込み完了\n新規追加：${added}件\n重複・据え置き：${same}件\n同一ID更新：${updated}件`)}catch{alert('読み込めないファイルです')}e.target.value=''};renderKnowledge();renderMemos();</script></body></html>
