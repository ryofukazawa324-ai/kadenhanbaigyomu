<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家電販売ナレッジ</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--sub:#637083;--line:#e4e8ef;--accent:#2d67d7;--soft:#eaf1ff;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}button,input,textarea{font:inherit}.wrap{max-width:980px;margin:auto;padding:18px}header{position:sticky;top:0;z-index:10;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.top{display:flex;justify-content:space-between;align-items:center}.title{font-weight:800;font-size:20px}.badge,.tag{font-size:12px;background:var(--soft);color:var(--accent);padding:4px 9px;border-radius:999px}.search{margin-top:12px;width:100%;border:1px solid var(--line);border-radius:14px;padding:13px}.tabs,.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.tabs{margin-top:12px}.filters{margin:14px 0}.tab,.filter,.btn{border:0;border-radius:12px;padding:9px 13px;font-weight:700;white-space:nowrap}.tab,.filter{background:#fff;border:1px solid var(--line)}.tab.active,.filter.active,.btn{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.secondary{background:#eef2f7;color:var(--text)}.hero{padding:28px 4px 8px}.hero h1{font-size:28px;margin:0}.hero p,.meta{color:var(--sub)}.note,.privacy{padding:14px;border-radius:14px;margin:14px 0;font-size:13px}.note{background:#fff8df;border:1px solid #f1df9f}.privacy{background:#eef8f1;border:1px solid #cce8d4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:16px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.card h2{font-size:18px;margin:7px 0}.card p,.card li{font-size:14px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px}.field textarea{min-height:140px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.local-card{position:relative}.delete{position:absolute;right:12px;top:12px;border:0;background:#fff0ef;color:var(--danger);border-radius:9px;padding:5px 8px}.empty{text-align:center;color:var(--sub);padding:25px}footer{font-size:12px;color:var(--sub);padding:25px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}.actions .btn{flex:1}}</style></head><body><header><div class="wrap"><div class="top"><div class="title">家電販売ナレッジ</div><span class="badge">家電全般</span></div><input id="q" class="search" placeholder="例：earU、扇風機、OLED、HDD、USB-C…"><div class="tabs"><button class="tab active" data-tab="public">一般知識</button><button class="tab" data-tab="local">端末メモ</button></div></div></header><main class="wrap"><section id="publicView"><section class="hero"><h1>接客で使う商品知識</h1><p>短時間で確認できる一般的な家電知識を整理。</p></section><div class="note">価格・工事条件・保証・対応機種・規格は製品や時期で変わります。最終案内はメーカー公式仕様と販売時点の情報を確認してください。</div><div class="filters"><button class="filter active" data-cat="all">すべて</button><button class="filter" data-cat="エアコン">エアコン</button><button class="filter" data-cat="テレビ画質">テレビ画質</button><button class="filter" data-cat="テレビ接客">テレビ接客</button><button class="filter" data-cat="テレビ周辺">テレビ周辺</button><button class="filter" data-cat="聞こえサポート">聞こえサポート</button><button class="filter" data-cat="扇風機">扇風機</button><button class="filter" data-cat="USB-C">USB-C</button></div><section class="grid" id="cards"></section></section><section id="localView" class="hidden"><section class="hero"><h1>端末メモ</h1><p>GitHubには送信せず、このブラウザ内だけに保存します。</p></section><div class="privacy">🔒 ブラウザ内に保存。端末変更やWebサイトデータ削除に備えて、必要に応じて書き出してください。</div><div class="panel"><h2>メモを追加</h2><div class="field"><label>タイトル</label><input id="memoTitle"></div><div class="field"><label>カテゴリ</label><input id="memoCategory"></div><div class="field"><label>内容</label><textarea id="memoBody"></textarea></div><div class="actions"><button class="btn" id="saveMemo">保存</button><button class="btn secondary" id="exportMemos">書き出し</button><label class="btn secondary" for="importFile">読み込み</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div></div><div id="memoList" class="grid"></div></section><footer>一般知識は公開側、個人用情報は端末メモ側に分けて管理してください。</footer></main><script>
const KNOWLEDGE=[
{cat:'エアコン',tag:'選び方',title:'畳数の考え方',body:'部屋の広さだけでなく断熱性・気密性も重要。木造、高い天井、吹き抜け、大きな窓、強い西日、最上階などは負荷が増えやすいため、能力に余裕を持たせる。'},
{cat:'エアコン',tag:'ヒアリング',title:'最初に確認',body:'部屋の広さ／戸建て・集合住宅／冷房中心か暖房も使うか／室内機・室外機の場所／配管穴・既存配管／専用コンセント／カーテンレールや梁などの高さ制限。'},
{cat:'エアコン',tag:'設置',title:'室外機',body:'吸込口・吹出口をふさがず通気を確保。強い直射日光や熱がこもる環境は効率低下につながることがある。屋根・壁面・二段置きなどは施工条件を確認。'},
{cat:'エアコン',tag:'設置',title:'専用回路・コンセント',body:'機種ごとに電源仕様が異なるため、専用回路・電圧・コンセント形状を確認。必要に応じて電気工事を依頼する。'},
{cat:'エアコン',tag:'設置',title:'配管と化粧カバー',body:'冷媒配管・ドレンホース・配線で室内外機を接続。化粧カバーは見た目を整え、配管の露出を抑える。長さや曲がりで必要部材が変わる。'},
{cat:'エアコン',tag:'設置',title:'隠蔽配管',body:'壁や天井内部に既設配管が通る方式。状態・径・長さ等により機種制限や洗浄・交換が必要になる場合がある。'},
{cat:'エアコン',tag:'機能',title:'価格差につながる機能',body:'フィルター自動掃除、人感センサー・AI、空気清浄、高性能除湿、換気、加湿、高暖房能力など。'},
{cat:'エアコン',tag:'除湿',title:'弱冷房除湿と再熱除湿',body:'弱冷房除湿は空気を冷やして水分を取り除くため室温も下がりやすい。再熱除湿は除湿した空気を暖め直して戻すため、室温を下げにくい。'},
{cat:'エアコン',tag:'掃除',title:'自動お掃除',body:'一般的には主にフィルターのホコリを取る機能。内部すべてを自動清掃するわけではなく、状態に応じ専門清掃が必要。'},
{cat:'エアコン',tag:'メーカー',title:'三菱電機',body:'センサーを使った気流制御や、一部機種のセルフメンテナンス性が比較ポイント。'},
{cat:'エアコン',tag:'メーカー',title:'ダイキン',body:'温度・湿度制御を重視したラインアップ。上位シリーズには加湿・換気などを備える製品もある。'},
{cat:'エアコン',tag:'メーカー',title:'日立',body:'一部シリーズの凍結洗浄など、熱交換器の汚れ対策を重視した機能が特徴。'},
{cat:'エアコン',tag:'仕組み',title:'冷暖房の仕組み',body:'冷媒を循環させ室内外で熱を移動するヒートポンプを利用。冷房は室内の熱を屋外へ、暖房は屋外の熱を室内へ運ぶ。'},
{cat:'エアコン',tag:'トラブル',title:'ポコポコ音',body:'気密性の高い住宅では気圧差でドレンホースから空気が逆流し音が出ることがある。逆止弁で改善できる場合がある。'},
{cat:'エアコン',tag:'設置',title:'新規穴あけ',body:'構造・配線・配管・管理規約を確認。古い建物では石綿の事前調査が必要になる場合がある。'},
{cat:'エアコン',tag:'サイズ',title:'高さ制限',body:'本体寸法だけでなくメーカー指定の上・左右の施工スペースを確認。'},
{cat:'テレビ画質',tag:'選び方',title:'液晶・Mini LED・OLEDのざっくり選択',body:'黒の深さや暗室での映画画質を重視するならOLED。普段使い・価格とのバランスを重視するなら一般的な液晶。高い明るさと高コントラストを両立したいならMini LED液晶が有力。'},
{cat:'テレビ画質',tag:'OLED',title:'有機EL（OLED）の仕組み',body:'画素そのものが発光する自発光方式。黒を表示する部分は画素を消灯できるため、非常に深い黒と高いコントラストを出しやすい。暗い映画や字幕周辺の黒表現が得意。'},
{cat:'テレビ画質',tag:'液晶',title:'一般的な液晶テレビ',body:'液晶パネルの後ろにバックライトを置いて映像を表示する。OLEDより低価格帯から選びやすく、明るい部屋での日常視聴にも向く。画質はバックライト方式や映像処理によって大きく変わる。'},
{cat:'テレビ画質',tag:'Mini LED',title:'Mini LEDは液晶の上位方式',body:'Mini LEDは液晶テレビのバックライトを非常に小さなLEDで高密度化した方式。多数のエリアを細かく明暗制御することで、一般的な液晶より明るさとコントラストを高めやすい。ただし画素単位で完全消灯するOLEDとは仕組みが違い、条件によって明るい物体の周囲に光がにじむことがある。'},
{cat:'テレビ画質',tag:'RGB LED',title:'RGB LEDバックライト',body:'赤・緑・青のLEDを独立して発光・制御する高級液晶向けバックライト技術。従来のMini LED液晶より色の純度・色域・明るさ・コントラストを高める狙いがある。OLEDのような自発光パネルではなく、あくまでLCD＋バックライト方式なので「OLEDとMini LEDの完全な合体」ではない。'},
{cat:'テレビ画質',tag:'パネル',title:'VAとIPS・ADS系の考え方',body:'液晶パネルにはVA系とIPS・ADS系などがある。一般にVA系は正面視で黒が締まりやすく高コントラスト、IPS・ADS系は斜めから見たときの色や明るさの変化を抑えやすい傾向。実際の見え方はバックライト、表面処理、映像処理でも変わるため、型番・サイズごとに確認する。'},
{cat:'テレビ画質',tag:'接客',title:'パネル性能とメーカー映像処理は別',body:'同じOLEDやMini LEDでも画質は同じにならない。パネル・バックライトの素性に加えて、映像エンジン、アップコンバート、ノイズ処理、色作り、階調、ローカルディミング制御、動き補正などメーカーごとの差が最終画質に大きく影響する。'},
{cat:'テレビ画質',tag:'接客',title:'お客様への短い説明',body:'「黒を一番重視ならOLED。価格とのバランスなら液晶。明るさと高画質を両立したいならMini LED。さらに上位のRGB LED液晶は色と明るさを伸ばした新しい選択肢」と説明すると整理しやすい。'},
{cat:'テレビ接客',tag:'ヒアリング',title:'まず何を見るかを聞く',body:'地デジ中心か、スポーツ、アニメ、映画、Netflixなどのネット動画をよく見るかを確認。映画やライブ、ネット動画をよく見る人には、画質だけでなく音質・HDR・黒表現・サウンドバー連携なども比較軸にする。価格帯だけで画質を断定せず、実際の映像と必要機能で提案する。'},
{cat:'テレビ接客',tag:'音質',title:'画面から音が出るテレビ',body:'一部の有機ELテレビには、画面自体を振動させて音を出す方式がある。映像の位置と音の定位を合わせやすく、セリフなどが画面から聞こえる感覚を作りやすい。すべての有機ELに搭載される機能ではないため機種確認が必要。'},
{cat:'テレビ接客',tag:'サイズ',title:'古いテレビからのサイズアップ',body:'10年以上前のテレビはベゼルが太い機種も多く、同じ外形幅でも現在のテレビなら画面サイズを大きくできる場合がある。「今の何インチか」だけでなく、本体幅・高さ・スタンド幅・設置スペース・視聴距離を確認する。'},
{cat:'テレビ接客',tag:'視聴距離',title:'4KとフルHDの視聴距離目安',body:'目安としてフルHD（2K）は画面の高さの約3倍、4Kは約1.5倍。4Kは画素が細かいため、フルHDより近い距離でも画素の粗さが目立ちにくく、大画面を選びやすい。ただし「4Kだから目が疲れにくい」とは一律に言えず、明るさ・視聴時間・体調などでも快適距離は変わる。'},
{cat:'テレビ接客',tag:'設置',title:'テレビ台・壁寄せ・壁掛け',body:'テレビ台は収納性とスタンド寸法を確認。壁寄せスタンドはテレビのサイズ・重量・VESA等の対応条件を確認。壁掛けはテレビ側の対応だけでなく、金具、壁の構造・下地、耐荷重、配線経路を確認し、必要に応じ専門業者へ依頼する。'},
{cat:'テレビ接客',tag:'設置',title:'既設の壁掛け金具を使う場合',body:'金具の型番、対応サイズ・耐荷重、VESA、必要なネジやスペーサーなど付属部品を確認。型番不明、劣化、部品不足、耐荷重不明などの場合は安全上再利用できないことがある。最終可否は施工業者の基準を優先する。'},
{cat:'テレビ接客',tag:'買い替え',title:'外付けHDD録画は買い替え前に確認',body:'テレビ録画用USB HDDは登録したテレビ本体にひも付く方式が一般的で、新しいテレビへ接続すると初期化が必要になる場合がある。初期化すると録画は消えるため、残したい番組がある場合は買い替え前に、そのテレビが対応するダビング・移行方法やSeeQVault対応の有無を確認する。'},
{cat:'テレビ接客',tag:'買い替え',title:'レコーダー録画はテレビ交換後も使いやすい',body:'ブルーレイレコーダーなど本体内HDDに録画した番組は、レコーダー側に保存されるため、テレビを買い替えても新しいテレビへHDMI接続して引き続き視聴できるのが一般的。機器故障やコピー制御、端子仕様などには注意する。'},
{cat:'テレビ接客',tag:'録画',title:'タイムシフト・全録',body:'指定したチャンネルを対応HDDへ自動録画し、過去番組表からさかのぼって見る機能。録画予約の手間や見逃しを減らせる。REGZAの「タイムシフトマシン」などが代表例。対応チャンネル数、録画可能時間、必要なHDD・接続端子は機種ごとに確認する。'},
{cat:'テレビ接客',tag:'付属品',title:'アンテナケーブルも忘れず確認',body:'テレビ本体だけでは地デジ・BS/CSのアンテナ信号を壁端子から入力できない。アンテナケーブルが付属しないテレビも多いため、既存ケーブルの有無、長さ、端子形状、4K8K対応を確認する。'},
{cat:'テレビ周辺',tag:'アンテナ',title:'アンテナケーブル',body:'テレビやBDレコーダー接続で必要。製品によっては付属しないため購入前に確認する。端子は差し込み式のストレート・L型、ねじ込み式のF型などがある。4K・8K放送を使う場合は対応周波数帯を満たすケーブルを選ぶ。長年使用したケーブルは劣化・接触不良も考え、映像不良や買い替え時に状態確認をする。'},
{cat:'テレビ周辺',tag:'アンテナ',title:'分波器',body:'1本のアンテナ線に混合されている地上デジタルとBS/110度CSの信号を分け、それぞれテレビの端子へ接続する。地デジだけなら通常不要。分波器にも挿入損失があるため、受信レベルに余裕がない環境では影響を確認する。BS/CS側は通電仕様も確認。'},
{cat:'テレビ周辺',tag:'アンテナ',title:'分波器と分配器の違い',body:'分波器＝地デジとBS/CSなど周波数帯を分ける。分配器＝同じ信号を複数のテレビや機器へ分ける。用途を混同しない。'},
{cat:'テレビ周辺',tag:'アンテナ',title:'ブースター',body:'受信信号を増幅する機器。ブロックノイズや受信レベル不足がある時の候補だが、原因がケーブル・端子・アンテナ方向・設備側にある場合もあるため、まず受信状態を確認する。'},
{cat:'テレビ周辺',tag:'録画HDD',title:'テレビ録画HDDの基本',body:'一般的なテレビ録画用USB HDDは著作権保護のため、録画したテレビ本体にひも付く方式が多い。テレビを買い替えると、そのままでは以前の録画を再生できない場合がある。'},
{cat:'テレビ周辺',tag:'録画HDD',title:'SeeQVault',body:'SeeQVault対応機器では、対応形式で保存した録画番組を別の対応機器へ引き継げる場合がある。ただしテレビ・レコーダー・HDDのすべてについて、メーカーや型番ごとの対応確認が必要。'},
{cat:'テレビ周辺',tag:'録画HDD',title:'容量の目安',body:'2TBで地デジを約200〜250時間前後録画できる機種が多いが、録画モードや放送のビットレートで変動する。テレビ・レコーダー側に利用可能容量の上限がある場合もある。'},
{cat:'テレビ周辺',tag:'録画HDD',title:'HDD接客時の確認',body:'テレビの型番／USB HDD録画対応の有無／対応容量上限／メーカー動作確認リスト／SeeQVault利用有無／常時録画やタイムシフト用途かを確認。'},
{cat:'聞こえサポート',tag:'earU',title:'earUは何か',body:'CASIOのearUは、周囲の音を聞き取りやすくする集音機能と音楽・通話機能を備えた「ヒアリングアシストイヤホン」。補聴器（医療機器）ではない。普段の会話は聞こえるが、小さな声や騒がしい場所で聞き取りにくさを感じる人向けの位置づけ。'},
{cat:'聞こえサポート',tag:'earU',title:'耳穴を塞がないオープンイヤー',body:'耳穴を塞がない設計で、自分の声のこもりや閉塞感を抑えつつ、音の方向や距離感を認識しやすくするのが特徴。単純に音を大きくするだけでなく、自然な聞こえを狙った製品。'},
{cat:'聞こえサポート',tag:'earU',title:'ノイズ・ハウリング対策',body:'earUにはノイズ抑制、突発音抑制、風切音抑制、ハウリングキャンセルなどが搭載されている。装着状態や設定は聞こえ方に影響するため、適切なフィッティングと個人設定が重要。'},
{cat:'聞こえサポート',tag:'earU',title:'初回セットアップはスマホ必須',body:'初回はスマートフォンと接続し、専用アプリで左右の聞こえテストを行って個人に合わせた音量・補正を設定する必要がある。設定せずに大きすぎる音量で使うことは耳への負担になるため避ける。初回設定後は通常の集音利用でスマホ常時接続は不要だが、アプリ調整やストリーミングなど一部機能では接続が必要。'},
{cat:'聞こえサポート',tag:'補聴器',title:'補聴器との違い',body:'補聴器は難聴者の聴力改善を目的とする医療機器。耳かけ型、RIC型、耳あな型など複数の形状があり「耳全体を覆うから聞こえやすい」という仕組みではない。聞こえに強い不安がある、難聴と診断されている場合は耳鼻咽喉科や補聴器の専門家への相談を案内する。'},
{cat:'聞こえサポート',tag:'AirPods',title:'AirPods Proのヒアリング補助',body:'AirPods Pro 2／3には、対応するiPhone・iPadなどと組み合わせて軽度〜中程度の難聴向けヒアリング補助機能を使える地域があり、日本も対応。周囲の音の増幅、左右バランス、トーン、環境雑音除去などを個人に合わせて調整できる。対応モデル・OS・地域は最新情報を確認する。'},
{cat:'聞こえサポート',tag:'接客',title:'聞こえ製品の案内ポイント',body:'「少し会話を聞き取りやすくしたい」のか、「難聴への対応が必要」なのかを分けて考える。ヒアリングアシスト製品やイヤホン機能と、医療機器である補聴器は目的・位置づけが異なるため、症状を断定せず適切な相談先も案内する。'},
{cat:'扇風機',tag:'モーター',title:'ACモーターとDCモーター',body:'ACモーターは構造が比較的シンプルで低価格帯に多く、風量調整は少なめの段階になりやすい。DCモーターは低速から細かく制御しやすく、静音性・省エネ性・多段階風量を特徴とする製品が多い。その分、本体価格は高くなりやすい。'},
{cat:'扇風機',tag:'羽根',title:'羽根の枚数と風の質',body:'羽根の枚数が多い製品は、風のムラを抑えて柔らかく自然に近い風を作る狙いがある。ただし「枚数が多いほど必ず良い」とは限らず、羽根の形状・モーター制御・回転数など製品全体の設計で風質や静音性が変わる。'},
{cat:'扇風機',tag:'用途',title:'扇風機とサーキュレーターの違い',body:'扇風機は人が涼を取るため、比較的広がりのある快適な風を送ることを重視。サーキュレーターは部屋の空気を循環させるため、遠くまで届く直進性の高い風を重視する。エアコンと併用して室温ムラを減らす用途にも向く。'},
{cat:'扇風機',tag:'コードレス',title:'充電式・コードレスモデル',body:'充電池を内蔵し、コンセントのない場所へ移動して使える扇風機・サーキュレーターもある。使用可能時間、充電時間、風量、バッテリー交換可否、防水・屋外対応などを確認する。'},
{cat:'扇風機',tag:'接客',title:'扇風機の選び方',body:'価格／静音性／風量の細かさ／自然な風／首振り範囲／高さ調整／タイマー／コードレス利用／サーキュレーター兼用の必要性を確認すると提案しやすい。寝室なら弱風時の静かさ、リビングなら風の広がりや到達距離も比較する。'},
{cat:'USB-C',tag:'基礎',title:'USB Type-Cは形だけでは判断できない',body:'USB Type-Cコネクタは24ピン。充電・USBデータ通信・映像出力など複数用途に使えるが、端末やポートによって対応機能が異なる。「Type-C端子がある＝映像出力できる」ではない。'},
{cat:'USB-C',tag:'映像出力',title:'USB-CからHDMIへ映す条件',body:'端末側USB-CがDisplayPort Alt Mode、Thunderbolt、またはUSB4など映像出力可能な仕様に対応している必要がある。USB 3.2 Gen1/Gen2という表記だけでは映像出力対応とは判断できない。'},
{cat:'USB-C',tag:'接客',title:'Type-C to HDMIの確認ポイント',body:'スマホ・PCの正確な型番と、接続先テレビ・モニターの入力端子を確認。端末仕様でDisplayPort Alt Modeや外部ディスプレイ出力の有無を調べてから案内する。対応していない端末に変換ケーブルを付けても映像は出ない。'},
{cat:'USB-C',tag:'スマホ',title:'スマホのUSB-C映像出力',body:'Androidは機種差が大きく、USB-Cでも映像出力非対応の機種が多い。一方、一部の上位AndroidはDisplayPort Alt Mode等に対応。USB-C搭載iPhoneでも外部ディスプレイ出力に対応するモデルがあるため、機種ごとに仕様確認する。'},
{cat:'USB-C',tag:'PC',title:'ノートPCの映像出力',body:'DisplayPort Alt Mode対応USB-CやThunderbolt 3/4、USB4対応ポートは映像出力できることが多い。ポート横のDisplayPortやThunderboltマークは判断材料になるが、マークがない場合もあるため最終確認はメーカー仕様表で行う。'}
];
const K='kadenhanbaigyomu_local_memos_v1',q=document.getElementById('q'),tabs=[...document.querySelectorAll('.tab')],filters=[...document.querySelectorAll('.filter')],pv=document.getElementById('publicView'),lv=document.getElementById('localView'),cardsEl=document.getElementById('cards');let currentCat='all';const load=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}},save=m=>localStorage.setItem(K,JSON.stringify(m)),esc=v=>String(v||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),norm=v=>String(v||'').trim().replace(/\s+/g,' ').toLowerCase();function tab(){return document.querySelector('.tab.active').dataset.tab}function renderKnowledge(){let s=q.value.trim().toLowerCase(),items=KNOWLEDGE.filter(x=>(currentCat==='all'||x.cat===currentCat)&&(!s||`${x.cat} ${x.tag} ${x.title} ${x.body}`.toLowerCase().includes(s)));cardsEl.innerHTML=items.length?items.map(x=>`<article class="card"><span class="tag">${esc(x.cat)}・${esc(x.tag)}</span><h2>${esc(x.title)}</h2><p>${esc(x.body)}</p></article>`).join(''):'<div class="empty">該当する項目がありません。</div>'}function renderMemos(s=''){const l=document.getElementById('memoList'),x=s.toLowerCase(),m=load().filter(a=>!x||`${a.title} ${a.category} ${a.body}`.toLowerCase().includes(x));l.innerHTML=m.length?m.map(a=>`<article class="card local-card"><button class="delete" data-id="${esc(a.id)}">削除</button><span class="tag">${esc(a.category||'メモ')}</span><h2>${esc(a.title||'無題')}</h2><div class="meta">${new Date(a.updatedAt).toLocaleString('ja-JP')}</div><p style="white-space:pre-wrap">${esc(a.body)}</p></article>`).join(''):'<div class="empty">保存された端末メモはありません。</div>';l.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{if(confirm('削除しますか？')){save(load().filter(a=>a.id!==b.dataset.id));renderMemos(q.value)}})}function filterAll(){tab()==='public'?renderKnowledge():renderMemos(q.value.trim())}q.oninput=filterAll;filters.forEach(f=>f.onclick=()=>{filters.forEach(x=>x.classList.remove('active'));f.classList.add('active');currentCat=f.dataset.cat;renderKnowledge()});tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');let a=t.dataset.tab==='local';pv.classList.toggle('hidden',a);lv.classList.toggle('hidden',!a);q.value='';q.placeholder=a?'端末メモを検索…':'例：earU、扇風機、OLED、HDD、USB-C…';filterAll()});document.getElementById('saveMemo').onclick=()=>{let title=memoTitle.value.trim(),category=memoCategory.value.trim(),body=memoBody.value.trim();if(!title&&!body)return alert('タイトルか内容を入力してください');let m=load();m.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,category,body,updatedAt:new Date().toISOString()});save(m);memoTitle.value=memoCategory.value=memoBody.value='';renderMemos()};document.getElementById('exportMemos').onclick=()=>{let blob=new Blob([JSON.stringify({app:'kadenhanbaigyomu',version:2,exportedAt:new Date().toISOString(),memos:load()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kaden-memos-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text()),inc=Array.isArray(d)?d:d.memos;if(!Array.isArray(inc))throw 0;let ex=load(),added=0,same=0,updated=0;for(let raw of inc){let n={id:String(raw.id||''),title:String(raw.title||''),category:String(raw.category||''),body:String(raw.body||''),updatedAt:raw.updatedAt||new Date().toISOString()},byId=n.id?ex.findIndex(x=>x.id===n.id):-1,exact=ex.findIndex(x=>norm(x.title)===norm(n.title)&&norm(x.category)===norm(n.category)&&norm(x.body)===norm(n.body));if(exact>=0){same++;continue}if(byId>=0){let old=ex[byId];if(new Date(n.updatedAt)>new Date(old.updatedAt)){ex[byId]=n;updated++}else same++;continue}n.id=n.id||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now()+Math.random()));ex.push(n);added++}save(ex.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)));renderMemos(q.value);alert(`読み込み完了\n新規追加：${added}件\n重複・据え置き：${same}件\n同一ID更新：${updated}件`)}catch{alert('読み込めないファイルです')}e.target.value=''};renderKnowledge();renderMemos();</script></body></html>
