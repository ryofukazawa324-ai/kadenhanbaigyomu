<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家電販売ナレッジ</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--sub:#637083;--line:#e4e8ef;--accent:#2d67d7;--soft:#eaf1ff;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}button,input,textarea{font:inherit}.wrap{max-width:980px;margin:auto;padding:18px}header{position:sticky;top:0;z-index:10;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.top{display:flex;justify-content:space-between;align-items:center}.title{font-weight:800;font-size:20px}.badge,.tag{font-size:12px;background:var(--soft);color:var(--accent);padding:4px 9px;border-radius:999px}.search{margin-top:12px;width:100%;border:1px solid var(--line);border-radius:14px;padding:13px}.tabs,.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}.tabs{margin-top:12px}.filters{margin:14px 0}.tab,.filter,.btn{border:0;border-radius:12px;padding:9px 13px;font-weight:700;white-space:nowrap}.tab,.filter{background:#fff;border:1px solid var(--line)}.tab.active,.filter.active,.btn{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.secondary{background:#eef2f7;color:var(--text)}.hero{padding:28px 4px 8px}.hero h1{font-size:28px;margin:0}.hero p,.meta{color:var(--sub)}.note,.privacy{padding:14px;border-radius:14px;margin:14px 0;font-size:13px}.note{background:#fff8df;border:1px solid #f1df9f}.privacy{background:#eef8f1;border:1px solid #cce8d4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:16px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.card h2{font-size:18px;margin:7px 0}.card p,.card li{font-size:14px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px}.field textarea{min-height:140px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.local-card{position:relative}.delete{position:absolute;right:12px;top:12px;border:0;background:#fff0ef;color:var(--danger);border-radius:9px;padding:5px 8px}.empty{text-align:center;color:var(--sub);padding:25px}.count{font-size:12px;color:var(--sub);margin:6px 0 0}footer{font-size:12px;color:var(--sub);padding:25px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}.actions .btn{flex:1}}
</style>
</head>
<body>
<header><div class="wrap"><div class="top"><div class="title">家電販売ナレッジ</div><span class="badge">家電全般</span></div><input id="q" class="search" placeholder="例：洗濯機、OLED、ゼロエミ、USB-C…"><div class="tabs"><button class="tab active" data-tab="public">一般知識</button><button class="tab" data-tab="local">端末メモ</button></div></div></header>
<main class="wrap">
<section id="publicView"><section class="hero"><h1>接客で使う商品知識</h1><p>短時間で確認できる一般的な家電知識を整理。</p></section><div class="note">価格・工事条件・保証・対象制度・対応機種・規格は時期や製品で変わります。最終案内はメーカー公式仕様・制度公式情報・販売時点の最新情報を確認してください。</div><div class="filters" id="filters"></div><div id="count" class="count"></div><section class="grid" id="cards"><div class="empty">読み込み中...</div></section></section>
<section id="localView" class="hidden"><section class="hero"><h1>端末メモ</h1><p>GitHubには送信せず、このブラウザ内だけに保存します。</p></section><div class="privacy">🔒 ブラウザ内に保存。端末変更やWebサイトデータ削除に備えて、必要に応じて書き出してください。</div><div class="panel"><h2>メモを追加</h2><div class="field"><label>タイトル</label><input id="memoTitle"></div><div class="field"><label>カテゴリ</label><input id="memoCategory"></div><div class="field"><label>内容</label><textarea id="memoBody"></textarea></div><div class="actions"><button class="btn" id="saveMemo">保存</button><button class="btn secondary" id="exportMemos">書き出し</button><label class="btn secondary" for="importFile">読み込み</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div></div><div id="memoList" class="grid"></div></section>
<footer>一般知識は公開側、社内・個人用情報は端末メモ側に分けて管理してください。</footer>
</main>
<script>
let KNOWLEDGE=[],currentCat='all';
const K='kadenhanbaigyomu_local_memos_v1',q=document.getElementById('q'),tabs=[...document.querySelectorAll('.tab')],pv=document.getElementById('publicView'),lv=document.getElementById('localView'),cardsEl=document.getElementById('cards'),filtersEl=document.getElementById('filters'),countEl=document.getElementById('count');
const load=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}},save=m=>localStorage.setItem(K,JSON.stringify(m)),esc=v=>String(v||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),norm=v=>String(v||'').trim().replace(/\s+/g,' ').toLowerCase();
function tab(){return document.querySelector('.tab.active').dataset.tab}
function buildFilters(){const cats=[...new Set(KNOWLEDGE.map(x=>x.cat))];filtersEl.innerHTML='<button class="filter active" data-cat="all">すべて</button>'+cats.map(c=>`<button class="filter" data-cat="${esc(c)}">${esc(c)}</button>`).join('');filtersEl.querySelectorAll('.filter').forEach(f=>f.onclick=()=>{filtersEl.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));f.classList.add('active');currentCat=f.dataset.cat;renderKnowledge()})}
function renderKnowledge(){let s=q.value.trim().toLowerCase(),items=KNOWLEDGE.filter(x=>(currentCat==='all'||x.cat===currentCat)&&(!s||`${x.cat} ${x.tag} ${x.title} ${x.body}`.toLowerCase().includes(s)));countEl.textContent=`${items.length}件表示`;cardsEl.innerHTML=items.length?items.map(x=>`<article class="card"><span class="tag">${esc(x.cat)}・${esc(x.tag)}</span><h2>${esc(x.title)}</h2><p>${esc(x.body)}</p></article>`).join(''):'<div class="empty">該当する項目がありません。</div>'}
function renderMemos(s=''){const l=document.getElementById('memoList'),x=s.toLowerCase(),m=load().filter(a=>!x||`${a.title} ${a.category} ${a.body}`.toLowerCase().includes(x));l.innerHTML=m.length?m.map(a=>`<article class="card local-card"><button class="delete" data-id="${esc(a.id)}">削除</button><span class="tag">${esc(a.category||'メモ')}</span><h2>${esc(a.title||'無題')}</h2><div class="meta">${new Date(a.updatedAt).toLocaleString('ja-JP')}</div><p style="white-space:pre-wrap">${esc(a.body)}</p></article>`).join(''):'<div class="empty">保存された端末メモはありません。</div>';l.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{if(confirm('削除しますか？')){save(load().filter(a=>a.id!==b.dataset.id));renderMemos(q.value)}})}
function filterAll(){tab()==='public'?renderKnowledge():renderMemos(q.value.trim())}q.oninput=filterAll;
tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');let a=t.dataset.tab==='local';pv.classList.toggle('hidden',a);lv.classList.toggle('hidden',!a);q.value='';q.placeholder=a?'端末メモを検索…':'例：洗濯機、OLED、ゼロエミ、USB-C…';filterAll()});
document.getElementById('saveMemo').onclick=()=>{let title=memoTitle.value.trim(),category=memoCategory.value.trim(),body=memoBody.value.trim();if(!title&&!body)return alert('タイトルか内容を入力してください');let m=load();m.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,category,body,updatedAt:new Date().toISOString()});save(m);memoTitle.value=memoCategory.value=memoBody.value='';renderMemos()};
document.getElementById('exportMemos').onclick=()=>{let blob=new Blob([JSON.stringify({app:'kadenhanbaigyomu',version:2,exportedAt:new Date().toISOString(),memos:load()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kaden-memos-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};
document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text()),inc=Array.isArray(d)?d:d.memos;if(!Array.isArray(inc))throw 0;let ex=load(),added=0,same=0,updated=0;for(let raw of inc){let n={id:String(raw.id||''),title:String(raw.title||''),category:String(raw.category||''),body:String(raw.body||''),updatedAt:raw.updatedAt||new Date().toISOString()},byId=n.id?ex.findIndex(x=>x.id===n.id):-1,exact=ex.findIndex(x=>norm(x.title)===norm(n.title)&&norm(x.category)===norm(n.category)&&norm(x.body)===norm(n.body));if(exact>=0){same++;continue}if(byId>=0){let old=ex[byId];if(new Date(n.updatedAt)>new Date(old.updatedAt)){ex[byId]=n;updated++}else same++;continue}n.id=n.id||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now()+Math.random()));ex.push(n);added++}save(ex.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)));renderMemos(q.value);alert(`読み込み完了\n新規追加：${added}件\n重複・据え置き：${same}件\n同一ID更新：${updated}件`)}catch{alert('読み込めないファイルです')}e.target.value=''};
fetch('knowledge.json?'+Date.now()).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(d=>{KNOWLEDGE=d;buildFilters();renderKnowledge()}).catch(()=>{cardsEl.innerHTML='<div class="empty">知識データの読み込みに失敗しました。ページを再読み込みしてください。</div>'});
renderMemos();
</script>
</body>
</html>
