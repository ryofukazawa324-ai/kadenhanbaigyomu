<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店頭在庫 | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="inventory.css"></head><body><div id="header"></div><main class="shell"><section class="inventoryHero"><div class="eyebrow">LOCAL STORE INVENTORY</div><h1>店頭在庫</h1><p>接客モードのおすすめ条件に、いま店頭にある型番を当てるためのローカル在庫です。ここで登録したデータはGitHubには送らず、このブラウザ内だけに保存します。</p></section><div class="privacyBox">価格・在庫数・型番などの店舗情報はこの端末だけに保存します。顧客情報や認証情報は登録しないでください。</div><section class="section"><div class="inventoryForm"><h2 id="formTitle">在庫を追加</h2><div class="inventoryFields"><div><label>商品ジャンル</label><select id="product"><option value="refrigerator">冷蔵庫</option><option value="washer">洗濯機</option><option value="tv">テレビ</option><option value="pc">パソコン</option><option value="wifi">Wi-Fi・ルーター</option><option value="printer">プリンター</option><option value="aircon">エアコン</option></select></div><div><label>メーカー</label><input id="maker" placeholder="例：三菱電機"></div><div><label>型番</label><input id="model" placeholder="例：MR-XXXX"></div><div><label>販売価格（円）</label><input id="price" type="number" inputmode="numeric" placeholder="例：149800"></div><div><label id="specLabel">容量・サイズ</label><input id="spec" type="number" inputmode="decimal" placeholder="例：470"></div><div><label>横幅上限確認用（cm）</label><input id="width" type="number" inputmode="decimal" step="0.1" placeholder="例：65"></div><div><label>在庫数</label><input id="stock" type="number" inputmode="numeric" value="1" min="0"></div><div><label>機能タグ</label><input id="tags" placeholder="冷凍, 野菜, 鮮度 など"></div><div class="wide"><label>メモ</label><textarea id="note" placeholder="展示あり、色、売り切り、特徴など"></textarea></div></div><div class="inventoryToolbar"><button id="save" class="btn primary">保存</button><button id="cancel" class="btn secondary" style="display:none">編集をやめる</button><button id="export" class="btn secondary">JSON書き出し</button><label class="fileBtn" for="import">JSON / CSV読み込み</label><input id="import" type="file" accept="application/json,.json,text/csv,.csv" style="display:none"></div></div></section><section class="section"><div class="sectionHead"><div><h2>登録済み在庫</h2><p>接客モードでは、このデータから条件に近い型番を自動で上位表示します。</p></div></div><input id="search" class="search" placeholder="型番・メーカー・機能タグで検索"><div id="summary" class="inventorySummary"></div><div id="filters" class="chips"></div><div id="list" class="inventoryList"></div></section><div class="footer">家電販売ナレッジ</div></main><script src="site.js"></script><script>(function(){document.getElementById('header').innerHTML=KadenSite.nav('inventory');var KEY='kaden_store_inventory_v1',editing=null,filter='all';var labels={refrigerator:'冷蔵庫',washer:'洗濯機',tv:'テレビ',pc:'パソコン',wifi:'Wi-Fi・ルーター',printer:'プリンター',aircon:'エアコン'};var specs={refrigerator:'容量（L）',washer:'洗濯容量（kg）',tv:'画面サイズ（インチ）',pc:'メモリ容量（GB）',wifi:'主要スペック値（任意）',printer:'主要スペック値（任意）',aircon:'畳数目安'};function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}function saveAll(x){localStorage.setItem(KEY,JSON.stringify(x))}function val(id){return document.getElementById(id).value}function num(id){var v=val(id);return v===''?null:Number(v)}function updateSpec(){document.getElementById('specLabel').textContent=specs[val('product')]||'容量・サイズ'}document.getElementById('product').onchange=updateSpec;function reset(){editing=null;document.getElementById('formTitle').textContent='在庫を追加';document.getElementById('save').textContent='保存';document.getElementById('cancel').style.display='none';['maker','model','price','spec','width','tags','note'].forEach(function(id){document.getElementById(id).value=''});document.getElementById('stock').value='1';updateSpec()}function productLabel(id){return labels[id]||id}function render(){var all=load(),q=val('search').trim().toLowerCase(),products=[];all.forEach(function(x){if(products.indexOf(x.product)<0)products.push(x.product)});document.getElementById('filters').innerHTML='<button class="chip '+(filter==='all'?'active':'')+'" data-f="all">すべて</button>'+products.map(function(p){return'<button class="chip '+(filter===p?'active':'')+'" data-f="'+KadenSite.esc(p)+'">'+KadenSite.esc(productLabel(p))+'</button>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('[data-f]'),function(b){b.onclick=function(){filter=b.getAttribute('data-f');render()}});var list=all.filter(function(x){var ok=filter==='all'||x.product===filter,txt=[x.maker,x.model,(x.tags||[]).join(' '),x.note,productLabel(x.product)].join(' ').toLowerCase();return ok&&(!q||txt.indexOf(q)>=0)});var total=all.length,instock=all.filter(function(x){return Number(x.stock||0)>0}).length;document.getElementById('summary').innerHTML='<span class="summaryPill">登録 '+total+'型番</span><span class="summaryPill">在庫あり '+instock+'型番</span>';document.getElementById('list').innerHTML=list.length?list.map(function(x){var tags=Array.isArray(x.tags)?x.tags:[];return'<article class="stockCard"><div class="product">'+KadenSite.esc(productLabel(x.product))+'</div><h3>'+KadenSite.esc(x.model||'型番未入力')+'</h3><div class="maker">'+KadenSite.esc(x.maker||'メーカー未入力')+'</div><div class="stockMeta">'+(x.price!=null?'<span class="stockTag">¥'+Number(x.price).toLocaleString('ja-JP')+'</span>':'')+(x.spec!=null?'<span class="stockTag">'+KadenSite.esc(specs[x.product].replace(/（.*?）/,'')+' '+x.spec)+'</span>':'')+(x.width!=null?'<span class="stockTag">幅 '+x.width+'cm</span>':'')+'<span class="stockTag">在庫 '+Number(x.stock||0)+'</span>'+tags.map(function(t){return'<span class="stockTag">'+KadenSite.esc(t)+'</span>'}).join('')+'</div>'+(x.note?'<p>'+KadenSite.esc(x.note)+'</p>':'')+'<div class="stockActions"><button class="smallBtn" data-edit="'+KadenSite.esc(x.id)+'">編集</button><button class="smallBtn delete" data-del="'+KadenSite.esc(x.id)+'">削除</button></div></article>'}).join(''):'<div class="empty">この条件の在庫はありません。</div>';Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'),function(b){b.onclick=function(){var x=load().find(function(v){return v.id===b.getAttribute('data-edit')});if(!x)return;editing=x.id;document.getElementById('product').value=x.product||'refrigerator';document.getElementById('maker').value=x.maker||'';document.getElementById('model').value=x.model||'';document.getElementById('price').value=x.price==null?'':x.price;document.getElementById('spec').value=x.spec==null?'':x.spec;document.getElementById('width').value=x.width==null?'':x.width;document.getElementById('stock').value=x.stock==null?1:x.stock;document.getElementById('tags').value=(x.tags||[]).join(', ');document.getElementById('note').value=x.note||'';document.getElementById('formTitle').textContent='在庫を編集';document.getElementById('save').textContent='更新';document.getElementById('cancel').style.display='inline-block';updateSpec();window.scrollTo({top:0,behavior:'smooth'})}});Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){b.onclick=function(){if(!confirm('削除しますか？'))return;var id=b.getAttribute('data-del');saveAll(load().filter(function(x){return x.id!==id}));if(editing===id)reset();render()}})}document.getElementById('save').onclick=function(){var model=val('model').trim(),maker=val('maker').trim();if(!model&&!maker){alert('メーカーか型番を入力してください');return}var tags=val('tags').split(/[,、]/).map(function(x){return x.trim()}).filter(Boolean);var item={id:editing||((window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())),product:val('product'),maker:maker,model:model,price:num('price'),spec:num('spec'),width:num('width'),stock:num('stock')==null?0:num('stock'),tags:tags,note:val('note').trim(),updatedAt:new Date().toISOString()};var arr=load();if(editing){var i=arr.findIndex(function(x){return x.id===editing});if(i>=0)arr[i]=item}else arr.unshift(item);saveAll(arr);reset();render()};document.getElementById('cancel').onclick=reset;document.getElementById('search').oninput=render;document.getElementById('export').onclick=function(){var blob=new Blob([JSON.stringify({app:'kadenhanbaigyomu-inventory',version:1,exportedAt:new Date().toISOString(),inventory:load()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kaden-store-inventory-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};function parseCSV(text){var lines=text.replace(/\r/g,'').split('\n').filter(function(x){return x.trim()});if(lines.length<2)return[];var heads=lines[0].split(',').map(function(x){return x.trim().toLowerCase()});return lines.slice(1).map(function(line){var cols=line.split(',');var o={};heads.forEach(function(h,i){o[h]=(cols[i]||'').trim()});return{id:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now()+Math.random()),product:o.product||'refrigerator',maker:o.maker||'',model:o.model||'',price:o.price?Number(o.price):null,spec:o.spec?Number(o.spec):null,width:o.width?Number(o.width):null,stock:o.stock?Number(o.stock):1,tags:(o.tags||'').split(/[|;、]/).map(function(x){return x.trim()}).filter(Boolean),note:o.note||'',updatedAt:new Date().toISOString()}})}document.getElementById('import').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var inc;if(/\.csv$/i.test(f.name))inc=parseCSV(r.result);else{var d=JSON.parse(r.result);inc=Array.isArray(d)?d:(d.inventory||[])}if(!Array.isArray(inc))throw 0;var arr=load();inc.forEach(function(x){var n=Object.assign({id:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now()+Math.random()),product:'refrigerator',maker:'',model:'',price:null,spec:null,width:null,stock:1,tags:[],note:'',updatedAt:new Date().toISOString()},x);if(typeof n.tags==='string')n.tags=n.tags.split(/[,、|;]/).map(function(v){return v.trim()}).filter(Boolean);var i=arr.findIndex(function(v){return v.id===n.id});if(i>=0)arr[i]=n;else arr.push(n)});saveAll(arr);render()}catch(err){alert('読み込めないファイルです')}};r.readAsText(f);e.target.value=''};updateSpec();render()})();</script></body></html>
