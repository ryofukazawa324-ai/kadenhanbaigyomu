<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品コンサル | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"></head><body><div id="header"></div><main class="shell"><div id="app"><div class="empty">読み込み中...</div></div><div class="footer">家電販売ナレッジ</div></main><script src="site.js"></script><script src="audio_compat_patch.js"></script><script>document.getElementById('header').innerHTML=KadenSite.nav('home');Promise.all([KadenSite.loadConfig(),KadenSite.loadKnowledge(),KadenSite.loadOfficialLinks()]).then(function(data){var config=data[0],all=data[1],links=data[2],id=KadenSite.qs('product'),p=KadenSite.getProduct(config,id),items=KadenSite.sortByConsult(all.filter(function(x){return KadenSite.itemMatchesProduct(x,p)}),config);document.title=p.label+' コンサル | 家電販売ナレッジ';var groups=[{n:1,t:'最初に確認',d:'条件と使い方を聞いて、候補を減らす。'},{n:2,t:'方式・性能を選ぶ',d:'お客様に関係する違いだけ説明する。'},{n:3,t:'メーカーを比較',d:'メーカー名ではなく生活上のメリットへ置き換える。'},{n:4,t:'仕上げ確認',d:'保証・周辺機器・設置・注意点まで確認する。'}];function officialHtml(x){var arr=KadenSite.officialFor(x,links);return arr.length?'<div class="officialLinks">'+arr.map(function(l){return'<a class="officialLink" target="_blank" rel="noopener" href="'+KadenSite.esc(l.url)+'">'+KadenSite.esc(l.label)+'</a>'}).join('')+'</div>':''}function cards(stage){var list=items.filter(function(x){return KadenSite.stage(x,config)===stage});if(!list.length)return'';return'<section class="section"><div class="sectionHead"><div><h2>'+groups[stage-1].t+'</h2><p>'+groups[stage-1].d+'</p></div></div><div class="cardGrid">'+list.map(function(x){return'<article class="card"><div class="meta">'+KadenSite.esc(x.tag||x.cat)+'</div><h3>'+KadenSite.esc(x.title)+'</h3><p>'+KadenSite.esc(x.body)+'</p>'+officialHtml(x)+'</article>'}).join('')+'</div></section>'}var makerStrategy='';if((p.makers||[]).length){makerStrategy='<div class="strategy"><h3>比較の組み立て方</h3><p>価格だけで終わらず、まず価格基準を作り、差額で増える機能がこのお客様の使い方に必要かを確認します。詳しいメーカー別の着地点は「メーカー比較」で確認できます。</p></div>'}document.getElementById('app').innerHTML='<section class="hero"><div class="eyebrow">'+KadenSite.esc(p.short)+' CONSULT</div><h1>'+KadenSite.esc(p.label)+'の接客コンサル</h1><p>'+KadenSite.esc(p.lead)+'</p>'+KadenSite.productTabs(p,'consult')+'</section><section class="section"><div class="sectionHead"><div><h2>最初に聞くこと</h2><p>スペック説明より先に確認する項目。</p></div></div><div class="questionBox"><div class="questionList">'+(p.questions||[]).map(function(q){return'<div class="question">'+KadenSite.esc(q)+'</div>'}).join('')+'</div></div></section><section class="section"><div class="sectionHead"><div><h2>接客の流れ</h2><p>この順番で進めると比較軸を作りやすい。</p></div></div><div class="stepList">'+(p.route||[]).map(function(r,i){return'<div class="flowCard"><div class="stepNo">'+(i+1)+'</div><div><h3>'+KadenSite.esc(r.title)+'</h3><p>'+KadenSite.esc(r.body)+'</p></div></div>'}).join('')+'</div>'+makerStrategy+'</section>'+cards(1)+cards(2)+cards(3)+cards(4)}).catch(function(){document.getElementById('app').innerHTML='<div class="empty">データを読み込めませんでした。</div>'});</script></body></html>
