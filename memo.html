<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>端末メモ | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><style>.memoPhotoPreview,.memoPhotos{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.memoPhotoPreview img,.memoPhotos img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid #ddd}.photoItem{position:relative}.photoTap{display:block;border:0;padding:0;background:none;width:100%;cursor:pointer}.photoRemove{position:absolute;right:4px;top:4px;border:0;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;width:26px;height:26px}.photoNote{font-size:12px;opacity:.7;margin-top:6px}.photoViewer{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:0}.photoViewer.open{display:flex}.photoViewer img{display:block;max-width:100vw;max-height:100dvh;width:auto;height:auto;object-fit:contain}.photoViewerClose{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:10001;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:30px;line-height:1}.photoViewerHint{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.55);padding:5px 10px;border-radius:999px;font-size:11px;white-space:nowrap}</style></head><body><div id="header"></div><main class="shell"><section class="hero"><div class="eyebrow">LOCAL MEMO</div><h1>端末メモ</h1><p>メモと写真を、この端末・ブラウザ内だけに保存します。</p></section><div class="notice">保存先はIndexedDBです。タブやブラウザを閉じても保存内容は残りますが、ブラウザのサイトデータ削除・端末初期化などでは消える場合があります。顧客個人情報・パスワードなどの機密情報は保存しないでください。</div><section class="section"><div class="memoPanel"><h2 id="editTitle">メモを追加</h2><div class="field"><label>タイトル</label><input id="title"></div><div class="field"><label>カテゴリ（ / でジャンル分け）</label><input id="category" placeholder="例：返金 / POS / 社内手順"></div><div class="field"><label>内容</label><textarea id="body"></textarea></div><div class="field"><label>写真</label><input id="photos" type="file" accept="image/*" multiple><div class="photoNote">スマホ閲覧向けに長辺1600px・JPEG約78%へ自動圧縮して保存します。複数枚追加できます。</div><div id="photoPreview" class="memoPhotoPreview"></div></div><div class="actions"><button id="save" class="btn primary">保存</button><button id="cancel" class="btn secondary" style="display:none">編集をやめる</button><button id="export" class="btn secondary">書き出し</button><label class="btn secondary" for="import">読み込み</label><input id="import" type="file" accept="application/json,.json" style="display:none"></div></div></section><section class="section"><div class="sectionHead"><div><h2>保存メモ</h2><p id="count"></p></div></div><input id="search" class="search" placeholder="端末メモを検索"><div id="chips" class="chips"></div><div id="list" class="cardGrid"></div></section><div class="footer">家電販売ナレッジ</div></main><div id="photoViewer" class="photoViewer" role="dialog" aria-modal="true" aria-label="写真を拡大表示"><button id="photoViewerClose" class="photoViewerClose" aria-label="閉じる">×</button><img id="photoViewerImg" alt="拡大写真"><div class="photoViewerHint">画面をタップして閉じる</div></div><script src="site.js"></script><script>document.getElementById('header').innerHTML=KadenSite.nav('memo');(function(){var OLD='kadenhanbaigyomu_local_memos_v1',DB='kadenhanbaigyomu_memos',STORE='memos',editing=null,filter='all',draftPhotos=[],db=null,viewer=document.getElementById('photoViewer'),viewerImg=document.getElementById('photoViewerImg');function openViewer(src){viewerImg.src=src;viewer.classList.add('open');document.body.style.overflow='hidden'}function closeViewer(){viewer.classList.remove('open');viewerImg.removeAttribute('src');document.body.style.overflow=''}viewer.onclick=function(e){if(e.target===viewer||e.target===viewerImg)closeViewer()};document.getElementById('photoViewerClose').onclick=closeViewer;document.addEventListener('keydown',function(e){if(e.key==='Escape')closeViewer()});function bindPhotoTaps(root){Array.prototype.forEach.call((root||document).querySelectorAll('[data-photo-src]'),function(b){b.onclick=function(e){e.preventDefault();e.stopPropagation();openViewer(b.getAttribute('data-photo-src'))}})}function openDB(){return new Promise(function(resolve,reject){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=function(){db=r.result;resolve(db)};r.onerror=function(){reject(r.error)}})}function getAll(){return new Promise(function(resolve,reject){var r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=function(){resolve((r.result||[]).sort(function(a,b){return new Date(b.updatedAt)-new Date(a.updatedAt)}))};r.onerror=function(){reject(r.error)}})}function put(m){return new Promise(function(resolve,reject){var r=db.transaction(STORE,'readwrite').objectStore(STORE).put(m);r.onsuccess=function(){resolve()};r.onerror=function(){reject(r.error)}})}function del(id){return new Promise(function(resolve,reject){var r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=function(){resolve()};r.onerror=function(){reject(r.error)}})}function migrate(){try{var raw=localStorage.getItem(OLD);if(!raw)return Promise.resolve();var x=JSON.parse(raw||'[]'),arr=Array.isArray(x)?x:(x&&Array.isArray(x.memos)?x.memos:[]);return Promise.all(arr.map(function(m){return put(m)})).then(function(){localStorage.removeItem(OLD)})}catch(e){return Promise.resolve()}}function parts(v){var a=String(v||'未分類').split(/\s*(?:\/|／|>|＞|→)\s*/).filter(Boolean);return a.length?a:['未分類']}function photoHtml(arr,editable){return(arr||[]).map(function(src,i){return'<div class="photoItem"><button type="button" class="photoTap" data-photo-src="'+src+'"><img src="'+src+'" alt="保存写真"></button>'+(editable?'<button type="button" class="photoRemove" data-photo-del="'+i+'">×</button>':'')+'</div>'}).join('')}function drawPreview(){var el=document.getElementById('photoPreview');el.innerHTML=photoHtml(draftPhotos,true);bindPhotoTaps(el);Array.prototype.forEach.call(el.querySelectorAll('[data-photo-del]'),function(b){b.onclick=function(){draftPhotos.splice(parseInt(b.getAttribute('data-photo-del'),10),1);drawPreview()}})}function reset(){editing=null;draftPhotos=[];['title','category','body'].forEach(function(id){document.getElementById(id).value=''});document.getElementById('photos').value='';document.getElementById('editTitle').textContent='メモを追加';document.getElementById('save').textContent='保存';document.getElementById('cancel').style.display='none';drawPreview()}function compress(file){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var max=1600,w=img.width,h=img.height;if(w>max||h>max){var s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s)}var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}function render(){getAll().then(function(all){var q=document.getElementById('search').value.trim().toLowerCase(),mains=[];all.forEach(function(m){var p=parts(m.category)[0];if(mains.indexOf(p)<0)mains.push(p)});mains.sort();document.getElementById('chips').innerHTML='<button class="chip '+(filter==='all'?'active':'')+'" data-c="all">すべて</button>'+mains.map(function(c){return'<button class="chip '+(filter===c?'active':'')+'" data-c="'+KadenSite.esc(c)+'">'+KadenSite.esc(c)+'</button>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('[data-c]'),function(b){b.onclick=function(){filter=b.getAttribute('data-c');render()}});var list=all.filter(function(m){return(filter==='all'||parts(m.category)[0]===filter)&&(!q||((m.title||'')+' '+(m.category||'')+' '+(m.body||'')).toLowerCase().indexOf(q)>=0)});document.getElementById('count').textContent=list.length+'件表示 / 全'+all.length+'件';document.getElementById('list').innerHTML=list.length?list.map(function(m){return'<article class="card memoCard"><div class="meta">'+KadenSite.esc(parts(m.category).join(' / '))+'</div><h3>'+KadenSite.esc(m.title||'無題')+'</h3><p>'+KadenSite.esc(m.body||'')+'</p>'+((m.photos||[]).length?'<div class="memoPhotos">'+photoHtml(m.photos,false)+'</div>':'')+'<div class="memoActions"><button class="smallBtn" data-edit="'+KadenSite.esc(m.id)+'">編集</button><button class="smallBtn delete" data-del="'+KadenSite.esc(m.id)+'">削除</button></div></article>'}).join(''):'<div class="empty">この条件のメモはありません。</div>';bindPhotoTaps(document.getElementById('list'));Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'),function(b){b.onclick=function(){var id=b.getAttribute('data-edit');getAll().then(function(a){var m=a.find(function(x){return x.id===id});if(!m)return;editing=id;draftPhotos=(m.photos||[]).slice();document.getElementById('title').value=m.title||'';document.getElementById('category').value=m.category||'';document.getElementById('body').value=m.body||'';document.getElementById('editTitle').textContent='メモを編集';document.getElementById('save').textContent='更新';document.getElementById('cancel').style.display='inline-block';drawPreview();window.scrollTo({top:0,behavior:'smooth'})})}});Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){b.onclick=function(){if(confirm('削除しますか？'))del(b.getAttribute('data-del')).then(function(){if(editing===b.getAttribute('data-del'))reset();render()})}})})}document.getElementById('photos').onchange=function(e){var files=Array.prototype.slice.call(e.target.files||[]);Promise.all(files.map(compress)).then(function(a){draftPhotos=draftPhotos.concat(a);drawPreview()}).catch(function(){alert('写真を読み込めませんでした。')});e.target.value=''};document.getElementById('save').onclick=function(){var t=document.getElementById('title').value.trim(),c=document.getElementById('category').value.trim()||'未分類',b=document.getElementById('body').value.trim();if(!t&&!b&&!draftPhotos.length)return;var id=editing||((crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())),m={id:id,title:t,category:c,body:b,photos:draftPhotos.slice(),updatedAt:new Date().toISOString()};put(m).then(function(){reset();render()}).catch(function(){alert('保存できませんでした。端末の空き容量を確認してください。')})};document.getElementById('cancel').onclick=reset;document.getElementById('search').oninput=render;document.getElementById('export').onclick=function(){getAll().then(function(a){var blob=new Blob([JSON.stringify({app:'kadenhanbaigyomu',version:4,storage:'indexeddb',exportedAt:new Date().toISOString(),memos:a},null,2)],{type:'application/json'}),x=document.createElement('a');x.href=URL.createObjectURL(blob);x.download='kaden-memos-'+new Date().toISOString().slice(0,10)+'.json';x.click();setTimeout(function(){URL.revokeObjectURL(x.href)},1000)})};document.getElementById('import').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result),a=Array.isArray(d)?d:d.memos;if(!Array.isArray(a))throw 0;Promise.all(a.map(function(x){return put({id:String(x.id||((crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+Math.random())),title:String(x.title||''),category:String(x.category||'未分類'),body:String(x.body||''),photos:Array.isArray(x.photos)?x.photos:[],updatedAt:x.updatedAt||new Date().toISOString()})})).then(render)}catch(err){alert('読み込めないJSONです')}};r.readAsText(f);e.target.value=''};openDB().then(migrate).then(render).catch(function(){document.getElementById('list').innerHTML='<div class="empty">このブラウザでは端末保存を開始できませんでした。</div>'})})();</script></body></html>
