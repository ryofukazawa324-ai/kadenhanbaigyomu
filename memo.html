<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>端末メモ | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"></head><body><div id="header"></div><main class="shell"><section class="hero"><div class="eyebrow">LOCAL MEMO</div><h1>端末メモ</h1><p>社内・個人用の内容は公開知識と分離して、このブラウザ内だけに保存します。</p></section><div class="notice">顧客個人情報・パスワードなどの機密情報は保存しないでください。端末変更に備えて必要に応じてJSONを書き出してください。</div><section class="section"><div class="memoPanel"><h2 id="editTitle">メモを追加</h2><div class="field"><label>タイトル</label><input id="title"></div><div class="field"><label>カテゴリ（ / でジャンル分け）</label><input id="category" placeholder="例：返金 / POS / 社内手順"></div><div class="field"><label>内容</label><textarea id="body"></textarea></div><div class="actions"><button id="save" class="btn primary">保存</button><button id="cancel" class="btn secondary" style="display:none">編集をやめる</button><button id="export" class="btn secondary">書き出し</button><label class="btn secondary" for="import">読み込み</label><input id="import" type="file" accept="application/json,.json" style="display:none"></div></div></section><section class="section"><div class="sectionHead"><div><h2>保存メモ</h2><p id="count"></p></div></div><input id="search" class="search" placeholder="端末メモを検索"><div id="chips" class="chips"></div><div id="list" class="cardGrid"></div></section><div class="footer">家電販売ナレッジ</div></main><script src="site.js"></script><script>document.getElementById('header').innerHTML=KadenSite.nav('memo');(function(){var KEY='kadenhanbaigyomu_local_memos_v1',editing=null,filter='all';function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:(x&&Array.isArray(x.memos)?x.memos:[])}catch(e){return[]}}function saveAll(x){localStorage.setItem(KEY,JSON.stringify(x))}function parts(v){var a=String(v||'未分類').split(/\s*(?:\/|／|>|＞|→)\s*/).filter(Boolean);return a.length?a:['未分類']}function reset(){editing=null;document.getElementById('title').value='';document.getElementById('category').value='';document.getElementById('body').value='';document.getElementById('editTitle').textContent='メモを追加';document.getElementById('save').textContent='保存';document.getElementById('cancel').style.display='none'}function render(){var all=load(),q=document.getElementById('search').value.trim().toLowerCase(),mains=[];all.forEach(function(m){var p=parts(m.category)[0];if(mains.indexOf(p)<0)mains.push(p)});mains.sort();document.getElementById('chips').innerHTML='<button class="chip '+(filter==='all'?'active':'')+'" data-c="all">すべて</button>'+mains.map(function(c){return'<button class="chip '+(filter===c?'active':'')+'" data-c="'+KadenSite.esc(c)+'">'+KadenSite.esc(c)+'</button>'}).join('');Array.prototype.forEach.call(document.querySelectorAll('[data-c]'),function(b){b.onclick=function(){filter=b.getAttribute('data-c');render()}});var list=all.filter(function(m){var p=parts(m.category)[0],ok=filter==='all'||p===filter,searchOk=!q||((m.title||'')+' '+(m.category||'')+' '+(m.body||'')).toLowerCase().indexOf(q)>=0;return ok&&searchOk});document.getElementById('count').textContent=list.length+'件表示 / 全'+all.length+'件';document.getElementById('list').innerHTML=list.length?list.map(function(m){return'<article class="card memoCard"><div class="meta">'+KadenSite.esc(parts(m.category).join(' / '))+'</div><h3>'+KadenSite.esc(m.title||'無題')+'</h3><p>'+KadenSite.esc(m.body||'')+'</p><div class="memoActions"><button class="smallBtn" data-edit="'+KadenSite.esc(m.id)+'">編集</button><button class="smallBtn delete" data-del="'+KadenSite.esc(m.id)+'">削除</button></div></article>'}).join(''):'<div class="empty">この条件のメモはありません。</div>';Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'),function(b){b.onclick=function(){var id=b.getAttribute('data-edit'),m=load().find(function(x){return x.id===id});if(!m)return;editing=id;document.getElementById('title').value=m.title||'';document.getElementById('category').value=m.category||'';document.getElementById('body').value=m.body||'';document.getElementById('editTitle').textContent='メモを編集';document.getElementById('save').textContent='更新';document.getElementById('cancel').style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'})}});Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){b.onclick=function(){if(!confirm('削除しますか？'))return;var id=b.getAttribute('data-del');saveAll(load().filter(function(x){return x.id!==id}));if(editing===id)reset();render()}})}document.getElementById('save').onclick=function(){var t=document.getElementById('title').value.trim(),c=document.getElementById('category').value.trim()||'未分類',b=document.getElementById('body').value.trim();if(!t&&!b)return;var arr=load(),now=new Date().toISOString();if(editing){var i=arr.findIndex(function(x){return x.id===editing});if(i>=0)arr[i]=Object.assign({},arr[i],{title:t,category:c,body:b,updatedAt:now})}else arr.unshift({id:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now()),title:t,category:c,body:b,updatedAt:now});arr.sort(function(a,b){return new Date(b.updatedAt)-new Date(a.updatedAt)});saveAll(arr);reset();render()};document.getElementById('cancel').onclick=reset;document.getElementById('search').oninput=render;document.getElementById('export').onclick=function(){var blob=new Blob([JSON.stringify({app:'kadenhanbaigyomu',version:2,exportedAt:new Date().toISOString(),memos:load()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kaden-memos-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};document.getElementById('import').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result),inc=Array.isArray(d)?d:d.memos;if(!Array.isArray(inc))throw 0;var ex=load(),ids={};ex.forEach(function(x){ids[x.id]=true});inc.forEach(function(x){var n={id:String(x.id||((window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+Math.random())),title:String(x.title||''),category:String(x.category||'未分類'),body:String(x.body||''),updatedAt:x.updatedAt||new Date().toISOString()};var i=ex.findIndex(function(v){return v.id===n.id});if(i>=0){if(new Date(n.updatedAt)>new Date(ex[i].updatedAt))ex[i]=n}else ex.push(n)});ex.sort(function(a,b){return new Date(b.updatedAt)-new Date(a.updatedAt)});saveAll(ex);render()}catch(err){alert('読み込めないJSONです')}};r.readAsText(f);e.target.value=''};render()})();</script></body></html>
