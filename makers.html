<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>メーカー比較 | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"></head><body><div id="header"></div><main class="shell"><div id="app"><div class="empty">読み込み中...</div></div><div class="footer">家電販売ナレッジ</div></main><script src="site.js"></script><script>document.getElementById('header').innerHTML=KadenSite.nav('makers');KadenSite.loadConfig().then(function(config){var id=KadenSite.qs('product'),products=(config.products||[]).filter(function(p){return(p.makers||[]).length}),current=id?KadenSite.getProduct(config,id):(products[0]||config.products[0]);function draw(){var p=current,makers=p.makers||[];var strategy='';if(p.id==='refrigerator'){strategy='<div class="strategy"><h3>冷蔵庫の比較コンサル例</h3><p>AQUA・Haierを「必要容量を満たす価格基準」に置き、そこから三菱・日立・東芝・パナソニックへ上げた時に、冷凍・鮮度・野菜・収納のどこが増えるかを説明します。三菱を必ずゴールにするのではなく、保存性能や冷凍の価値が刺さるお客様なら上位候補として着地させる、という使い方です。</p></div>'}else{strategy='<div class="strategy"><h3>比較の基本</h3><p>メーカー名から入らず、価格基準を1台作り、差額で増える機能がそのお客様の使い方に必要かを確認します。「高い方が良い」ではなく「この使い方なら差額に意味がある」で着地させます。</p></div>'}document.getElementById('content').innerHTML='<section class="hero"><div class="eyebrow">MAKER CONSULTATION</div><h1>'+KadenSite.esc(p.label)+' メーカー比較</h1><p>「一番良いメーカー」ではなく、どんなお客様に、何を比較軸にして提案するかで整理。</p>'+KadenSite.productTabs(p,'makers')+'</section>'+strategy+'<div class="makerGrid">'+makers.map(function(m){return'<article class="makerCard"><h3>'+KadenSite.esc(m.name)+'</h3><div class="makerPosition">'+KadenSite.esc(m.position)+'</div><dl><dt>向いているお客様</dt><dd>'+KadenSite.esc(m.fit)+'</dd><dt>比較トーク</dt><dd>'+KadenSite.esc(m.compare)+'</dd></dl>'+(m.official?'<div class="officialLinks"><a class="officialLink" target="_blank" rel="noopener" href="'+KadenSite.esc(m.official)+'">公式メーカー情報</a></div>':'')+'</article>'}).join('')+'</div>'}var chips='<div class="chips">'+products.map(function(p){return'<button class="chip '+(p.id===current.id?'active':'')+'" data-p="'+KadenSite.esc(p.id)+'">'+KadenSite.esc(p.label)+'</button>'}).join('')+'</div>';document.getElementById('app').innerHTML='<section class="section"><div class="sectionHead"><div><h2>商品を選ぶ</h2><p>メーカー比較を商品ごとに切り替えます。</p></div></div>'+chips+'</section><div id="content"></div>';Array.prototype.forEach.call(document.querySelectorAll('[data-p]'),function(b){b.onclick=function(){current=KadenSite.getProduct(config,b.getAttribute('data-p'));Array.prototype.forEach.call(document.querySelectorAll('[data-p]'),function(x){x.classList.remove('active')});b.classList.add('active');draw()}});draw()}).catch(function(){document.getElementById('app').innerHTML='<div class="empty">メーカー比較データを読み込めませんでした。</div>'});</script></body></html>
