<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="1000" height="640" rx="24" fill="#f5f8fc"/><text x="44" y="65" font-size="34" font-family="sans-serif" font-weight="bold" fill="#172033">撮像センサーの大きさ（模式図）</text><text x="44" y="104" font-size="20" font-family="sans-serif" fill="#485568">同じ縮尺で比較・ビデオカメラの実機サイズとは別</text><rect x="58" y="150" width="650" height="430" rx="8" fill="#c9d7ec" stroke="#345780" stroke-width="3"/><text x="76" y="184" font-size="25" font-family="sans-serif" font-weight="bold" fill="#16355a">フルサイズ 36×24mm</text><rect x="78" y="218" width="426" height="284" rx="5" fill="#8bb9e7" stroke="#285d93" stroke-width="3"/><text x="96" y="255" font-size="24" font-family="sans-serif" font-weight="bold" fill="#123f6c">APS-C（約）</text><rect x="98" y="302" width="312" height="234" rx="5" fill="#56a8ad" stroke="#126b72" stroke-width="3"/><text x="112" y="335" font-size="21" font-family="sans-serif" font-weight="bold" fill="#063d42">マイクロフォーサーズ</text><rect x="125" y="370" width="238" height="159" rx="5" fill="#e7b45c" stroke="#a36a18" stroke-width="3"/><text x="140" y="405" font-size="23" font-family="sans-serif" font-weight="bold" fill="#513600">1.0型</text><rect x="145" y="440" width="102" height="78" rx="4" fill="#f27c70" stroke="#a83e35" stroke-width="3"/><text x="260" y="470" font-size="21" font-family="sans-serif" fill="#513600">1/2.5型（目安）</text><text x="748" y="190" font-size="25" font-family="sans-serif" font-weight="bold" fill="#172033">接客で見る点</text><text x="748" y="240" font-size="21" font-family="sans-serif" fill="#172033">・暗所のノイズ</text><text x="748" y="290" font-size="21" font-family="sans-serif" fill="#172033">・背景のぼけ</text><text x="748" y="340" font-size="21" font-family="sans-serif" fill="#172033">・レンズの明るさ</text><text x="748" y="390" font-size="21" font-family="sans-serif" fill="#172033">・画素数と処理</text><text x="748" y="455" font-size="19" font-family="sans-serif" fill="#455468">大きいだけで画質が</text><text x="748" y="483" font-size="19" font-family="sans-serif" fill="#455468">必ず決まるわけではない</text><text x="44" y="616" font-size="18" font-family="sans-serif" fill="#59687b">※各規格の代表寸法による概念比較。製品の実センサーサイズはメーカー仕様で確認。</text></svg>