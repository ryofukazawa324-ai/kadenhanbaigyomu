<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>メーカー基礎 | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="maker_basics.css"></head><body><div id="header"></div><main class="shell"><div id="app"><div class="empty">読み込み中...</div></div><div class="footer">メーカーの特徴はシリーズ・型番で変わります。最終案内は現行仕様を確認してください。</div></main><script src="site.js"></script><script>(function(){document.getElementById('header').innerHTML=KadenSite.nav('makerbasics');function load(){return fetch('maker_basics.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error();return r.json()})}function esc(v){return KadenSite.esc(v)}load().then(function(data){var pid=KadenSite.qs('product')||'tv',current=(data.products||[]).find(function(p){return p.id===pid})||(data.products||[])[0];function draw(){document.title=current.label+' メーカー基礎 | 家電販売ナレッジ';var makers=current.makers||[];document.getElementById('content').innerHTML='<section class="makerBasicsHero"><div class="eyebrow">MAKER BASICS / '+esc(current.label)+'</div><h1>'+esc(current.label)+' メーカーごとの違い</h1><p>'+esc(current.lead)+'</p></section><div class="makerIntro"><h2>見方</h2><p>「どのメーカーが一番」ではなく、何を重視するお客様にどのメーカーを出し、メーカー内でどのシリーズまで上げるかを見るページです。</p></div><div class="makerBasicsGrid">'+makers.map(function(m){return'<article class="makerBasicCard"><h3>'+esc(m.name)+'</h3><div class="oneLine">'+esc(m.one)+'</div><dl><dt>強み</dt><dd>'+esc(m.strength)+'</dd><dt>向いているお客様</dt><dd>'+esc(m.fit)+'</dd><dt>接客で確認</dt><dd>'+esc(m.check)+'</dd></dl><div class="seriesBox"><b>シリーズの見方</b>'+esc(m.series)+'</div><div class="officialLinks"><a class="officialLink" target="_blank" rel="noopener" href="'+esc(m.official)+'">公式ラインアップ</a></div></article>'}).join('')+'</div><section class="section"><div class="sectionHead"><div><h2>一気に比較</h2><p>迷った時はこの表で比較軸を戻す。</p></div></div><div class="comparisonWrap"><table class="comparisonTable"><thead><tr><th>メーカー</th><th>一言</th><th>向く人</th><th>シリーズの見方</th></tr></thead><tbody>'+makers.map(function(m){return'<tr><td>'+esc(m.name)+'</td><td>'+esc(m.one)+'</td><td>'+esc(m.fit)+'</td><td>'+esc(m.series)+'</td></tr>'}).join('')+'</tbody></table></div></section>'}document.getElementById('app').innerHTML='<div class="makerBasicsNav">'+(data.products||[]).map(function(p){return'<button class="chip '+(p.id===current.id?'active':'')+'" data-p="'+esc(p.id)+'">'+esc(p.label)+'</button>'}).join('')+'</div><div id="content"></div>';Array.prototype.forEach.call(document.querySelectorAll('[data-p]'),function(b){b.onclick=function(){current=(data.products||[]).find(function(p){return p.id===b.getAttribute('data-p')})||current;Array.prototype.forEach.call(document.querySelectorAll('[data-p]'),function(x){x.classList.remove('active')});b.classList.add('active');draw()}});draw()}).catch(function(){document.getElementById('app').innerHTML='<div class="empty">メーカー基礎データを読み込めませんでした。</div>'})})();</script></body></html>
