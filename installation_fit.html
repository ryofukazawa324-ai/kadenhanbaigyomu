<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>設置サイズ検索 | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><style>.fitPanel{background:#fff;border:1px solid #dce3ee;border-radius:16px;padding:18px;margin:15px 0}.fitFields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.fitFields label{display:grid;gap:4px;font-weight:700}.fitFields input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.fitButtons{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.fitButtons button{border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:10px 16px}.fitButtons button.active{background:#355fd6;color:white}.fitItem{border:1px solid #dce3ee;border-radius:12px;padding:14px;margin:10px 0}.fitItem h3{margin:0 0 5px}.fitItem p{margin:5px 0}.fitItem a{color:#355fd6;text-decoration:underline}.fitSmall{font-size:13px;color:#64748b}</style></head><body><div id="header"></div><main class="shell"><h1>設置サイズ検索</h1><p>設置場所の寸法を入力し、条件に合う機種候補を絞り込みます。単位はすべてmmです。</p><div class="fitButtons"><button type="button" id="fitWash" class="active">洗濯機・防水パン</button><button type="button" id="fitFridge">冷蔵庫・設置スペース</button></div><section class="fitPanel" id="washPanel"><h2>防水パンのサイズ</h2><p class="fitSmall">フチを除いた内寸を入力。奥壁から前面内壁までの距離も測定すると判定精度が上がります。</p><div class="fitFields"><label>内寸幅<input id="panW" type="number" min="1" placeholder="例：590"></label><label>内寸奥行<input id="panD" type="number" min="1" placeholder="例：540"></label><label>奥壁から前面内壁<input id="panBack" type="number" min="1" placeholder="例：590"></label></div></section><section class="fitPanel" id="fridgePanel" hidden><h2>冷蔵庫の設置場所</h2><p class="fitSmall">壁や棚の内側の有効寸法を入力。本体だけでなく必要な放熱余裕も加えて判定します。</p><div class="fitFields"><label>設置可能幅<input id="spaceW" type="number" min="1" placeholder="例：700"></label><label>設置可能奥行<input id="spaceD" type="number" min="1" placeholder="例：750"></label><label>設置可能高さ<input id="spaceH" type="number" min="1" placeholder="例：1950"></label></div></section><div class="fitPanel"><h2>該当機種</h2><p class="fitSmall">公式資料の条件を登録した機種のみ検索対象です。「寸法条件を満たす」は設置確約ではありません。</p><div id="fitResult">読み込み中…</div></div><section class="fitPanel"><h2>機種データを追加</h2><p class="fitSmall">店頭の型番を追加できます。端末内に保存されます。公式据付説明書を確認して入力してください。</p><div class="fitFields"><label>機種名<input id="addName" placeholder="メーカー 型番"></label><label id="addWLabel">必要な防水パン内寸幅<input id="addW" type="number" min="1"></label><label id="addDLabel">必要な防水パン内寸奥行<input id="addD" type="number" min="1"></label><label id="addHLabel" hidden>本体高さ<input id="addH" type="number" min="1"></label><label id="addLeftLabel" hidden>左右それぞれの余裕<input id="addSide" type="number" min="0" value="0"></label><label id="addTopLabel" hidden>上部余裕<input id="addTop" type="number" min="0" value="0"></label><label>公式資料URL<input id="addSource" type="url" placeholder="https://..."></label></div><div class="fitButtons"><button id="fitAdd" type="button">この機種を保存</button></div><div id="fitMsg" class="fitSmall"></div></section></main><script src="site.js"></script><script>document.getElementById('header').innerHTML=KadenSite.nav('fit')</script><script src="installation_fit.js"></script></body></html>
