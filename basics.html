<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基礎知識 | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"></head><body><div id="header"></div><main class="shell"><div id="app"><div class="empty">読み込み中...</div></div><div class="footer">家電販売ナレッジ</div></main><script src="site.js"></script><script>document.getElementById('header').innerHTML=KadenSite.nav('basics');Promise.all([KadenSite.loadConfig(),KadenSite.loadKnowledge(),KadenSite.loadOfficialLinks(),fetch('knowledge_network_install.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():[]}).catch(function(){return[]})]).then(function(data){var config=data[0],all=data[1].concat(data[3]||[]),links=data[2],id=KadenSite.qs('product'),selected=id?KadenSite.getProduct(config,id):null;function officialHtml(x){var arr=KadenSite.officialFor(x,links);return arr.length?'<div class="officialLinks">'+arr.map(function(l){return'<a class="officialLink" target="_blank" rel="noopener" href="'+KadenSite.esc(l.url)+'">'+KadenSite.esc(l.label)+'</a>'}).join('')+'</div>':''}function render(product,q){var items=all.filter(function(x){return(!product||KadenSite.itemMatchesProduct(x,product))&&!KadenSite.isMakerItem(x,config)}).filter(function(x){return!q||((x.title||'')+' '+(x.body||'')+' '+(x.cat||'')+' '+(x.tag||'')).toLowerCase().indexOf(q)>=0});document.getElementById('cards').innerHTML=items.length?items.map(function(x){return'<article class="card"><div class="meta">'+KadenSite.esc(x.cat)+' / '+KadenSite.esc(x.tag)+'</div><h3>'+KadenSite.esc(x.title)+'</h3><p>'+KadenSite.esc(x.body)+'</p>'+officialHtml(x)+'</article>'}).join(''):'<div class="empty">該当する基礎知識がありません。</div>';document.getElementById('count').textContent=items.length+'件'}var chips='<button class="chip '+(!selected?'active':'')+'" data-id="">すべて</button>'+(config.products||[]).map(function(p){return'<button class="chip '+(selected&&selected.id===p.id?'active':'')+'" data-id="'+KadenSite.esc(p.id)+'">'+KadenSite.esc(p.label)+'</button>'}).join('');document.getElementById('app').innerHTML='<section class="hero"><div class="eyebrow">BASIC KNOWLEDGE</div><h1>基礎知識</h1><p>方式・規格・仕組み・用語だけをまとめたページ。接客の流れやメーカー比較とは分けて確認できます。</p>'+(selected?KadenSite.productTabs(selected,'basics'):'')+'</section><input id="search" class="search" placeholder="基礎知識を検索"><div class="chips" id="chips">'+chips+'</div><div id="count" class="count"></div><div id="cards" class="cardGrid"></div>';var current=selected||null,search=document.getElementById('search');function draw(){render(current,search.value.trim().toLowerCase())}search.oninput=draw;Array.prototype.forEach.call(document.querySelectorAll('[data-id]'),function(b){b.onclick=function(){var pid=b.getAttribute('data-id');current=pid?KadenSite.getProduct(config,pid):null;Array.prototype.forEach.call(document.querySelectorAll('[data-id]'),function(x){x.classList.remove('active')});b.classList.add('active');draw()}});draw()}).catch(function(){document.getElementById('app').innerHTML='<div class="empty">データを読み込めませんでした。</div>'});</script></body></html>
