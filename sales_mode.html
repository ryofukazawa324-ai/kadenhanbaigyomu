<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接客モード | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="sales_mode.css"><link rel="stylesheet" href="model_search.css"></head><body><div id="header"></div><main class="shell"><div id="app"><div class="empty">読み込み中...</div></div><div class="footer">おすすめは絞り込みの目安です。最終案内は設置条件・価格・現行仕様を確認してください。</div></main><script src="site.js"></script><script>(function(){document.getElementById('header').innerHTML=KadenSite.nav('sales');var state={product:null,step:0,answers:[],scores:{},conditions:{people:null,spec:null,width:null,budget:null}};var cond={refrigerator:{people:true,spec:'希望容量',unit:'L',options:[200,300,400,500,600],width:true,budget:true},washer:{people:true,spec:'洗濯容量',unit:'kg',options:[7,8,10,12],width:true,budget:true},tv:{spec:'画面サイズ',unit:'インチ',options:[43,50,55,65,75],budget:true},pc:{spec:'最低メモリ',unit:'GB',options:[8,16,32],budget:true},wifi:{budget:true},printer:{budget:true},aircon:{spec:'畳数目安',unit:'畳',options:[6,8,10,14,18,20],budget:true}};function load(){return fetch('sales_mode.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error();return r.json()})}function scoreAdd(scores){Object.keys(scores||{}).forEach(function(k){state.scores[k]=(state.scores[k]||0)+Number(scores[k]||0)})}function resetScores(){state.scores={};state.answers.forEach(function(a){scoreAdd(a.scores)})}function productPage(){return'product.html?product='+encodeURIComponent(state.product.id)}function selectProduct(p){state.product=p;state.step=0;state.answers=[];state.scores={};state.conditions={people:null,spec:null,width:null,budget:null};renderConditions()}function formatYen(v){return v==null?'未指定':'¥'+Number(v).toLocaleString('ja-JP')+'以内'}function inferSpec(){if(state.conditions.spec!=null)return state.conditions.spec;var people=state.conditions.people,p=state.product.id;if(!people)return null;if(p==='refrigerator'){if(people<=1)return 200;if(people===2)return 300;if(people===3)return 400;if(people===4)return 500;return 550}if(p==='washer'){if(people<=1)return 7;if(people===2)return 8;if(people<=4)return 10;return 12}return null}function conditionFields(){var c=cond[state.product.id]||{},html='';if(c.people){html+='<div class="conditionField"><label>使用人数</label><select id="condPeople"><option value="">未定</option><option value="1">1人</option><option value="2">2人</option><option value="3">3人</option><option value="4">4人</option><option value="5">5人以上</option></select></div>'}if(c.spec){html+='<div class="conditionField"><label>'+KadenSite.esc(c.spec)+'</label><select id="condSpec"><option value="">未定・人数から目安</option>'+c.options.map(function(v){return'<option value="'+v+'">'+v+KadenSite.esc(c.unit)+'</option>'}).join('')+'</select></div>'}if(c.width){html+='<div class="conditionField"><label>設置できる横幅上限（cm）</label><input id="condWidth" type="number" inputmode="decimal" step="0.1" placeholder="例：65"></div>'}if(c.budget){html+='<div class="conditionField"><label>予算上限（円）</label><input id="condBudget" type="number" inputmode="numeric" placeholder="例：150000"></div>'}return html}function renderHome(data){state.product=null;document.getElementById('app').innerHTML='<section class="modeHero"><div class="eyebrow">GUIDED CONSULTATION</div><h1>接客モード</h1><p>条件とお客様の要望を順番に選ぶと、最後に「おすすめ容量・機能・メーカー方向性」を作り、その条件で現在販売されている型番を検索できます。</p></section><div class="notice">型番を先に決めず、必要条件を作ってから現行モデルを探します。検索結果は現在のWeb情報なので、販売終了・旧モデルが混ざる場合はメーカー公式ページで最終確認してください。</div><section class="section"><div class="sectionHead"><div><h2>商品を選ぶ</h2><p>相談されている商品ジャンルを選択。</p></div></div><div class="modeProducts">'+data.products.map(function(p){return'<button class="modeProduct" data-product="'+KadenSite.esc(p.id)+'"><b>'+KadenSite.esc(p.label)+'</b><span>'+KadenSite.esc(p.lead)+'</span></button>'}).join('')+'</div></section>';Array.prototype.forEach.call(document.querySelectorAll('[data-product]'),function(b){b.onclick=function(){selectProduct(data.products.find(function(x){return x.id===b.getAttribute('data-product')}))}})}function renderConditions(){var p=state.product;document.getElementById('app').innerHTML='<div class="wizard"><section class="modeHero"><div class="eyebrow">'+KadenSite.esc(p.label)+' / STEP 0</div><h1>先に絶対条件を入れる</h1><p>人数・容量・サイズ・設置幅・予算が分かる範囲だけ入力。未定でも進めます。</p></section><div class="conditionPanel"><h2>絶対条件</h2><p>メーカー好みより優先する条件です。冷蔵庫と洗濯機は容量未指定なら人数から目安を出します。</p><div class="conditionGrid">'+conditionFields()+'</div></div><div class="wizardActions"><button id="quit" class="wizardBtn">商品選択へ戻る</button><button id="start" class="wizardBtn primary">要望を聞く</button></div></div>';document.getElementById('quit').onclick=function(){load().then(renderHome)};document.getElementById('start').onclick=function(){state.conditions.people=document.getElementById('condPeople')&&document.getElementById('condPeople').value?Number(document.getElementById('condPeople').value):null;state.conditions.spec=document.getElementById('condSpec')&&document.getElementById('condSpec').value?Number(document.getElementById('condSpec').value):null;state.conditions.width=document.getElementById('condWidth')&&document.getElementById('condWidth').value?Number(document.getElementById('condWidth').value):null;state.conditions.budget=document.getElementById('condBudget')&&document.getElementById('condBudget').value?Number(document.getElementById('condBudget').value):null;state.step=0;renderQuestion()}}function historyHtml(){if(!state.answers.length)return'';return'<div class="answerHistory"><h3>ここまでの回答</h3>'+state.answers.map(function(a,i){return'<div class="historyRow"><span>Q'+(i+1)+'</span><span>'+KadenSite.esc(a.label)+'</span></div>'}).join('')+'</div>'}function renderQuestion(){var p=state.product,q=p.questions[state.step],progress=Math.round(((state.step+1)/(p.questions.length+1))*100);document.getElementById('app').innerHTML='<div class="wizard"><section class="modeHero"><div class="eyebrow">'+KadenSite.esc(p.label)+' / 接客モード</div><h1>お客様の要望を聞く</h1><p>'+KadenSite.esc(p.lead)+'</p></section><div class="progressWrap"><div class="progressMeta"><span>質問 '+(state.step+1)+' / '+p.questions.length+'</span><span>'+progress+'%</span></div><div class="progressBar"><i style="width:'+progress+'%"></i></div></div><div class="customerCard"><small>CUSTOMER REQUEST</small><h2>'+KadenSite.esc(q.text)+'</h2></div><div class="questionHelp">'+KadenSite.esc(q.help||'')+'</div><div class="answerGrid">'+q.options.map(function(o,i){return'<button class="answerBtn" data-option="'+i+'"><b>'+KadenSite.esc(o.label)+'</b><span>'+KadenSite.esc(o.note||'')+'</span></button>'}).join('')+'</div><div class="wizardActions"><button id="back" class="wizardBtn">前へ</button><button id="quit" class="wizardBtn">商品選択へ戻る</button></div>'+historyHtml()+'</div>';Array.prototype.forEach.call(document.querySelectorAll('[data-option]'),function(b){b.onclick=function(){var o=q.options[Number(b.getAttribute('data-option'))];state.answers=state.answers.slice(0,state.step);state.answers[state.step]={label:o.label,note:o.note,scores:o.scores||{}};resetScores();if(state.step>=p.questions.length-1)renderResult();else{state.step++;renderQuestion()}}});document.getElementById('back').onclick=function(){if(state.step===0)renderConditions();else{state.step--;state.answers=state.answers.slice(0,state.step);resetScores();renderQuestion()}};document.getElementById('quit').onclick=function(){load().then(renderHome)}}function resultRows(top){return'<div class="compareWrap"><table class="resultTable"><thead><tr><th>比較</th>'+top.map(function(x){return'<th>'+KadenSite.esc(x.name)+'</th>'}).join('')+'</tr></thead><tbody><tr><td>向いている人</td>'+top.map(function(x){return'<td>'+KadenSite.esc(x.summary)+'</td>'}).join('')+'</tr><tr><td>強み</td>'+top.map(function(x){return'<td>'+KadenSite.esc(x.strength)+'</td>'}).join('')+'</tr><tr><td>確認点</td>'+top.map(function(x){return'<td>'+KadenSite.esc(x.watch)+'</td>'}).join('')+'</tr></tbody></table></div>'}function extractNeeds(){var text=state.answers.map(function(a){return a.label+' '+a.note}).join(' '),maps={refrigerator:['冷凍','野菜','鮮度','収納','価格','シンプル'],washer:['乾燥','洗浄','価格','時短','大容量','自動投入'],tv:['録画','ゲーム','映画','画質','大画面','Mini LED','価格'],pc:['Office','モバイル','AI','NPU','編集','GPU','ゲーム','価格'],wifi:['速度','電波','多台数','10G','Wi-Fi 7','価格'],printer:['写真','文書','大量','FAX','ランニングコスト','価格'],aircon:['快適','除湿','清潔','価格','暖房','省エネ']},list=maps[state.product.id]||[];return list.filter(function(k){return text.toLowerCase().indexOf(k.toLowerCase())>=0})}function requirementText(){var p=state.product,c=cond[p.id]||{},needs=extractNeeds(),arr=[],spec=inferSpec();if(state.conditions.people!=null)arr.push({k:'使用人数',v:state.conditions.people+(state.conditions.people>=5?'人以上':'人')});if(spec!=null)arr.push({k:state.conditions.spec!=null?(c.spec||'容量・サイズ'):'推奨'+(c.spec||'容量・サイズ'),v:spec+(c.unit||'')+'前後'});if(state.conditions.width!=null)arr.push({k:'横幅上限',v:state.conditions.width+'cm以内'});if(state.conditions.budget!=null)arr.push({k:'予算',v:formatYen(state.conditions.budget)});if(needs.length)arr.push({k:'重視機能',v:needs.join(' / ')});return arr}function buildSearchQuery(candidate,officialOnly){var p=state.product,c=cond[p.id]||{},spec=inferSpec(),needs=extractNeeds(),year=new Date().getFullYear(),parts=[candidate?candidate.name:'',p.label];if(spec!=null)parts.push(spec+(c.unit||'')+' 前後');if(state.conditions.width!=null&&p.id==='refrigerator')parts.push('幅'+state.conditions.width+'cm以下');needs.slice(0,3).forEach(function(n){parts.push(n)});parts.push(year+' 現行モデル 型番');if(!officialOnly&&state.conditions.budget!=null)parts.push(Math.round(state.conditions.budget/10000)+'万円以下');if(officialOnly&&candidate&&candidate.official){try{parts.push('site:'+new URL(candidate.official).hostname)}catch(e){}}return parts.filter(Boolean).join(' ')}function googleUrl(q){return'https://www.google.com/search?q='+encodeURIComponent(q)}function searchHtml(top){var general=buildSearchQuery(null,false),req=requirementText();return'<section class="webSearchSection"><div class="webSearchHead"><div><h2>この条件で現行型番を探す</h2><p>現在年と条件を自動で検索語に入れています。まず横断検索、その後メーカー公式に絞って確認できます。</p></div></div><div class="searchQueryBox"><div class="searchQueryLabel">自動生成した検索条件</div><div class="queryTags">'+req.map(function(r){return'<span class="queryTag">'+KadenSite.esc(r.k)+'：'+KadenSite.esc(r.v)+'</span>'}).join('')+'</div><div id="searchQuery" class="searchQuery">'+KadenSite.esc(general)+'</div><div class="searchButtons"><a class="searchNow" target="_blank" rel="noopener" href="'+googleUrl(general)+'">現行モデルをWeb検索</a><button id="copyQuery" class="copyQuery">検索条件をコピー</button></div></div><div class="makerSearchGrid">'+top.map(function(c){var q=buildSearchQuery(c,true);return'<article class="makerSearchCard"><h3>'+KadenSite.esc(c.name)+'</h3><p>'+KadenSite.esc(c.tag)+'。公式サイト内の現行モデル候補を検索します。</p><a class="officialSearch" target="_blank" rel="noopener" href="'+googleUrl(q)+'">'+KadenSite.esc(c.name)+'の現行型番を検索</a></article>'}).join('')+'</div><div class="searchNote">検索結果に旧モデルや販売店ページが混ざることがあります。候補型番が見つかったら、メーカー公式の商品ページで現行品か・寸法や機能が条件を満たすかを最終確認してください。</div></section>'}function copyText(text){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text);var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();return Promise.resolve()}function renderResult(){var p=state.product,scored=p.candidates.map(function(c){return Object.assign({},c,{score:state.scores[c.id]||0})}).sort(function(a,b){return b.score-a.score}),positive=scored.filter(function(x){return x.score>0}),top=(positive.length?positive:scored).slice(0,Math.min(3,Math.max(2,positive.length||2))),max=Math.max.apply(null,top.map(function(x){return x.score||1})),req=requirementText();document.getElementById('app').innerHTML='<div class="wizard"><section class="modeHero"><div class="eyebrow">RESULT / '+KadenSite.esc(p.label)+'</div><h1>必要条件から候補を絞りました</h1><p>まず容量・サイズ・機能のおすすめを作り、その条件で現在販売されている型番を検索します。</p></section><div class="resultIntro"><h2>今回のコンサル軸</h2><p>'+state.answers.map(function(a){return KadenSite.esc(a.label)}).join(' / ')+'</p></div><div class="requirements">'+(req.length?req.map(function(r){return'<div class="requirement"><small>'+KadenSite.esc(r.k)+'</small><b>'+KadenSite.esc(r.v)+'</b></div>'}).join(''):'<div class="requirement"><small>条件</small><b>用途から候補を比較</b></div>')+'</div><div class="resultGrid">'+top.map(function(c,i){var width=Math.max(12,Math.round((c.score/max)*100));return'<article class="resultCard"><div class="resultRank">方向性 '+(i+1)+'</div><h3>'+KadenSite.esc(c.name)+'</h3><span class="resultTag">'+KadenSite.esc(c.tag)+'</span><div class="fitScore"><i style="width:'+width+'%"></i></div><dl><dt>今回残った理由</dt><dd>'+KadenSite.esc(c.summary)+'</dd><dt>比較で伝える強み</dt><dd>'+KadenSite.esc(c.strength)+'</dd><dt>最後に確認</dt><dd>'+KadenSite.esc(c.watch)+'</dd></dl><div class="officialLinks"><a class="officialLink" target="_blank" rel="noopener" href="'+KadenSite.esc(c.official)+'">公式ラインアップ</a></div></article>'}).join('')+'</div><section class="section"><div class="sectionHead"><div><h2>'+top.length+'候補を比較</h2><p>メーカー・タイプの方向性を比較。</p></div></div>'+resultRows(top)+'</section>'+searchHtml(top)+'<div class="modeNote">検索は現行型番を探す入口です。価格・発売状況・仕様は検索時点で変わるため、最終的にはメーカー公式の商品ページを基準にしてください。</div><div class="nextActions"><button id="retry" class="wizardBtn primary">条件からやり直す</button><button id="change" class="wizardBtn">別の商品を選ぶ</button><a class="modeLink" href="'+productPage()+'">通常コンサルを見る</a><a class="modeLink" href="makers.html?product='+encodeURIComponent(p.id)+'">メーカー比較を見る</a></div>'+historyHtml()+'</div>';document.getElementById('retry').onclick=function(){state.step=0;state.answers=[];state.scores={};renderConditions()};document.getElementById('change').onclick=function(){load().then(renderHome)};document.getElementById('copyQuery').onclick=function(){var text=document.getElementById('searchQuery').textContent;copyText(text).then(function(){document.getElementById('copyQuery').textContent='コピーしました';setTimeout(function(){var b=document.getElementById('copyQuery');if(b)b.textContent='検索条件をコピー'},1200)})}}load().then(function(data){var pid=KadenSite.qs('product'),p=pid&&data.products.find(function(x){return x.id===pid});if(p)selectProduct(p);else renderHome(data)}).catch(function(){document.getElementById('app').innerHTML='<div class="empty">接客モードのデータを読み込めませんでした。</div>'})})();</script></body></html>
