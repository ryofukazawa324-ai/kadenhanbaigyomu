<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接客モード | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="sales_mode.css"></head><body><div id="header"></div><main class="shell"><div id="app"><div class="empty">読み込み中...</div></div><div class="footer">おすすめは絞り込みの目安です。最終案内は設置条件・在庫・価格・現行仕様を確認してください。</div></main><script src="site.js"></script><script>(function(){document.getElementById('header').innerHTML=KadenSite.nav('sales');var state={product:null,step:0,answers:[],scores:{}};function load(){return fetch('sales_mode.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error();return r.json()})}function scoreAdd(scores){Object.keys(scores||{}).forEach(function(k){state.scores[k]=(state.scores[k]||0)+Number(scores[k]||0)})}function resetScores(){state.scores={};state.answers.forEach(function(a){scoreAdd(a.scores)})}function productPage(){var p=state.product;return 'product.html?product='+encodeURIComponent(p.id)}function selectProduct(p){state.product=p;state.step=0;state.answers=[];state.scores={};renderQuestion()}function renderHome(data){state.product=null;document.getElementById('app').innerHTML='<section class="modeHero"><div class="eyebrow">GUIDED CONSULTATION</div><h1>接客モード</h1><p>お客様役の要望を順番に選ぶと、最後に候補を2〜3個まで絞って比較します。接客練習にも、その場の聞き漏らし防止にも使えます。</p></section><div class="notice">型番を直接決める機能ではなく、「どのタイプ・メーカーを残すか」を絞るためのモードです。設置条件や現行価格は最後に店頭で確認してください。</div><section class="section"><div class="sectionHead"><div><h2>商品を選ぶ</h2><p>まず相談されている商品ジャンルを選択。</p></div></div><div class="modeProducts">'+data.products.map(function(p){return'<button class="modeProduct" data-product="'+KadenSite.esc(p.id)+'"><b>'+KadenSite.esc(p.label)+'</b><span>'+KadenSite.esc(p.lead)+'</span></button>'}).join('')+'</div></section>';Array.prototype.forEach.call(document.querySelectorAll('[data-product]'),function(b){b.onclick=function(){var p=data.products.find(function(x){return x.id===b.getAttribute('data-product')});selectProduct(p)}})}function historyHtml(){if(!state.answers.length)return'';return'<div class="answerHistory"><h3>ここまでの回答</h3>'+state.answers.map(function(a,i){return'<div class="historyRow"><span>Q'+(i+1)+'</span><span>'+KadenSite.esc(a.label)+'</span></div>'}).join('')+'</div>'}function renderQuestion(){var p=state.product,q=p.questions[state.step],progress=Math.round((state.step/p.questions.length)*100);document.getElementById('app').innerHTML='<div class="wizard"><section class="modeHero"><div class="eyebrow">'+KadenSite.esc(p.label)+' / 接客モード</div><h1>お客様の要望を聞く</h1><p>'+KadenSite.esc(p.lead)+'</p></section><div class="progressWrap"><div class="progressMeta"><span>質問 '+(state.step+1)+' / '+p.questions.length+'</span><span>'+progress+'%</span></div><div class="progressBar"><i style="width:'+progress+'%"></i></div></div><div class="customerCard"><small>CUSTOMER REQUEST</small><h2>'+KadenSite.esc(q.text)+'</h2></div><div class="questionHelp">'+KadenSite.esc(q.help||'')+'</div><div class="answerGrid">'+q.options.map(function(o,i){return'<button class="answerBtn" data-option="'+i+'"><b>'+KadenSite.esc(o.label)+'</b><span>'+KadenSite.esc(o.note||'')+'</span></button>'}).join('')+'</div><div class="wizardActions"><button id="back" class="wizardBtn" '+(state.step===0?'disabled':'')+'>前の質問</button><button id="quit" class="wizardBtn">商品選択へ戻る</button></div>'+historyHtml()+'</div>';Array.prototype.forEach.call(document.querySelectorAll('[data-option]'),function(b){b.onclick=function(){var o=q.options[Number(b.getAttribute('data-option'))];state.answers=state.answers.slice(0,state.step);state.answers[state.step]={label:o.label,note:o.note,scores:o.scores||{}};resetScores();if(state.step>=p.questions.length-1)renderResult();else{state.step++;renderQuestion()}}});document.getElementById('back').onclick=function(){if(state.step>0){state.step--;state.answers=state.answers.slice(0,state.step);resetScores();renderQuestion()}};document.getElementById('quit').onclick=function(){load().then(renderHome)}}function resultRows(top){return'<div class="compareWrap"><table class="resultTable"><thead><tr><th>比較</th>'+top.map(function(x){return'<th>'+KadenSite.esc(x.name)+'</th>'}).join('')+'</tr></thead><tbody><tr><td>向いている人</td>'+top.map(function(x){return'<td>'+KadenSite.esc(x.summary)+'</td>'}).join('')+'</tr><tr><td>強み</td>'+top.map(function(x){return'<td>'+KadenSite.esc(x.strength)+'</td>'}).join('')+'</tr><tr><td>確認点</td>'+top.map(function(x){return'<td>'+KadenSite.esc(x.watch)+'</td>'}).join('')+'</tr></tbody></table></div>'}function renderResult(){var p=state.product,scored=p.candidates.map(function(c){return Object.assign({},c,{score:state.scores[c.id]||0})}).sort(function(a,b){return b.score-a.score}),positive=scored.filter(function(x){return x.score>0}),top=(positive.length?positive:scored).slice(0,Math.min(3,Math.max(2,positive.length||2))),max=Math.max.apply(null,top.map(function(x){return x.score||1}));document.getElementById('app').innerHTML='<div class="wizard"><section class="modeHero"><div class="eyebrow">RESULT / '+KadenSite.esc(p.label)+'</div><h1>おすすめ候補を'+top.length+'つに絞りました</h1><p>選んだ要望に合いやすい順です。最後は在庫・価格・設置条件・現行仕様で最終比較します。</p></section><div class="resultIntro"><h2>今回のコンサル軸</h2><p>'+state.answers.map(function(a){return KadenSite.esc(a.label)}).join(' / ')+'</p></div><div class="resultGrid">'+top.map(function(c,i){var width=Math.max(12,Math.round((c.score/max)*100));return'<article class="resultCard"><div class="resultRank">候補 '+(i+1)+'</div><h3>'+KadenSite.esc(c.name)+'</h3><span class="resultTag">'+KadenSite.esc(c.tag)+'</span><div class="fitScore"><i style="width:'+width+'%"></i></div><dl><dt>今回残った理由</dt><dd>'+KadenSite.esc(c.summary)+'</dd><dt>比較で伝える強み</dt><dd>'+KadenSite.esc(c.strength)+'</dd><dt>最後に確認</dt><dd>'+KadenSite.esc(c.watch)+'</dd></dl><div class="officialLinks"><a class="officialLink" target="_blank" rel="noopener" href="'+KadenSite.esc(c.official)+'">公式情報</a></div></article>'}).join('')+'</div><section class="section"><div class="sectionHead"><div><h2>3候補を比較</h2><p>お客様へ違いを説明する時の要点。</p></div></div>'+resultRows(top)+'</section><div class="modeNote">おすすめ順位は回答からの簡易スコアです。型番・価格・在庫・キャンペーン・設置可否で最終順位は変えてください。</div><div class="nextActions"><button id="retry" class="wizardBtn primary">同じ商品でもう一度</button><button id="change" class="wizardBtn">別の商品を選ぶ</button><a class="modeLink" href="'+productPage()+'">通常コンサルを見る</a><a class="modeLink" href="makers.html?product='+encodeURIComponent(p.id)+'">メーカー比較を見る</a></div>'+historyHtml()+'</div>';document.getElementById('retry').onclick=function(){state.step=0;state.answers=[];state.scores={};renderQuestion()};document.getElementById('change').onclick=function(){load().then(renderHome)}}load().then(renderHome).catch(function(){document.getElementById('app').innerHTML='<div class="empty">接客モードのデータを読み込めませんでした。</div>'})})();</script></body></html>
