<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接客モード | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="sales_mode.css"></head><body><div id="header"></div><main class="shell"><div id="app"><div class="empty">読み込み中...</div></div><div class="footer">おすすめは絞り込みの目安です。最終案内は設置条件・在庫・価格・現行仕様を確認してください。</div></main><script src="site.js"></script><script>(function(){document.getElementById('header').innerHTML=KadenSite.nav('sales');var INV='kaden_store_inventory_v1';var state={product:null,step:0,answers:[],scores:{},conditions:{spec:null,width:null,budget:null}};var cond={refrigerator:{spec:'希望容量',unit:'L',options:[200,300,400,500,600],width:true,budget:true},washer:{spec:'洗濯容量',unit:'kg',options:[7,8,10,12],width:true,budget:true},tv:{spec:'画面サイズ',unit:'インチ',options:[43,50,55,65,75],budget:true},pc:{spec:'最低メモリ',unit:'GB',options:[8,16,32],budget:true},wifi:{budget:true},printer:{budget:true},aircon:{spec:'畳数目安',unit:'畳',options:[6,8,10,14,18,20],budget:true}};function load(){return fetch('sales_mode.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error();return r.json()})}function loadInventory(){try{var x=JSON.parse(localStorage.getItem(INV)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}function scoreAdd(scores){Object.keys(scores||{}).forEach(function(k){state.scores[k]=(state.scores[k]||0)+Number(scores[k]||0)})}function resetScores(){state.scores={};state.answers.forEach(function(a){scoreAdd(a.scores)})}function productPage(){return'product.html?product='+encodeURIComponent(state.product.id)}function selectProduct(p){state.product=p;state.step=0;state.answers=[];state.scores={};state.conditions={spec:null,width:null,budget:null};renderConditions()}function formatYen(v){return v==null?'未指定':'¥'+Number(v).toLocaleString('ja-JP')+'以内'}function conditionFields(){var c=cond[state.product.id]||{},html='';if(c.spec){html+='<div class="conditionField"><label>'+KadenSite.esc(c.spec)+'</label><select id="condSpec"><option value="">未定・おまかせ</option>'+c.options.map(function(v){return'<option value="'+v+'">'+v+KadenSite.esc(c.unit)+'</option>'}).join('')+'</select></div>'}if(c.width){html+='<div class="conditionField"><label>設置できる横幅上限（cm）</label><input id="condWidth" type="number" inputmode="decimal" step="0.1" placeholder="例：65"></div>'}if(c.budget){html+='<div class="conditionField"><label>予算上限（円）</label><input id="condBudget" type="number" inputmode="numeric" placeholder="例：150000"></div>'}return html}function renderHome(data){state.product=null;document.getElementById('app').innerHTML='<section class="modeHero"><div class="eyebrow">GUIDED CONSULTATION</div><h1>接客モード</h1><p>条件とお客様の要望を順番に選ぶと、まず「おすすめ容量・機能」を出し、そのあと店頭在庫から該当型番を2〜3台まで絞ります。</p></section><div class="notice">型番を先に決めず、必要条件を作ってから店頭在庫へ当てます。店頭在庫データはこの端末内だけに保存します。</div><section class="section"><div class="sectionHead"><div><h2>商品を選ぶ</h2><p>相談されている商品ジャンルを選択。</p></div></div><div class="modeProducts">'+data.products.map(function(p){return'<button class="modeProduct" data-product="'+KadenSite.esc(p.id)+'"><b>'+KadenSite.esc(p.label)+'</b><span>'+KadenSite.esc(p.lead)+'</span></button>'}).join('')+'</div></section>';Array.prototype.forEach.call(document.querySelectorAll('[data-product]'),function(b){b.onclick=function(){selectProduct(data.products.find(function(x){return x.id===b.getAttribute('data-product')}))}})}function renderConditions(){var p=state.product,c=cond[p.id]||{};document.getElementById('app').innerHTML='<div class="wizard"><section class="modeHero"><div class="eyebrow">'+KadenSite.esc(p.label)+' / STEP 0</div><h1>先に絶対条件を入れる</h1><p>容量・サイズ・設置幅・予算が分かる範囲だけ入力。未定なら空欄でも進めます。</p></section><div class="conditionPanel"><h2>絶対条件</h2><p>ここはメーカー好みより優先して在庫照合に使います。</p><div class="conditionGrid">'+conditionFields()+'</div></div><div class="wizardActions"><button id="quit" class="wizardBtn">商品選択へ戻る</button><button id="start" class="wizardBtn primary">要望を聞く</button></div></div>';document.getElementById('quit').onclick=function(){load().then(renderHome)};document.getElementById('start').onclick=function(){state.conditions.spec=document.getElementById('condSpec')&&document.getElementById('condSpec').value?Number(document.getElementById('condSpec').value):null;state.conditions.width=document.getElementById('condWidth')&&document.getElementById('condWidth').value?Number(document.getElementById('condWidth').value):null;state.conditions.budget=document.getElementById('condBudget')&&document.getElementById('condBudget').value?Number(document.getElementById('condBudget').value):null;state.step=0;renderQuestion()}}function historyHtml(){if(!state.answers.length)return'';return'<div class="answerHistory"><h3>ここまでの回答</h3>'+state.answers.map(function(a,i){return'<div class="historyRow"><span>Q'+(i+1)+'</span><span>'+KadenSite.esc(a.label)+'</span></div>'}).join('')+'</div>'}function renderQuestion(){var p=state.product,q=p.questions[state.step],progress=Math.round(((state.step+1)/(p.questions.length+1))*100);document.getElementById('app').innerHTML='<div class="wizard"><section class="modeHero"><div class="eyebrow">'+KadenSite.esc(p.label)+' / 接客モード</div><h1>お客様の要望を聞く</h1><p>'+KadenSite.esc(p.lead)+'</p></section><div class="progressWrap"><div class="progressMeta"><span>質問 '+(state.step+1)+' / '+p.questions.length+'</span><span>'+progress+'%</span></div><div class="progressBar"><i style="width:'+progress+'%"></i></div></div><div class="customerCard"><small>CUSTOMER REQUEST</small><h2>'+KadenSite.esc(q.text)+'</h2></div><div class="questionHelp">'+KadenSite.esc(q.help||'')+'</div><div class="answerGrid">'+q.options.map(function(o,i){return'<button class="answerBtn" data-option="'+i+'"><b>'+KadenSite.esc(o.label)+'</b><span>'+KadenSite.esc(o.note||'')+'</span></button>'}).join('')+'</div><div class="wizardActions"><button id="back" class="wizardBtn">前へ</button><button id="quit" class="wizardBtn">商品選択へ戻る</button></div>'+historyHtml()+'</div>';Array.prototype.forEach.call(document.querySelectorAll('[data-option]'),function(b){b.onclick=function(){var o=q.options[Number(b.getAttribute('data-option'))];state.answers=state.answers.slice(0,state.step);state.answers[state.step]={label:o.label,note:o.note,scores:o.scores||{}};resetScores();if(state.step>=p.questions.length-1)renderResult();else{state.step++;renderQuestion()}}});document.getElementById('back').onclick=function(){if(state.step===0)renderConditions();else{state.step--;state.answers=state.answers.slice(0,state.step);resetScores();renderQuestion()}};document.getElementById('quit').onclick=function(){load().then(renderHome)}}function resultRows(top){return'<div class="compareWrap"><table class="resultTable"><thead><tr><th>比較</th>'+top.map(function(x){return'<th>'+KadenSite.esc(x.name)+'</th>'}).join('')+'</tr></thead><tbody><tr><td>向いている人</td>'+top.map(function(x){return'<td>'+KadenSite.esc(x.summary)+'</td>'}).join('')+'</tr><tr><td>強み</td>'+top.map(function(x){return'<td>'+KadenSite.esc(x.strength)+'</td>'}).join('')+'</tr><tr><td>確認点</td>'+top.map(function(x){return'<td>'+KadenSite.esc(x.watch)+'</td>'}).join('')+'</tr></tbody></table></div>'}function extractNeeds(){var text=state.answers.map(function(a){return a.label+' '+a.note}).join(' '),maps={refrigerator:['冷凍','野菜','鮮度','収納','価格','シンプル'],washer:['乾燥','洗浄','価格','時短','大容量','自動投入'],tv:['録画','ゲーム','映画','画質','大画面','Mini LED','価格'],pc:['Office','モバイル','AI','NPU','編集','GPU','ゲーム','価格'],wifi:['速度','電波','多台数','10G','Wi-Fi 7','価格'],printer:['写真','文書','大量','FAX','ランニングコスト','価格'],aircon:['快適','除湿','清潔','価格','暖房','省エネ']},list=maps[state.product.id]||[];return list.filter(function(k){return text.toLowerCase().indexOf(k.toLowerCase())>=0})}function requirementText(){var p=state.product,c=cond[p.id]||{},needs=extractNeeds(),arr=[];if(state.conditions.spec!=null)arr.push({k:c.spec||'容量・サイズ',v:state.conditions.spec+(c.unit||'')});if(state.conditions.width!=null)arr.push({k:'横幅上限',v:state.conditions.width+'cm以内'});if(state.conditions.budget!=null)arr.push({k:'予算',v:formatYen(state.conditions.budget)});if(needs.length)arr.push({k:'重視機能',v:needs.join(' / ')});return arr}function makerMatch(inv,c){var a=(inv.maker+' '+inv.model).toLowerCase(),b=c.name.toLowerCase();if(a.indexOf(b)>=0||b.indexOf(a)>=0)return true;var aliases=[['mitsubishi','三菱'],['panasonic','パナソニック'],['hitachi','日立'],['toshiba','東芝'],['sony','ソニー'],['regza','regza'],['aqua','aqua'],['haier','haier'],['epson','epson'],['canon','canon'],['brother','brother'],['daikin','ダイキン'],['tcl','tcl']];return aliases.some(function(x){return(b.indexOf(x[0])>=0||b.indexOf(x[1])>=0)&&(a.indexOf(x[0])>=0||a.indexOf(x[1])>=0)})}function matchInventory(top){var needs=extractNeeds(),inv=loadInventory().filter(function(x){return x.product===state.product.id&&Number(x.stock||0)>0}),c=cond[state.product.id]||{};return inv.map(function(x){var score=1,reasons=[];top.forEach(function(candidate,i){if(makerMatch(x,candidate)){var add=9-i*2;score+=add;reasons.push(candidate.name+'系') }});if(state.conditions.budget!=null&&x.price!=null){if(Number(x.price)<=state.conditions.budget){score+=5;reasons.push('予算内')}else score-=5}if(state.conditions.spec!=null&&x.spec!=null){var target=state.conditions.spec,val=Number(x.spec);if(val>=target*.9&&val<=target*1.2){score+=5;reasons.push((c.spec||'容量・サイズ')+'が近い')}else if(val<target*.9)score-=4;else score+=1}if(state.conditions.width!=null&&x.width!=null){if(Number(x.width)<=state.conditions.width){score+=4;reasons.push('設置幅内')}else score-=10}var tags=(x.tags||[]).map(function(t){return String(t).toLowerCase()});needs.forEach(function(n){if(tags.some(function(t){return t.indexOf(n.toLowerCase())>=0||n.toLowerCase().indexOf(t)>=0})){score+=3;reasons.push(n)}});return Object.assign({},x,{matchScore:score,reasons:reasons})}).sort(function(a,b){return b.matchScore-a.matchScore}).slice(0,3)}function specName(p){var c=cond[p.id]||{};return c.spec||'主要スペック'}function inventoryHtml(top){var matches=matchInventory(top);if(!loadInventory().filter(function(x){return x.product===state.product.id}).length)return'<div class="noInventory">この商品の店頭在庫がまだ登録されていません。<br><a class="modeLink primary" href="inventory.html">店頭在庫を登録する</a></div>';if(!matches.length)return'<div class="noInventory">在庫ありの該当型番がありません。店頭在庫ページで在庫数や条件を確認してください。</div>';return'<div class="inventoryGrid">'+matches.map(function(x,i){var spec=x.spec!=null?specName(state.product)+' '+x.spec+((cond[state.product.id]||{}).unit||''):'';return'<article class="inventoryMatch"><div class="maker">店頭候補 '+(i+1)+' / '+KadenSite.esc(x.maker||'')+'</div><strong>'+KadenSite.esc(x.model||'型番未入力')+'</strong><div class="specLine">'+[x.price!=null?'¥'+Number(x.price).toLocaleString('ja-JP'):'',spec,x.width!=null?'幅 '+x.width+'cm':'','在庫 '+Number(x.stock||0)].filter(Boolean).join(' / ')+'</div><span class="matchBadge">条件一致度 '+Math.max(0,x.matchScore)+'</span><div class="matchReason">'+(x.reasons.length?'一致：'+KadenSite.esc(Array.from(new Set(x.reasons)).join('、')):'メーカー・条件を店頭で再確認')+'</div>'+(x.note?'<div class="matchReason">メモ：'+KadenSite.esc(x.note)+'</div>':'')+'</article>'}).join('')+'</div>'}function renderResult(){var p=state.product,scored=p.candidates.map(function(c){return Object.assign({},c,{score:state.scores[c.id]||0})}).sort(function(a,b){return b.score-a.score}),positive=scored.filter(function(x){return x.score>0}),top=(positive.length?positive:scored).slice(0,Math.min(3,Math.max(2,positive.length||2))),max=Math.max.apply(null,top.map(function(x){return x.score||1})),req=requirementText();document.getElementById('app').innerHTML='<div class="wizard"><section class="modeHero"><div class="eyebrow">RESULT / '+KadenSite.esc(p.label)+'</div><h1>必要条件から候補を絞りました</h1><p>まず「何L・何インチ・何kgくらいで、どの機能が必要か」を出し、そのあと店頭在庫に当てます。</p></section><div class="resultIntro"><h2>今回のコンサル軸</h2><p>'+state.answers.map(function(a){return KadenSite.esc(a.label)}).join(' / ')+'</p></div><div class="requirements">'+(req.length?req.map(function(r){return'<div class="requirement"><small>'+KadenSite.esc(r.k)+'</small><b>'+KadenSite.esc(r.v)+'</b></div>'}).join(''):'<div class="requirement"><small>容量・予算</small><b>未指定</b></div>')+'</div><div class="resultGrid">'+top.map(function(c,i){var width=Math.max(12,Math.round((c.score/max)*100));return'<article class="resultCard"><div class="resultRank">方向性 '+(i+1)+'</div><h3>'+KadenSite.esc(c.name)+'</h3><span class="resultTag">'+KadenSite.esc(c.tag)+'</span><div class="fitScore"><i style="width:'+width+'%"></i></div><dl><dt>今回残った理由</dt><dd>'+KadenSite.esc(c.summary)+'</dd><dt>比較で伝える強み</dt><dd>'+KadenSite.esc(c.strength)+'</dd><dt>最後に確認</dt><dd>'+KadenSite.esc(c.watch)+'</dd></dl><div class="officialLinks"><a class="officialLink" target="_blank" rel="noopener" href="'+KadenSite.esc(c.official)+'">公式情報</a></div></article>'}).join('')+'</div><section class="section"><div class="sectionHead"><div><h2>'+top.length+'候補を比較</h2><p>メーカー・タイプの方向性を比較。</p></div></div>'+resultRows(top)+'</section><section class="inventorySection"><div class="inventoryHead"><div><h2>いま店頭にあるならこれ</h2><p>この端末に登録した在庫を、予算・容量/サイズ・幅・機能タグ・メーカー方向性で照合。</p></div><a class="modeLink" href="inventory.html">店頭在庫を編集</a></div>'+inventoryHtml(top)+'</section><div class="modeNote">店頭候補の一致度は補助判定です。現物の仕様・設置条件・価格・在庫状態・最新販買情報を最終確認してください。</div><div class="nextActions"><button id="retry" class="wizardBtn primary">条件からやり直す</button><button id="change" class="wizardBtn">別の商品を選ぶ</button><a class="modeLink" href="'+productPage()+'">通常コンサルを見る</a><a class="modeLink" href="makers.html?product='+encodeURIComponent(p.id)+'">メーカー比較を見る</a></div>'+historyHtml()+'</div>';document.getElementById('retry').onclick=function(){state.step=0;state.answers=[];state.scores={};renderConditions()};document.getElementById('change').onclick=function(){load().then(renderHome)}}load().then(function(data){var pid=KadenSite.qs('product'),p=pid&&data.products.find(function(x){return x.id===pid});if(p)selectProduct(p);else renderHome(data)}).catch(function(){document.getElementById('app').innerHTML='<div class="empty">接客モードのデータを読み込めませんでした。</div>'})})();</script></body></html>
