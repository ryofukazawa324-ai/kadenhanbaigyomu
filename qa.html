<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA暗記モード | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><style>.qaHero{padding:28px 0 12px}.qaHero h1{margin:5px 0 8px;font-size:30px}.qaModes,.qaGenres{display:flex;gap:8px;overflow:auto;padding:8px 0}.qaBtn{border:1px solid #d9dee8;background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap}.qaBtn.active{background:#172033;color:#fff}.qaCard{background:#fff;border:1px solid #e2e6ee;border-radius:20px;padding:20px;margin-top:14px;box-shadow:0 8px 24px rgba(20,30,50,.06)}.qaMeta{font-size:12px;font-weight:900;color:#687386}.qaQ{font-size:22px;font-weight:900;margin:8px 0}.qaBlank{font-size:17px;line-height:1.7;background:#f5f7fa;border-radius:14px;padding:14px}.qaInput{width:100%;box-sizing:border-box;margin-top:14px;padding:14px;border:1px solid #ccd3df;border-radius:12px;font-size:16px}.qaActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.qaAction{border:0;border-radius:12px;padding:12px 16px;font-weight:900;background:#172033;color:#fff}.qaAction.sub{background:#eef1f6;color:#172033}.qaResult{margin-top:12px;padding:14px;border-radius:14px;background:#f5f7fa;line-height:1.65}.qaListItem{border-bottom:1px solid #e8ebf0;padding:15px 0}.qaListItem:last-child{border-bottom:0}.qaListItem h3{margin:4px 0 7px;font-size:17px}.qaAnswer{font-weight:900}.qaDetail{margin-top:5px;color:#566173;line-height:1.6}.qaScore{font-weight:900;margin-left:auto}.qaTop{display:flex;align-items:center;gap:10px}.hidden{display:none!important}@media(max-width:600px){.qaHero h1{font-size:26px}.qaQ{font-size:20px}.qaCard{padding:16px}}</style></head><body><div id="header"></div><main class="shell"><div class="qaHero"><div class="eyebrow">Q&A STUDY</div><h1>QA暗記モード</h1><p>ジャンルを選び、穴埋めで回答。答えと解説を一覧でも確認できます。</p></div><div class="qaModes"><button class="qaBtn active" data-mode="quiz">回答する</button><button class="qaBtn" data-mode="list">答え・解説一覧</button></div><div id="genres" class="qaGenres"></div><div id="quiz"></div><div id="list" class="hidden"></div><div class="footer">基礎知識を短時間で反復するための暗記モードです。</div></main><script src="site.js"></script><script>document.getElementById('header').innerHTML=KadenSite.nav('qa');var data=[],genre='すべて',mode='quiz',pool=[],idx=0,correct=0,answered=0;function esc(s){return KadenSite.esc(s)}function normalize(s){return String(s||'').toLowerCase().replace(/[\s　・。,.、]/g,'')}function filtered(){return genre==='すべて'?data:data.filter(function(x){return x.genre===genre})}function buildPool(){pool=filtered().slice().sort(function(){return Math.random()-.5});idx=0;correct=0;answered=0}function renderGenres(){var gs=['すべて'].concat(data.map(function(x){return x.genre}).filter(function(x,i,a){return a.indexOf(x)===i}));document.getElementById('genres').innerHTML=gs.map(function(g){return'<button class="qaBtn '+(g===genre?'active':'')+'" data-genre="'+esc(g)+'">'+esc(g)+'</button>'}).join('');document.querySelectorAll('[data-genre]').forEach(function(b){b.onclick=function(){genre=b.dataset.genre;buildPool();renderGenres();render()}})}function renderQuiz(){var box=document.getElementById('quiz');if(!pool.length){box.innerHTML='<div class="qaCard">問題がありません。</div>';return}var x=pool[idx%pool.length];box.innerHTML='<div class="qaCard"><div class="qaTop"><div class="qaMeta">'+esc(x.genre)+' ・ '+((idx%pool.length)+1)+' / '+pool.length+'</div><div class="qaScore">正解 '+correct+' / '+answered+'</div></div><div class="qaQ">'+esc(x.q)+'</div><div class="qaBlank">'+esc(x.blank)+'</div><input id="answer" class="qaInput" autocomplete="off" placeholder="（　）に入る言葉を入力"><div class="qaActions"><button id="judge" class="qaAction">回答する</button><button id="show" class="qaAction sub">答えを見る</button><button id="next" class="qaAction sub">次の問題</button></div><div id="result"></div></div>';var input=document.getElementById('answer');function showResult(judge){var val=normalize(input.value),ok=(x.answers||[]).some(function(a){var n=normalize(a);return val===n||val.indexOf(n)>=0||n.indexOf(val)>=0&&val.length>=2});if(judge){answered++;if(ok)correct++}document.getElementById('result').innerHTML='<div class="qaResult"><b>'+(judge?(ok?'○ 正解':'× 惜しい'):'答え')+'：</b> '+esc(x.answer)+'<br>'+esc(x.detail)+'</div>';input.disabled=true;document.querySelector('.qaScore').textContent='正解 '+correct+' / '+answered}document.getElementById('judge').onclick=function(){if(!input.value.trim())return;showResult(true)};document.getElementById('show').onclick=function(){showResult(false)};document.getElementById('next').onclick=function(){idx++;renderQuiz()};input.onkeydown=function(e){if(e.key==='Enter')document.getElementById('judge').click()};setTimeout(function(){input.focus()},0)}function renderList(){var xs=filtered();document.getElementById('list').innerHTML='<div class="qaCard"><div class="qaMeta">'+xs.length+'問</div>'+xs.map(function(x){return'<div class="qaListItem"><div class="qaMeta">'+esc(x.genre)+'</div><h3>'+esc(x.q)+'</h3><div>'+esc(x.blank)+'</div><div class="qaAnswer">答え：'+esc(x.answer)+'</div><div class="qaDetail">'+esc(x.detail)+'</div></div>'}).join('')+'</div>'}function render(){document.getElementById('quiz').classList.toggle('hidden',mode!=='quiz');document.getElementById('list').classList.toggle('hidden',mode!=='list');if(mode==='quiz')renderQuiz();else renderList()}document.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(function(x){x.classList.toggle('active',x===b)});render()}});fetch('qa_data.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){data=d;buildPool();renderGenres();render()}).catch(function(){document.getElementById('quiz').innerHTML='<div class="qaCard">QAデータを読み込めませんでした。</div>'});</script></body></html>
