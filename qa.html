<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA暗記モード | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><style>.qaHero{padding:28px 0 12px}.qaModes,.qaGenres,.qaActions,.listTools{display:flex;gap:8px;overflow:auto;padding:8px 0}.qaBtn,.qaChoice{border:1px solid #d9dee8;background:#fff;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.qaBtn{white-space:nowrap;border-radius:999px}.qaBtn.active{background:#172033;color:#fff}.qaBtn.marked{background:#eaf8ef;border-color:#67c587;color:#087a38}.qaBtn.danger{border-color:#efb0ad;color:#b42318}.qaBtn:disabled{opacity:.4}.qaCard{background:#fff;border:1px solid #e2e6ee;border-radius:20px;padding:20px;margin-top:14px}.qaQ{font-size:22px;font-weight:900;margin:8px 0}.qaBlank,.qaResult{line-height:1.7;background:#f5f7fa;border-radius:14px;padding:14px}.qaChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.qaChoice{text-align:left}.qaMatchRows{display:grid;gap:12px;margin-top:14px}.qaMatchRow{padding:12px;border:1px solid #e2e6ee;border-radius:14px;background:#fafbfc}.qaMatchRow b{display:block;margin-bottom:8px}.qaMatchOpts{display:flex;gap:8px;flex-wrap:wrap}.qaMatchOpt{border:1px solid #d9dee8;background:#fff;border-radius:10px;padding:9px 12px;font-weight:800}.qaMatchOpt.selected{background:#172033;color:#fff}.qaMatchOpt.correct{background:#ecfdf3;border-color:#6ce9a6;color:#087a38}.qaMatchOpt.wrong{background:#fff1f0;border-color:#fda29b;color:#b42318}.qaChoice.correct{background:#ecfdf3;border-color:#6ce9a6}.qaChoice.wrong{background:#fff1f0;border-color:#fda29b}.qaMeta{font-size:12px;font-weight:900;color:#687386}.qaListItem{border-bottom:1px solid #e8ebf0;padding:15px 0}.qaAnswer{font-weight:900}.qaDetail{color:#566173;line-height:1.6}.reviewMark{display:inline-block;margin-left:7px;color:#087a38;font-weight:900}.hidden{display:none!important}.qaStatus{padding:18px;background:#fff;border:1px solid #e2e6ee;border-radius:16px;margin-top:12px}.qaAfterAnswerActions{margin-top:14px;padding-top:14px;border-top:3px solid #d8dde7;flex-wrap:wrap}.qaRef{margin:12px 0;padding:12px;background:#f7f9fc;border:1px solid #e2e6ee;border-radius:14px}.qaRef img{display:block;width:100%;max-width:680px;max-height:420px;object-fit:contain;background:#fff;border-radius:10px;margin-bottom:10px}.qaRef a{font-weight:900;text-decoration:none}.qaRef small{display:block;margin-top:5px;color:#687386}@media(max-width:600px){.qaChoices{grid-template-columns:1fr}.qaCard{padding:16px}.qaAfterAnswerActions .qaBtn{flex:1 1 140px;text-align:center}}</style></head><body><div id="header"></div><main class="shell"><section class="qaHero"><div class="eyebrow">Q&A STUDY</div><h1>QA暗記モード</h1><p>複数の選択肢から正解を選択。復習したい問題は回答後に保存できます。</p></section><div class="qaModes"><button type="button" class="qaBtn active" data-mode="quiz">回答する</button><button type="button" class="qaBtn" data-mode="list">答え・解説一覧</button><button type="button" class="qaBtn" data-mode="hidden">非表示問題</button></div><div class="qaActions"><button type="button" id="restoreAll" class="qaBtn">すべて戻す</button><span id="hiddenCount" class="qaMeta"></span></div><div id="genres" class="qaGenres"></div><div id="content"><div class="qaStatus">問題を読み込み中…</div></div></main><script src="site.js?v=20261002-qa2"></script><script>document.getElementById('header').innerHTML=KadenSite.nav('qa');</script><script>(function(){'use strict';var data=[],genre='すべて',mode='quiz',pool=[],idx=0,correct=0,answered=0,listSort='all';var STORE='kadenQaHiddenV1',MARK='kadenQaReviewMarksV1';var content=document.getElementById('content'),genresEl=document.getElementById('genres'),hiddenCount=document.getElementById('hiddenCount');function e(s){return KadenSite.esc(String(s==null?'':s))}function norm(s){return String(s||'').toLowerCase().replace(/[\s　・。,.、]/g,'')}function key(x){return(x.genre||'')+'||'+(x.q||'')}function readStore(name){try{var v=JSON.parse(localStorage.getItem(name)||'[]');return Array.isArray(v)?v:[]}catch(_){return[]}}function hidden(){return readStore(STORE)}function marks(){return readStore(MARK)}function isHidden(x){return hidden().indexOf(key(x))>=0}function isMarked(x){return marks().indexOf(key(x))>=0}function visible(){return data.filter(function(x){return!isHidden(x)})}function filtered(){var d=visible();return genre==='すべて'?d:d.filter(function(x){return x.genre===genre})}function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=b[i];b[i]=b[j];b[j]=t}return b}function answer(x){return String((x.answers&&x.answers[0])||x.answer||'').trim()}function build(){pool=shuffle(filtered());idx=0;correct=0;answered=0}function saveHidden(x){var h=hidden(),k=key(x);if(h.indexOf(k)<0)h.push(k);localStorage.setItem(STORE,JSON.stringify(h));build();render()}function restoreOne(x){localStorage.setItem(STORE,JSON.stringify(hidden().filter(function(k){return k!==key(x)})));build();render()}function toggleMark(x){var m=marks(),k=key(x),i=m.indexOf(k);if(i>=0)m.splice(i,1);else m.push(k);localStorage.setItem(MARK,JSON.stringify(m));return isMarked(x)}function choices(x){var a=answer(x),seen={},out=[];seen[norm(a)]=1;shuffle(data.filter(function(y){return y.genre===x.genre&&key(y)!==key(x)}).map(answer).concat(data.map(answer))).forEach(function(v){var n=norm(v);if(out.length<3&&n&&!seen[n]){seen[n]=1;out.push(v)}});['温度','重量','熱風','省エネ性能','処理能力','設置条件'].forEach(function(v){if(out.length<3&&!seen[norm(v)]){seen[norm(v)]=1;out.push(v)}});return shuffle([a].concat(out.slice(0,3)))}function renderGenres(){var gs=['すべて'].concat(visible().map(function(x){return x.genre}).filter(function(x,i,a){return a.indexOf(x)===i}));if(gs.indexOf(genre)<0)genre='すべて';genresEl.innerHTML=gs.map(function(g){return'<button type="button" class="qaBtn '+(g===genre?'active':'')+'" data-g="'+e(g)+'">'+e(g)+'</button>'}).join('');genresEl.classList.toggle('hidden',mode==='hidden');hiddenCount.textContent=data.filter(isHidden).length?data.filter(isHidden).length+'問を非表示中':'非表示なし'}function refHtml(x){if(!x.refUrl)return'';var img=x.imageUrl?'<img src="'+e(x.imageUrl)+'" alt="'+e(x.imageAlt||x.q||'公式参考画像')+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">':'',fallback=x.imageUrl?'<small style="display:none">画像を直接表示できません。下の公式ページから確認できます。</small>':'';return'<div class="qaRef">'+img+fallback+'<a href="'+e(x.refUrl)+'" target="_blank" rel="noopener">公式ページで見る ↗</a><small>画像・情報元：'+e(x.refLabel||'メーカー公式')+'</small></div>'}function isMatch(x){return Array.isArray(x.matchItems)&&Array.isArray(x.matchOptions)}function matchHtml(x){return'<div class="qaMatchRows">'+x.matchItems.map(function(it,i){return'<div class="qaMatchRow"><b>①②③'.charAt(i)+' '+e(it.label)+'</b><div class="qaMatchOpts">'+x.matchOptions.map(function(o){return'<button type="button" class="qaMatchOpt" data-mi="'+i+'" data-mv="'+e(o)+'">'+e(o)+'</button>'}).join('')+'</div></div>'}).join('')+'</div>'}function resultHtml(x,label){return'<div class="qaResult"><b>'+label+'：</b> '+e(x.answer)+'<br>'+e(x.detail)+'</div>'+refHtml(x)+'<div class="qaActions qaAfterAnswerActions"><button type="button" class="qaBtn '+(isMarked(x)?'marked':'')+'" data-after="mark">'+(isMarked(x)?'○ 保存済み':'○ 復習に保存')+'</button><button type="button" class="qaBtn danger" data-after="hide">この問題を非表示</button></div>'}function renderQuiz(){if(!pool.length){content.innerHTML='<div class="qaCard">表示する問題がありません。</div>';return}idx=Math.max(0,Math.min(idx,pool.length-1));var x=pool[idx],cs=choices(x),ca=norm(answer(x));content.innerHTML='<div class="qaCard"><div class="qaMeta">'+e(x.genre)+' ・ '+(idx+1)+' / '+pool.length+'　正解 '+correct+' / '+answered+(isMarked(x)?'<span class="reviewMark">○ 復習</span>':'')+'</div><div class="qaQ">'+e(x.q)+'</div><div class="qaBlank">'+e(x.blank)+'</div>'+(isMatch(x)?matchHtml(x):'<div class="qaChoices">'+cs.map(function(c){return'<button type="button" class="qaChoice" data-choice="'+e(c)+'">'+e(c)+'</button></div>')<div class="qaActions"><button type="button" class="qaBtn" data-action="prev" '+(idx===0?'disabled':'')+'>← 前の問題</button><button type="button" class="qaBtn" data-action="show">答えを見る</button><button type="button" class="qaBtn" data-action="next">次の問題 →</button></div><div id="result"></div></div>';var done=false,ms={};content.onclick=function(ev){var b=ev.target.closest('button');if(!b)return;if(b.hasAttribute('data-mi')){if(done)return;var mi=Number(b.getAttribute('data-mi')),mv=b.getAttribute('data-mv');ms[mi]=mv;content.querySelectorAll('[data-mi="'+mi+'"]').forEach(function(z){z.classList.toggle('selected',z===b)});if(Object.keys(ms).length===x.matchItems.length){done=true;var okm=x.matchItems.every(function(it,i){return norm(ms[i])===norm(it.answer)});answered++;if(okm)correct++;content.querySelectorAll('[data-mi]').forEach(function(z){var ii=Number(z.getAttribute('data-mi'));z.disabled=true;if(norm(z.getAttribute('data-mv'))===norm(x.matchItems[ii].answer))z.classList.add('correct');else if(z.classList.contains('selected'))z.classList.add('wrong')});document.getElementById('result').innerHTML=resultHtml(x,okm?'○ 正解':'× 不正解')}return}if(b.hasAttribute('data-choice')){if(done)return;done=true;var v=b.getAttribute('data-choice'),ok=norm(v)===ca;answered++;if(ok)correct++;content.querySelectorAll('[data-choice]').forEach(function(z){z.disabled=true;if(norm(z.getAttribute('data-choice'))===ca)z.classList.add('correct');else if(norm(z.getAttribute('data-choice'))===norm(v))z.classList.add('wrong')});document.getElementById('result').innerHTML=resultHtml(x,ok?'○ 正解':'× 不正解');return}var after=b.getAttribute('data-after');if(after==='mark'){var on=toggleMark(x);b.classList.toggle('marked',on);b.textContent=on?'○ 保存済み':'○ 復習に保存';return}if(after==='hide'){saveHidden(x);return}var a=b.getAttribute('data-action');if(a==='prev'&&idx>0){idx--;renderQuiz()}else if(a==='next'){idx=idx<pool.length-1?idx+1:0;renderQuiz()}else if(a==='show'&&!done){done=true;content.querySelectorAll('[data-choice]').forEach(function(z){z.disabled=true;if(norm(z.getAttribute('data-choice'))===ca)z.classList.add('correct')});document.getElementById('result').innerHTML=resultHtml(x,'答え')}}}function renderList(){var xs=filtered();if(listSort==='marked')xs=xs.filter(isMarked);if(listSort==='unmarked')xs=xs.filter(function(x){return!isMarked(x)});content.innerHTML='<div class="listTools"><button type="button" class="qaBtn '+(listSort==='all'?'active':'')+'" data-sort="all">すべて</button><button type="button" class="qaBtn '+(listSort==='marked'?'active':'')+'" data-sort="marked">○ 復習保存</button><button type="button" class="qaBtn '+(listSort==='unmarked'?'active':'')+'" data-sort="unmarked">未保存</button></div><div class="qaCard">'+(xs.length?xs.map(function(x){return'<div class="qaListItem"><div class="qaMeta">'+e(x.genre)+(isMarked(x)?'<span class="reviewMark">○ 保存</span>':'')+'</div><h3>'+e(x.q)+'</h3><div class="qaAnswer">答え：'+e(x.answer)+'</div><div class="qaDetail">'+e(x.detail)+'</div>'+refHtml(x)+'</div>'}).join(''):'該当する問題はありません。')+'</div>';content.onclick=function(ev){var b=ev.target.closest('[data-sort]');if(!b)return;listSort=b.getAttribute('data-sort');renderList()}}function renderHidden(){var xs=data.filter(isHidden);content.innerHTML='<div class="qaCard">'+(xs.length?xs.map(function(x,i){return'<div class="qaListItem"><div class="qaMeta">'+e(x.genre)+'</div><h3>'+e(x.q)+'</h3><div class="qaAnswer">答え：'+e(x.answer)+'</div><div class="qaDetail">'+e(x.detail)+'</div><button type="button" class="qaBtn" data-restore="'+i+'">この問題だけ戻す</button></div>'}).join(''):'非表示問題はありません。')+'</div>';content.onclick=function(ev){var b=ev.target.closest('[data-restore]');if(b)restoreOne(xs[Number(b.getAttribute('data-restore'))])}}function render(){renderGenres();if(mode==='quiz')renderQuiz();else if(mode==='list')renderList();else renderHidden()}document.querySelector('.qaModes').addEventListener('click',function(ev){var b=ev.target.closest('[data-mode]');if(!b)return;mode=b.getAttribute('data-mode');document.querySelectorAll('[data-mode]').forEach(function(x){x.classList.toggle('active',x===b)});render()});genresEl.addEventListener('click',function(ev){var b=ev.target.closest('[data-g]');if(!b)return;genre=b.getAttribute('data-g');build();render()});document.getElementById('restoreAll').addEventListener('click',function(){if(confirm('非表示にした問題をすべて戻しますか？')){localStorage.removeItem(STORE);build();render()}});var files=['qa_data.json','qa_microwave_toaster.json','qa_expansion_01.json','qa_expansion_02.json','qa_expansion_03.json','qa_expansion_04.json','qa_expansion_05.json','qa_expansion_06.json','qa_expansion_07.json','qa_expansion_08.json','qa_expansion_09.json','qa_expansion_10.json','qa_expansion_11.json','qa_expansion_12.json','qa_expansion_13.json','qa_expansion_14.json','qa_expansion_15.json','qa_expansion_16.json','qa_expansion_17.json','qa_expansion_18.json','qa_expansion_19.json','qa_expansion_20.json','qa_expansion_21.json','qa_expansion_22.json','qa_expansion_23.json','qa_expansion_24.json','qa_expansion_25.json','qa_expansion_26.json','qa_expansion_27.json','qa_expansion_28.json','qa_expansion_29.json'];var loaded=0;files.forEach(function(f){fetch(f+'?v=20261010-camcorder29',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(f);return r.json()}).then(function(a){if(Array.isArray(a))data=data.concat(a)}).catch(function(err){console.warn('QA load skipped',err)}).finally(function(){loaded++;if(loaded===files.length){build();render();if(!data.length)content.innerHTML='<div class="qaStatus">問題データを読み込めませんでした。ページを再読み込みしてください。</div>'}})});})();</script></body></html>
