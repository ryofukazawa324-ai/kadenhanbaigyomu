<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA暗記モード | 家電販売ナレッジ</title><link rel="stylesheet" href="site.css"><style>.qaHero{padding:28px 0 12px}.qaModes,.qaGenres,.qaActions,.listTools{display:flex;gap:8px;overflow:auto;padding:8px 0}.qaBtn,.qaChoice{border:1px solid #d9dee8;background:#fff;border-radius:12px;padding:11px 14px;font-weight:800}.qaBtn{white-space:nowrap;border-radius:999px}.qaBtn.active{background:#172033;color:#fff}.qaBtn.marked{background:#eaf8ef;border-color:#67c587;color:#087a38}.qaCard{background:#fff;border:1px solid #e2e6ee;border-radius:20px;padding:20px;margin-top:14px}.qaQ{font-size:22px;font-weight:900;margin:8px 0}.qaBlank,.qaResult{line-height:1.7;background:#f5f7fa;border-radius:14px;padding:14px}.qaChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.qaChoice{text-align:left}.qaChoice.correct{background:#ecfdf3;border-color:#6ce9a6}.qaChoice.wrong{background:#fff1f0;border-color:#fda29b}.qaMeta{font-size:12px;font-weight:900;color:#687386}.qaListItem{border-bottom:1px solid #e8ebf0;padding:15px 0}.qaAnswer{font-weight:900}.qaDetail{color:#566173;line-height:1.6}.reviewMark{display:inline-block;margin-left:7px;color:#087a38;font-weight:900}.hidden{display:none!important}@media(max-width:600px){.qaChoices{grid-template-columns:1fr}.qaCard{padding:16px}}</style></head><body><div id="header"></div><main class="shell"><section class="qaHero"><div class="eyebrow">Q&A STUDY</div><h1>QA暗記モード</h1><p>複数の選択肢から正解を選択。復習したい問題には○マークを付けられます。</p></section><div class="qaModes"><button class="qaBtn active" data-mode="quiz">回答する</button><button class="qaBtn" data-mode="list">答え・解説一覧</button><button class="qaBtn" data-mode="hidden">非表示問題</button></div><div class="qaActions"><button id="restore" class="qaBtn">すべて戻す</button><span id="hiddenCount" class="qaMeta"></span></div><div id="genres" class="qaGenres"></div><div id="content"></div></main><script src="site.js?v=20261001-navfix"></script><script>document.getElementById('header').innerHTML=KadenSite.nav('qa');</script><script src="nav_qa_patch.js?v=20261001-navfix2"></script><script>var data=[],genre='すべて',mode='quiz',pool=[],idx=0,correct=0,answered=0,listSort='all',STORE='kadenQaHiddenV1',MARK='kadenQaReviewMarksV1';function e(s){return KadenSite.esc(s)}function norm(s){return String(s||'').toLowerCase().replace(/[\s　・。,.、]/g,'')}function key(x){return(x.genre||'')+'||'+(x.q||'')}function readStore(name){try{return JSON.parse(localStorage.getItem(name)||'[]')}catch(_){return[]}}function hidden(){return readStore(STORE)}function marks(){return readStore(MARK)}function isHidden(x){return hidden().indexOf(key(x))>=0}function isMarked(x){return marks().indexOf(key(x))>=0}function visible(){return data.filter(function(x){return!isHidden(x)})}function filtered(){var d=visible();return genre==='すべて'?d:d.filter(function(x){return x.genre===genre})}function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}function answer(x){return String((x.answers&&x.answers[0])||x.answer||'').trim()}function build(){pool=shuffle(filtered());idx=0;correct=0;answered=0}function hide(x){var h=hidden();if(h.indexOf(key(x))<0)h.push(key(x));localStorage.setItem(STORE,JSON.stringify(h));build();genres();render()}function restoreOne(x){localStorage.setItem(STORE,JSON.stringify(hidden().filter(function(k){return k!==key(x)})));build();genres();render()}function toggleMark(x){var m=marks(),k=key(x),i=m.indexOf(k);if(i>=0)m.splice(i,1);else m.push(k);localStorage.setItem(MARK,JSON.stringify(m));render()}function choices(x){var a=answer(x),seen={};seen[norm(a)]=1;var same=shuffle(data.filter(function(y){return y.genre===x.genre&&key(y)!==key(x)}).map(answer));var all=same.concat(shuffle(data.map(answer))),out=[];all.forEach(function(v){var n=norm(v);if(out.length<3&&n&&!seen[n]){seen[n]=1;out.push(v)}});['温度','重量','熱風','省エネ性能','処理能力','設置条件'].forEach(function(v){if(out.length<3&&!seen[norm(v)])out.push(v)});return shuffle([a].concat(out.slice(0,3)))}function genres(){var gs=['すべて'].concat(visible().map(function(x){return x.genre}).filter(function(x,i,a){return a.indexOf(x)===i}));if(gs.indexOf(genre)<0)genre='すべて';document.getElementById('genres').innerHTML=gs.map(function(g){return'<button class="qaBtn '+(g===genre?'active':'')+'" data-g="'+e(g)+'">'+e(g)+'</button>'}).join('');document.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){genre=b.dataset.g;build();genres();render()}});var n=data.filter(isHidden).length;document.getElementById('hiddenCount').textContent=n?n+'問を非表示中':'非表示なし'}function renderQuiz(){var box=document.getElementById('content');if(!pool.length){box.innerHTML='<div class="qaCard">表示する問題がありません。</div>';return}if(idx<0)idx=0;if(idx>=pool.length)idx=pool.length-1;var x=pool[idx],cs=choices(x),ca=norm(answer(x));box.innerHTML='<div class="qaCard"><div class="qaMeta">'+e(x.genre)+' ・ '+(idx+1)+' / '+pool.length+'　正解 '+correct+' / '+answered+(isMarked(x)?'<span class="reviewMark">○ 復習</span>':'')+'</div><div class="qaQ">'+e(x.q)+'</div><div class="qaBlank">'+e(x.blank)+'</div><div class="qaChoices">'+cs.map(function(c){return'<button class="qaChoice" data-c="'+e(c)+'">'+e(c)+'</button>'}).join('')+'</div><div class="qaActions"><button id="prev" class="qaBtn" '+(idx===0?'disabled':'')+'>← 前の問題</button><button id="show" class="qaBtn">答えを見る</button><button id="next" class="qaBtn">次の問題 →</button><button id="mark" class="qaBtn '+(isMarked(x)?'marked':'')+'">○ '+(isMarked(x)?'復習マーク済み':'あとで見返す')+'</button><button id="remove" class="qaBtn">この問題はいらない</button></div><div id="result"></div></div>';var done=false;function finish(v,reveal){if(done)return;done=true;var ok=!reveal&&norm(v)===ca;if(!reveal){answered++;if(ok)correct++}document.querySelectorAll('[data-c]').forEach(function(b){b.disabled=true;if(norm(b.dataset.c)===ca)b.classList.add('correct');else if(!reveal&&norm(b.dataset.c)===norm(v))b.classList.add('wrong')});document.getElementById('result').innerHTML='<div class="qaResult"><b>'+(reveal?'答え':ok?'○ 正解':'× 不正解')+'：</b> '+e(x.answer)+'<br>'+e(x.detail)+'</div>'}document.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){finish(b.dataset.c,false)}});document.getElementById('show').onclick=function(){finish('',true)};document.getElementById('prev').onclick=function(){if(idx>0){idx--;renderQuiz()}};document.getElementById('next').onclick=function(){if(idx<pool.length-1)idx++;else idx=0;renderQuiz()};document.getElementById('mark').onclick=function(){toggleMark(x)};document.getElementById('remove').onclick=function(){hide(x)}}function renderList(){var xs=filtered();if(listSort==='marked')xs=xs.filter(isMarked);else if(listSort==='unmarked')xs=xs.filter(function(x){return!isMarked(x)});document.getElementById('content').innerHTML='<div class="listTools"><button class="qaBtn '+(listSort==='all'?'active':'')+'" data-sort="all">すべて</button><button class="qaBtn '+(listSort==='marked'?'active':'')+'" data-sort="marked">○ 復習マーク</button><button class="qaBtn '+(listSort==='unmarked'?'active':'')+'" data-sort="unmarked">未マーク</button></div><div class="qaCard">'+(xs.length?xs.map(function(x){return'<div class="qaListItem"><div class="qaMeta">'+e(x.genre)+(isMarked(x)?'<span class="reviewMark">○ 復習</span>':'')+'</div><h3>'+e(x.q)+'</h3><div class="qaAnswer">答え：'+e(x.answer)+'</div><div class="qaDetail">'+e(x.detail)+'</div></div>'}).join(''):'該当する問題はありません。')+'</div>';document.querySelectorAll('[data-sort]').forEach(function(b){b.onclick=function(){listSort=b.dataset.sort;renderList()}})}function renderHidden(){var xs=data.filter(isHidden);document.getElementById('content').innerHTML='<div class="qaCard">'+(xs.length?xs.map(function(x,i){return'<div class="qaListItem"><div class="qaMeta">'+e(x.genre)+'</div><h3>'+e(x.q)+'</h3><div class="qaAnswer">答え：'+e(x.answer)+'</div><div class="qaDetail">'+e(x.detail)+'</div><button class="qaBtn itemBtn" data-i="'+i+'">この問題だけ戻す</button></div>'}).join(''):'非表示問題はありません。')+'</div>';document.querySelectorAll('.itemBtn').forEach(function(b){b.onclick=function(){restoreOne(xs[+b.dataset.i])}})}function render(){document.getElementById('genres').classList.toggle('hidden',mode==='hidden');if(mode==='quiz')renderQuiz();else if(mode==='list')renderList();else renderHidden()}document.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(function(x){x.classList.toggle('active',x===b)});render()}});document.getElementById('restore').onclick=function(){if(confirm('非表示にした問題をすべて戻しますか？')){localStorage.removeItem(STORE);build();genres();render()}};Promise.all(['qa_data.json','qa_microwave_toaster.json','qa_expansion_01.json','qa_expansion_02.json','qa_expansion_03.json','qa_expansion_04.json','qa_expansion_05.json','qa_expansion_06.json'].map(function(f){return fetch(f+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():[]}).catch(function(){return[]})) ).then(function(p){data=p.reduce(function(a,b){return a.concat(Array.isArray(b)?b:[])},[]);build();genres();render()});</script></body></html>
